version: '3.8'

# ========================================
# DOCKER COMPOSE PARA PROCESSAMENTO DE DOCUMENTOS
# Serviços essenciais: Redis + PostgreSQL + MinIO (opcional)
# ========================================

services:
  # ========================================
  # POSTGRESQL - Banco de Dados
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: secured-guard-postgres-dev
    environment:
      POSTGRES_DB: secured_guard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - secured-guard-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # REDIS - OBRIGATÓRIO para processamento de documentos
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: secured-guard-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - secured-guard-dev
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # MINIO - Opcional (para armazenamento S3-compatible)
  # Se não usar, o sistema usa armazenamento local
  # ========================================
  minio:
    image: minio/minio:latest
    container_name: secured-guard-minio-dev
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console Web
    volumes:
      - minio_data_dev:/data
    networks:
      - secured-guard-dev
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

# ========================================
# VOLUMES
# ========================================
volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  minio_data_dev:
    driver: local

# ========================================
# NETWORKS
# ========================================
networks:
  secured-guard-dev:
    driver: bridge

