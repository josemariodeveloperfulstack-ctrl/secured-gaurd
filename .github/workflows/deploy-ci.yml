name: Deploy CI

on:
  push:
    branches:
      - ci

concurrency:
  group: deploy-ci
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_CI }}
          username: ${{ secrets.VPS_USER_CI }}
          password: ${{ secrets.VPS_PASSWORD_CI }}
          port: ${{ secrets.VPS_SSH_PORT_CI || 22 }}
          script: |
            set -e
            APP_PATH="${{ secrets.VPS_APP_PATH_CI }}"
            if [ -z "$APP_PATH" ]; then APP_PATH="/var/www/secured_guard/ci"; fi
            cd "$APP_PATH"
            git pull https://${{ secrets.USER_GITHUB }}:${{ secrets.TOKEN_GITHUB }}@github.com/zemarioramos/secured-guard.git ci
            cd deploy
            docker-compose -f docker-compose.env-ci.yml build --no-cache backend-ci frontend-ci
            docker-compose -f docker-compose.env-ci.yml up -d --force-recreate
