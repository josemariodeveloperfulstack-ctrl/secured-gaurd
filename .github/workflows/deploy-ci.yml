# Deploy CI (git pull na VPS + build local).
# Para push na branch `ci`, use deploy-ci-docker.yml (build no Actions + imagens Docker Hub).
# Este workflow dispara em `prod` (atualiza ambiente CI com código de prod) ou manualmente.
#
# Secrets obrigatórios:
#   TOKEN_GITHUB — Personal Access Token (NÃO use senha da conta GitHub)
#     Classic: https://github.com/settings/tokens → scope "repo"
#     Fine-grained: Contents = Read-only no repositório secured-guard
#   VPS_HOST_CI, VPS_USER_CI, VPS_PASSWORD_CI
name: Deploy CI

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-ci
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validar secrets de autenticação Git
        run: |
          if [ -z "${{ secrets.TOKEN_GITHUB }}" ]; then
            echo "::error::Secret TOKEN_GITHUB não configurado."
            echo "Crie um PAT em GitHub → Settings → Developer settings → Personal access tokens"
            echo "Scope: repo (classic) ou Contents read (fine-grained). NÃO use a senha da conta."
            exit 1
          fi
          echo "✅ TOKEN_GITHUB está definido"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_PAT: ${{ secrets.TOKEN_GITHUB }}
        with:
          host: ${{ secrets.VPS_HOST_CI }}
          username: ${{ secrets.VPS_USER_CI }}
          password: ${{ secrets.VPS_PASSWORD_CI }}
          port: ${{ secrets.VPS_SSH_PORT_CI || 22 }}
          command_timeout: 20m
          envs: GITHUB_PAT
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            APP_PATH="${{ secrets.VPS_APP_PATH_CI }}"
            if [ -z "$APP_PATH" ]; then APP_PATH="/var/www/secured_guard/ci"; fi

            echo "🚀 Iniciando deploy | Branch: $BRANCH | Path: $APP_PATH"

            if [ -z "$GITHUB_PAT" ]; then
              echo "❌ GITHUB_PAT não chegou na VPS. Verifique o secret TOKEN_GITHUB no repositório."
              exit 1
            fi

            # Verificar se o diretório existe
            if [ ! -d "$APP_PATH" ]; then
              echo "❌ ERRO: Diretório $APP_PATH não existe na VPS!"
              echo "💡 Execute manualmente: mkdir -p $APP_PATH && git clone <repo> $APP_PATH"
              exit 1
            fi

            cd "$APP_PATH"

            # x-access-token funciona com PAT classic e fine-grained (não use senha da conta)
            git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/${{ github.repository }}.git"

            echo "📥 Fazendo fetch de origin/$BRANCH..."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git checkout "$BRANCH"

            echo "📍 Deploying commit: $(git log -1 --oneline)"

            cd deploy
            echo "🐳 Build dos containers..."
            docker-compose -f docker-compose.env-ci.yml build --no-cache backend-ci frontend-ci
            docker-compose -f docker-compose.env-ci.yml up -d --force-recreate

            echo "✅ Deploy concluído com sucesso!"
