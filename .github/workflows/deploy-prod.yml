name: Deploy PROD Environment

on:
  push:
    branches: [ main, master, production ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/docker-compose.prod-final.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'prod'
        type: choice
        options:
        - prod
      confirm_deploy:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate deployment confirmation
      if: github.event_name == 'workflow_dispatch'
      run: |
        if [ "${{ github.event.inputs.confirm_deploy }}" != "DEPLOY" ]; then
          echo "❌ Deployment not confirmed. Please type 'DEPLOY' to confirm."
          exit 1
        fi
        
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
        
    - name: Deploy to PROD Environment
      run: |
        # Configurações
        VPS_HOST="${{ secrets.VPS_HOST }}"
        VPS_USER="${{ secrets.VPS_USER }}"
        VPS_PORT="${{ secrets.VPS_PORT }}"
        
        echo "🚀 Deploying to PROD Environment..."
        echo "⚠️  PRODUCTION DEPLOYMENT - This will affect live users!"
        
        # Adicionar host conhecido
        ssh-keyscan -p $VPS_PORT $VPS_HOST >> ~/.ssh/known_hosts
        
        # Fazer backup completo do banco de produção
        ssh -p $VPS_PORT $VPS_USER@$VPS_HOST "cd /opt/secured-guard && docker exec secured-guard-db-prod pg_dump -U postgres secured_guard > backups/prod_backup_$(date +%Y%m%d_%H%M%S).sql"
        
        # Parar containers existentes
        ssh -p $VPS_PORT $VPS_USER@$VPS_HOST "cd /opt/secured-guard && docker-compose -f deploy/docker-compose.prod-final.yml down" || true
        
        # Copiar código atualizado
        rsync -avz --delete \
          --exclude='.git/' \
          --exclude='node_modules/' \
          --exclude='target/' \
          --exclude='*.log' \
          --exclude='uploads/' \
          --exclude='logs/' \
          --exclude='backups/' \
          -e "ssh -p $VPS_PORT" \
          ./ $VPS_USER@$VPS_HOST:/opt/secured-guard/
        
        # Build e subir containers
        ssh -p $VPS_PORT $VPS_USER@$VPS_HOST "cd /opt/secured-guard && docker-compose -f deploy/docker-compose.prod-final.yml up -d --build"
        
        # Aguardar serviços ficarem prontos
        sleep 30
        
        # Verificar status
        ssh -p $VPS_PORT $VPS_USER@$VPS_HOST "cd /opt/secured-guard && docker-compose -f deploy/docker-compose.prod-final.yml ps"
        
        # Testar endpoints
        ssh -p $VPS_PORT $VPS_USER@$VPS_HOST "curl -f https://prod.z7botsolutions.com.br/api/actuator/health || echo 'Backend health check failed'"
        ssh -p $VPS_PORT $VPS_USER@$VPS_HOST "curl -f https://prod.z7botsolutions.com.br/ || echo 'Frontend health check failed'"
        
        echo "✅ PROD Environment deployed successfully!"
        echo "🌐 Access: https://prod.z7botsolutions.com.br"
        echo "📊 Backend API: https://prod.z7botsolutions.com.br/api"
