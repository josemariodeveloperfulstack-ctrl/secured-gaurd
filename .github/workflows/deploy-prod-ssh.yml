name: 🚀 Deploy PROD (Git Pull Strategy)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  ENVIRONMENT: prod
  APP_URL: https://securedguard.z7botsolutions.com.br

jobs:
  deploy:
    name: 🚀 Deploy to PROD VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via SSH (Native OpenSSH)
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD_PROD }}
          VPS_USER: ${{ secrets.VPS_USER_PROD }}
          VPS_HOST: ${{ secrets.VPS_HOST_PROD }}
          # Secrets as env vars for safer passing
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD_PROD }}
          RD_PASS: ${{ secrets.REDIS_PASSWORD_PROD }}
          JWT_SEC: ${{ secrets.JWT_SECRET_PROD }}
          ML_HOST: ${{ secrets.MAIL_HOST }}
          ML_PORT: ${{ secrets.MAIL_PORT }}
          ML_USER: ${{ secrets.MAIL_USERNAME }}
          ML_PASS: ${{ secrets.MAIL_PASSWORD }}
          GIT_USER: ${{ secrets.USER_GITHUB }}
          GIT_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          echo "🔍 Step 1: Connectivity check (Port 22)"
          nc -zv -w 5 $VPS_HOST 22 || echo "⚠️ Warning: Cannot connect to $VPS_HOST on port 22. This might explain the timeout/reset."
          
          echo "🔍 Step 2: Detailed SSH Debug Handshake"
          sshpass -p "$VPS_PASSWORD" ssh -vvv -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "echo 'SSH Connection Successful!'" || {
            echo "❌ Detailed SSH Handshake failed. Check logs above for 'connection reset' or 'denied' messages."
          }

          echo "🚀 Step 3: Executing Deployment Script"
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            PG_PASS="$PG_PASS" RD_PASS="$RD_PASS" JWT_SEC="$JWT_SEC" \
            ML_HOST="$ML_HOST" ML_PORT="$ML_PORT" ML_USER="$ML_USER" ML_PASS="$ML_PASS" \
            GIT_USER="$GIT_USER" GIT_TOKEN="$GIT_TOKEN" \
            'bash -s' << 'EOF'
              set -e
              cd /var/www/secured_guard/prod

              # 1. Update .env safely using printf to handle any character
              printf "POSTGRES_PASSWORD_PROD=%s\n" "$PG_PASS" > deploy/.env
              printf "REDIS_PASSWORD_PROD=%s\n" "$RD_PASS" >> deploy/.env
              printf "JWT_SECRET_PROD=%s\n" "$JWT_SEC" >> deploy/.env
              printf "MAIL_HOST=%s\n" "$ML_HOST" >> deploy/.env
              printf "MAIL_PORT=%s\n" "$ML_PORT" >> deploy/.env
              printf "MAIL_USERNAME=%s\n" "$ML_USER" >> deploy/.env
              printf "MAIL_PASSWORD=%s\n" "$ML_PASS" >> deploy/.env

              # 2. Get latest code
              git pull https://$GIT_USER:$GIT_TOKEN@github.com/zmarioramos/secured-guard.git prod

              # 3. Create network if missing
              if ! docker network ls | grep -q "secured-guard"; then
                docker network create secured-guard
              fi

              # 4. Build and Restart
              cd deploy
              docker-compose -f docker-compose.prod.yml build --no-cache
              docker-compose -f docker-compose.prod.yml up -d --force-recreate
          EOF
      - name: 🏥 Health Check
        run: |
          echo "⏳ Waiting for service startup (60s)..."
          sleep 60

          for i in {1..10}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://securedguard.z7botsolutions.com.br/api/health || echo 000)
            echo "Attempt $i - HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ PROD Deployment Successful!"
              exit 0
            fi
            sleep 10
          done

          echo "❌ Health check failed after 10 attempts."
