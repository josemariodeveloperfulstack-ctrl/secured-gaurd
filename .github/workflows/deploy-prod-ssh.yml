name: 🚀 Deploy PROD (Git Pull Strategy)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  ENVIRONMENT: prod
  APP_URL: https://securedguard.z7botsolutions.com.br

jobs:
  deploy:
    name: 🚀 Deploy to PROD VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Pass secrets as environment variables to avoid shell expansion issues
          POSTGRES_PASSWORD_PROD: ${{ secrets.POSTGRES_PASSWORD_PROD }}
          REDIS_PASSWORD_PROD: ${{ secrets.REDIS_PASSWORD_PROD }}
          JWT_SECRET_PROD: ${{ secrets.JWT_SECRET_PROD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          USER_GITHUB: ${{ secrets.USER_GITHUB }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
        with:
          host: ${{ secrets.VPS_HOST_PROD }}
          username: ${{ secrets.VPS_USER_PROD }}
          password: ${{ secrets.VPS_PASSWORD_PROD }}
          port: ${{ secrets.VPS_SSH_PORT_PROD || 22 }}
          envs: POSTGRES_PASSWORD_PROD,REDIS_PASSWORD_PROD,JWT_SECRET_PROD,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,USER_GITHUB,TOKEN_GITHUB
          script: |
            set -e
            cd /var/www/secured_guard/prod

            # 1. Update .env file safely (using quoted heredoc to prevent expansion)
            cat <<'EOF' > deploy/.env
            # Generated by GitHub Actions
            EOF

            # Function to safely append variables
            append_env() {
              local var_name=$1
              local var_val=$2
              printf "%s=%s\n" "$var_name" "$var_val" >> deploy/.env
            }

            append_env "POSTGRES_PASSWORD_PROD" "$POSTGRES_PASSWORD_PROD"
            append_env "REDIS_PASSWORD_PROD" "$REDIS_PASSWORD_PROD"
            append_env "JWT_SECRET_PROD" "$JWT_SECRET_PROD"
            append_env "MAIL_HOST" "$MAIL_HOST"
            append_env "MAIL_PORT" "$MAIL_PORT"
            append_env "MAIL_USERNAME" "$MAIL_USERNAME"
            append_env "MAIL_PASSWORD" "$MAIL_PASSWORD"

            # 2. Get latest code using Token
            git pull https://$USER_GITHUB:$TOKEN_GITHUB@github.com/zmarioramos/secured-guard.git prod

            # 3. Ensure Docker network exists
            if ! docker network ls | grep -q "secured-guard"; then
              docker network create secured-guard
            fi

            # 4. Build and Restart services
            cd deploy
            docker-compose -f docker-compose.prod.yml build --no-cache
            docker-compose -f docker-compose.prod.yml up -d --force-recreate

      - name: 🏥 Health Check
        run: |
          echo "⏳ Waiting for service startup (60s)..."
          sleep 60

          for i in {1..10}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://securedguard.z7botsolutions.com.br/api/health || echo 000)
            echo "Attempt $i - HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ PROD Deployment Successful!"
              exit 0
            fi
            sleep 10
          done

          echo "❌ Health check failed after 10 attempts."
