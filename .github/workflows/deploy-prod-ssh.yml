name: 🚀 Deploy PROD (Git Pull Strategy)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  ENVIRONMENT: prod
  APP_URL: https://securedguard.z7botsolutions.com.br

jobs:
  deploy:
    name: 🚀 Deploy to PROD VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via SSH (Native OpenSSH)
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD_PROD }}
          VPS_USER: ${{ secrets.VPS_USER_PROD }}
          VPS_HOST: ${{ secrets.VPS_HOST_PROD }}
          # Secrets as env vars for safer passing
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD_PROD }}
          RD_PASS: ${{ secrets.REDIS_PASSWORD_PROD }}
          JWT_SEC: ${{ secrets.JWT_SECRET_PROD }}
          ML_HOST: ${{ secrets.MAIL_HOST }}
          ML_PORT: ${{ secrets.MAIL_PORT }}
          ML_USER: ${{ secrets.MAIL_USERNAME }}
          ML_PASS: ${{ secrets.MAIL_PASSWORD }}
          GIT_USER: ${{ secrets.USER_GITHUB }}
          GIT_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          # 1. Create .env file locally on runner
          # Use printf to avoid shell expansion issues with sensitive characters
          {
            printf "POSTGRES_PASSWORD_PROD=%s\n" "$PG_PASS"
            printf "REDIS_PASSWORD_PROD=%s\n" "$RD_PASS"
            printf "JWT_SECRET_PROD=%s\n" "$JWT_SEC"
            printf "MAIL_HOST=%s\n" "$ML_HOST"
            printf "MAIL_PORT=%s\n" "$ML_PORT"
            printf "MAIL_USERNAME=%s\n" "$ML_USER"
            printf "MAIL_PASSWORD=%s\n" "$ML_PASS"
          } > .prod.env

          # 2. Transfer .env file and run deployment commands
          # SSH_OPTS to handle known_hosts and connection stability
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30"
          
          echo "📤 Transferring .env file to VPS..."
          sshpass -p "$VPS_PASSWORD" scp $SSH_OPTS .prod.env "$VPS_USER@$VPS_HOST:/var/www/secured_guard/prod/deploy/.env"

          echo "🚀 Executing remote deployment commands..."
          sshpass -p "$VPS_PASSWORD" ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e
            cd /var/www/secured_guard/prod

            # Update latest code
            git pull https://${GIT_USER}:${GIT_TOKEN}@github.com/zmarioramos/secured-guard.git prod

            # Ensure network exists
            if ! docker network ls | grep -q "secured-guard"; then
              docker network create secured-guard
            fi

            # Build and Restart
            cd deploy
            docker-compose -f docker-compose.prod.yml build --no-cache
            docker-compose -f docker-compose.prod.yml up -d --force-recreate
          EOF
      - name: 🏥 Health Check
        run: |
          echo "⏳ Waiting for service startup (60s)..."
          sleep 60

          for i in {1..10}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://securedguard.z7botsolutions.com.br/api/health || echo 000)
            echo "Attempt $i - HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ PROD Deployment Successful!"
              exit 0
            fi
            sleep 10
          done

          echo "❌ Health check failed after 10 attempts."
