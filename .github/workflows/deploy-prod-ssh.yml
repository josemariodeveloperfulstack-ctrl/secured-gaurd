name: 🚀 Deploy PROD (Git Pull Strategy)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  ENVIRONMENT: prod
  APP_URL: https://securedguard.z7botsolutions.com.br

jobs:
  deploy:
    name: 🚀 Deploy to PROD VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_PROD }}
          username: ${{ secrets.VPS_USER_PROD }}
          password: ${{ secrets.VPS_PASSWORD_PROD }}
          port: ${{ secrets.VPS_SSH_PORT_PROD || 22 }}
          script: |
            set -e
            cd /var/www/secured_guard/prod

            # 1. Update .env file with production secrets
            echo "POSTGRES_PASSWORD_PROD=${{ secrets.POSTGRES_PASSWORD_PROD }}" > deploy/.env
            echo "REDIS_PASSWORD_PROD=${{ secrets.REDIS_PASSWORD_PROD }}" >> deploy/.env
            echo "JWT_SECRET_PROD=${{ secrets.JWT_SECRET_PROD }}" >> deploy/.env
            echo "MAIL_HOST=${{ secrets.MAIL_HOST }}" >> deploy/.env
            echo "MAIL_PORT=${{ secrets.MAIL_PORT }}" >> deploy/.env
            echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> deploy/.env
            echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> deploy/.env

            # 2. Get latest code using Token to avoid SSH auth issues
            git pull https://${{ secrets.USER_GITHUB }}:${{ secrets.TOKEN_GITHUB }}@github.com/zmarioramos/secured-guard.git prod

            # 3. Ensure Docker network exists
            if ! docker network ls | grep -q "secured-guard"; then
              docker network create secured-guard
            fi

            # 4. Build and Restart services
            cd deploy
            docker-compose -f docker-compose.prod.yml build --no-cache
            docker-compose -f docker-compose.prod.yml up -d --force-recreate

      - name: 🏥 Health Check
        run: |
          echo "⏳ Waiting for service startup (60s)..."
          sleep 60

          for i in {1..10}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://securedguard.z7botsolutions.com.br/api/health || echo 000)
            echo "Attempt $i - HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ PROD Deployment Successful!"
              exit 0
            fi
            sleep 10
          done

          echo "❌ Health check failed after 10 attempts."
