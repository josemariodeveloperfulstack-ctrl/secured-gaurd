# 🔐 Template de Secrets para GitHub Actions
# 
# IMPORTANTE: Este arquivo é apenas um template!
# NÃO adicione valores reais aqui - use os secrets do GitHub.
#
# Para configurar os secrets:
# 1. Vá para Settings → Secrets and variables → Actions
# 2. Clique em "New repository secret"
# 3. Adicione cada secret listado abaixo

# ========================================
# SECRETS OBRIGATÓRIOS
# ========================================

# VPS_SSH_PRIVATE_KEY
# Descrição: Chave privada SSH para acessar o VPS
# Como obter:
#   - No seu computador: cat ~/.ssh/id_rsa
#   - Ou gere uma nova: ssh-keygen -t rsa -b 4096
#   - Copie TODO o conteúdo da chave (incluindo -----BEGIN/END-----)

# VPS_USER
# Descrição: Usuário SSH do VPS
# Exemplos: root, ubuntu, admin
# Como obter: O usuário que você usa para conectar via SSH

# VPS_HOST
# Descrição: IP ou domínio do VPS
# Exemplos: 192.168.1.100, meuservidor.com, vps.exemplo.net
# Como obter: O endereço que você usa para conectar via SSH

# ========================================
# SECRETS OPCIONAIS (para funcionalidades extras)
# ========================================

# SLACK_WEBHOOK_URL
# Descrição: URL do webhook do Slack para notificações
# Como obter: Slack App → Incoming Webhooks → Add to Slack

# EMAIL_SMTP_HOST
# Descrição: Servidor SMTP para notificações por email
# Exemplo: smtp.gmail.com

# EMAIL_SMTP_USER
# Descrição: Usuário do email para notificações
# Exemplo: notifications@meudominio.com

# EMAIL_SMTP_PASSWORD
# Descrição: Senha do email para notificações
# Como obter: Use senha de app se for Gmail

# ========================================
# COMO TESTAR OS SECRETS
# ========================================

# 1. Teste SSH localmente:
#    ssh usuario@ip-do-vps "echo 'Conexão OK'"

# 2. Teste no GitHub Actions:
#    - Execute o workflow manualmente
#    - Verifique se a conexão SSH funciona

# 3. Verifique os logs:
#    - GitHub Actions → Seu workflow → Ver logs
#    - VPS: docker-compose logs

# ========================================
# EXEMPLO DE CONFIGURAÇÃO SSH
# ========================================

# No seu computador local:
# ssh-keygen -t rsa -b 4096 -C "github-actions@secured-guard"
# ssh-copy-id -i ~/.ssh/id_rsa.pub usuario@ip-do-vps
# cat ~/.ssh/id_rsa  # Copie este conteúdo para VPS_SSH_PRIVATE_KEY

# No VPS:
# sudo mkdir -p /opt/secured-guard
# sudo chown $USER:$USER /opt/secured-guard

# ========================================
# SEGURANÇA
# ========================================

# ⚠️  IMPORTANTE:
# - NUNCA commite chaves privadas no código
# - Use apenas os secrets do GitHub
# - Mantenha as chaves SSH seguras
# - Revogue chaves comprometidas imediatamente
# - Use chaves diferentes para cada ambiente

# ========================================
# TROUBLESHOOTING
# ========================================

# Problema: "Permission denied (publickey)"
# Solução: 
#   1. Verifique se VPS_SSH_PRIVATE_KEY está correto
#   2. Teste SSH localmente primeiro
#   3. Verifique se a chave pública está no VPS

# Problema: "Connection refused"
# Solução:
#   1. Verifique VPS_HOST e VPS_USER
#   2. Teste conectividade: ping ip-do-vps
#   3. Verifique firewall do VPS

# Problema: "No such file or directory"
# Solução:
#   1. Verifique se o diretório /opt/secured-guard existe no VPS
#   2. Verifique permissões do diretório
