name: Deploy DEV Environment

on:
  push:
    branches: [ develop, dev ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/docker-compose.dev-domains.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
        
    - name: Deploy to DEV Environment
      run: |
        # Configurações
        VPS_HOST="${{ secrets.VPS_HOST }}"
        VPS_USER="${{ secrets.VPS_USER }}"
        VPS_PORT="${{ secrets.VPS_PORT }}"
        
        echo "🚀 Deploying to DEV Environment..."
        
        # Adicionar host conhecido
        ssh-keyscan -p $VPS_PORT $VPS_HOST >> ~/.ssh/known_hosts
        
        # Parar containers existentes
        ssh -p $VPS_PORT $VPS_USER@$VPS_HOST "cd /opt/secured-guard && docker-compose -f deploy/docker-compose.dev-domains.yml down" || true
        
        # Fazer backup do banco antes do deploy
        ssh -p $VPS_PORT $VPS_USER@$VPS_HOST "cd /opt/secured-guard && docker exec secured-guard-db-dev pg_dump -U postgres secured_guard_dev > backups/dev_backup_$(date +%Y%m%d_%H%M%S).sql" || true
        
        # Copiar código atualizado
        rsync -avz --delete \
          --exclude='.git/' \
          --exclude='node_modules/' \
          --exclude='target/' \
          --exclude='*.log' \
          --exclude='uploads/' \
          --exclude='logs/' \
          --exclude='backups/' \
          -e "ssh -p $VPS_PORT" \
          ./ $VPS_USER@$VPS_HOST:/opt/secured-guard/
        
        # Build e subir containers
        ssh -p $VPS_PORT $VPS_USER@$VPS_HOST "cd /opt/secured-guard && docker-compose -f deploy/docker-compose.dev-domains.yml up -d --build"
        
        # Verificar status
        ssh -p $VPS_PORT $VPS_USER@$VPS_HOST "cd /opt/secured-guard && docker-compose -f deploy/docker-compose.dev-domains.yml ps"
        
        echo "✅ DEV Environment deployed successfully!"
        echo "🌐 Access: https://dev.z7botsolutions.com.br"
