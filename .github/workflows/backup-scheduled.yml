name: 💾 Backup Agendado (Todos os Ambientes)

on:
  schedule:
    # CI: Todo dia à meia-noite
    - cron: '0 0 * * *'
    # PROD: Todo dia às 2h (incremental)
    - cron: '0 2 * * *'
    # PROD: Domingo à 1h (full)
    - cron: '0 1 * * 0'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para backup'
        required: true
        default: 'prod'
        type: choice
        options:
          - ci
          - dev
          - test
          - prod
      backup_type:
        description: 'Tipo de backup'
        required: true
        default: 'incremental'
        type: choice
        options:
          - full
          - incremental

jobs:
  backup:
    name: 💾 Executar Backup
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔍 Determinar Ambiente e Tipo
        id: config
        run: |
          HOUR=$(date +%H)
          DAY=$(date +%u)
          
          # Lógica baseada no horário
          if [ "$HOUR" -eq 0 ]; then
            ENV="ci"
            TYPE="logs_only"
          elif [ "$HOUR" -eq 1 ] && [ "$DAY" -eq 7 ]; then
            ENV="prod"
            TYPE="full"
          elif [ "$HOUR" -eq 2 ]; then
            ENV="prod"
            TYPE="incremental"
          else
            ENV="${{ github.event.inputs.environment || 'prod' }}"
            TYPE="${{ github.event.inputs.backup_type || 'incremental' }}"
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "backup_type=$TYPE" >> $GITHUB_OUTPUT
          echo "📋 Ambiente: $ENV"
          echo "📋 Tipo: $TYPE"

      - name: 💾 Executar Backup via API
        run: |
          echo "💾 Iniciando backup ${{ steps.config.outputs.backup_type }} para ${{ steps.config.outputs.environment }}..."
          
          API_URL="${{ secrets.API_URL }}"
          ENV="${{ steps.config.outputs.environment }}"
          
          RESPONSE=$(curl -X POST \
            -H "Authorization: Bearer ${{ secrets.API_ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"environment\": \"$ENV\", \"type\": \"${{ steps.config.outputs.backup_type }}\"}" \
            "$API_URL/api/backup/execute/env/$ENV" \
            -w "\n%{http_code}" -s)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Backup executado com sucesso!"
            echo "📦 $BODY"
          else
            echo "❌ Falha no backup!"
            echo "HTTP Code: $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

      - name: 🔍 Verificar Integridade
        run: |
          echo "🔍 Verificando integridade do backup..."
          
          # Buscar último backup
          RESPONSE=$(curl -X GET \
            -H "Authorization: Bearer ${{ secrets.API_ADMIN_TOKEN }}" \
            "${{ secrets.API_URL }}/api/backup/history?limit=1&environment=${{ steps.config.outputs.environment }}" \
            -s)
          
          # Extrair checksum
          CHECKSUM=$(echo "$RESPONSE" | jq -r '.[0].checksum')
          
          if [ "$CHECKSUM" != "null" ] && [ -n "$CHECKSUM" ]; then
            echo "✅ Checksum verificado: $CHECKSUM"
          else
            echo "⚠️ Checksum não disponível"
          fi

      - name: 📧 Notificar Resultado
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "::notice::✅ Backup ${{ steps.config.outputs.environment }} executado com sucesso!"
          else
            echo "::error::❌ Backup ${{ steps.config.outputs.environment }} falhou!"
          fi

  # ========================================
  # LIMPEZA DE BACKUPS ANTIGOS
  # ========================================
  cleanup:
    name: 🧹 Limpar Backups Antigos
    runs-on: ubuntu-latest
    needs: [backup]
    if: success()
    
    steps:
      - name: 🧹 Executar Limpeza
        run: |
          echo "🧹 Limpando backups antigos..."
          
          # Limpar backups antigos via API
          curl -X DELETE \
            -H "Authorization: Bearer ${{ secrets.API_ADMIN_TOKEN }}" \
            "${{ secrets.API_URL }}/api/backup/clean/${{ steps.config.outputs.environment }}"
          
          echo "✅ Limpeza concluída!"

