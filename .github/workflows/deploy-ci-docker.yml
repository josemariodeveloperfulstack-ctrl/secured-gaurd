name: 🐳 Deploy CI Environment (Docker Compose)

on:
  push:
    branches:
      - ci
  workflow_dispatch:

env:
  ENVIRONMENT: ci
  DEPLOY_PATH: /var/www/secured-guard/ci
  APP_URL: https://ci.z7botsolutions.com.br

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy to CI (Docker)
    runs-on: ubuntu-latest
    
    steps:
      # ============================================
      # 1️⃣ CHECKOUT DO CÓDIGO
      # ============================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ci

      # ============================================
      # 2️⃣ SETUP JAVA 17
      # ============================================
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      # ============================================
      # 3️⃣ SETUP NODE.JS 20
      # ============================================
      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ============================================
      # 4️⃣ BUILD BACKEND (Maven)
      # ============================================
      - name: 🔨 Build Backend (Maven)
        working-directory: ./backend
        run: |
          echo "🔨 Compilando backend para ambiente CI..."
          ./mvnw clean package -DskipTests -Dspring.profiles.active=ci
          echo "✅ Backend compilado com sucesso!"
          ls -lh target/*.jar

      # ============================================
      # 5️⃣ BUILD FRONTEND (Vite)
      # ============================================
      - name: 🎨 Build Frontend (Vite)
        working-directory: ./frontend
        env:
          VITE_API_URL: https://ci.z7botsolutions.com.br/api
          VITE_ENVIRONMENT: ci
        run: |
          echo "🎨 Compilando frontend para ambiente CI..."
          npm ci
          npm run build
          echo "✅ Frontend compilado com sucesso!"
          ls -lh dist/

      # ============================================
      # 6️⃣ BUILD DOCKER IMAGES
      # ============================================
      - name: 🐳 Build Docker images
        run: |
          echo "🐳 Construindo imagens Docker..."
          
          # Build backend image
          docker build -t zemarioramos/secured-guard-backend:ci \
            -f backend/Dockerfile.prod ./backend
          
          # Build frontend image
          docker build -t zemarioramos/secured-guard-frontend:ci \
            -f frontend/Dockerfile.prod ./frontend
          
          echo "✅ Imagens Docker construídas!"

      # ============================================
      # 7️⃣ LOGIN NO DOCKER HUB
      # ============================================
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ============================================
      # 8️⃣ PUSH IMAGES TO DOCKER HUB
      # ============================================
      - name: 📤 Push images to Docker Hub
        run: |
          echo "📤 Enviando imagens para Docker Hub..."
          docker push zemarioramos/secured-guard-backend:ci
          docker push zemarioramos/secured-guard-frontend:ci
          echo "✅ Imagens enviadas com sucesso!"

      # ============================================
      # 9️⃣ CONFIGURAR SSH
      # ============================================
      - name: 🔑 Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_HOST }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # ============================================
      # 🔟 TRANSFERIR ARQUIVOS PARA VPS
      # ============================================
      - name: 📤 Transfer files to VPS
        run: |
          echo "📤 Transferindo arquivos para VPS..."
          
          # Criar diretório de deploy na VPS
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            mkdir -p /var/www/secured-guard/ci
            mkdir -p /var/www/secured-guard/ci/uploads
            mkdir -p /var/www/secured-guard/ci/logs
            mkdir -p /var/www/secured-guard/ci/nginx
          EOF
          
          # Transferir docker-compose.ci.yml
          scp docker-compose.ci.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured-guard/ci/
          
          # Transferir configuração do nginx
          scp nginx/ci.conf \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured-guard/ci/nginx/
          
          echo "✅ Arquivos transferidos com sucesso!"

      # ============================================
      # 1️⃣1️⃣ CRIAR ARQUIVO .ENV NA VPS
      # ============================================
      - name: ⚙️ Create .env file on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "⚙️ Criando arquivo .env..."
            
            cat > /var/www/secured-guard/ci/.env << 'ENVEOF'
# ===== AMBIENTE CI =====
ENVIRONMENT=ci
APP_URL=https://ci.z7botsolutions.com.br

# ===== BANCO DE DADOS =====
POSTGRES_PASSWORD_CI=${{ secrets.POSTGRES_PASSWORD_CI }}

# ===== REDIS =====
REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

# ===== JWT =====
JWT_SECRET=${{ secrets.JWT_SECRET }}

# ===== DOCKER =====
DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}
ENVEOF
            
            chmod 600 /var/www/secured-guard/ci/.env
            echo "✅ Arquivo .env criado!"
          EOF

      # ============================================
      # 1️⃣2️⃣ FAZER BACKUP E PARAR CONTAINERS ANTIGOS
      # ============================================
      - name: 💾 Backup and stop old containers
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "💾 Fazendo backup e parando containers antigos..."
            
            cd /var/www/secured-guard/ci
            
            # Fazer backup dos volumes se existirem
            if [ -d "postgres_ci_data" ]; then
              BACKUP_DIR="/var/www/secured-guard/ci/backups/$(date +'%Y%m%d_%H%M%S')"
              mkdir -p "$BACKUP_DIR"
              cp -r postgres_ci_data "$BACKUP_DIR/" 2>/dev/null || true
              echo "✅ Backup dos dados criado em: $BACKUP_DIR"
            fi
            
            # Parar e remover containers antigos
            docker-compose -f docker-compose.ci.yml down || true
            
            echo "✅ Containers antigos parados!"
          EOF

      # ============================================
      # 1️⃣3️⃣ FAZER PULL DAS NOVAS IMAGENS
      # ============================================
      - name: 📥 Pull new images
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "📥 Fazendo pull das novas imagens..."
            
            cd /var/www/secured-guard/ci
            
            # Login no Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Pull das imagens
            docker pull zemarioramos/secured-guard-backend:ci
            docker pull zemarioramos/secured-guard-frontend:ci
            
            echo "✅ Imagens atualizadas!"
          EOF

      # ============================================
      # 1️⃣4️⃣ INICIAR NOVOS CONTAINERS
      # ============================================
      - name: 🚀 Start new containers
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🚀 Iniciando novos containers..."
            
            cd /var/www/secured-guard/ci
            
            # Iniciar containers
            docker-compose -f docker-compose.ci.yml up -d
            
            echo "⏳ Aguardando containers iniciarem (30s)..."
            sleep 30
            
            # Verificar status dos containers
            docker-compose -f docker-compose.ci.yml ps
            
            echo "✅ Containers iniciados!"
          EOF

      # ============================================
      # 1️⃣5️⃣ HEALTH CHECK
      # ============================================
      - name: 🏥 Health check
        run: |
          echo "🏥 Verificando saúde da aplicação..."
          
          MAX_ATTEMPTS=10
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Tentativa $ATTEMPT de $MAX_ATTEMPTS..."
            
            if curl -f -s -o /dev/null -w "%{http_code}" https://ci.z7botsolutions.com.br/api/health | grep -q "200"; then
              echo "✅ Health check passou! Aplicação está respondendo."
              exit 0
            fi
            
            echo "⏳ Aguardando 10 segundos antes da próxima tentativa..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "❌ Health check falhou após $MAX_ATTEMPTS tentativas!"
          exit 1

      # ============================================
      # 1️⃣6️⃣ CONFIGURAR NGINX
      # ============================================
      - name: 🌐 Configure Nginx
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🌐 Configurando Nginx..."
            
            # Copiar configuração do nginx
            sudo cp /var/www/secured-guard/ci/nginx/ci.conf /etc/nginx/sites-available/secured-guard-ci
            
            # Ativar site
            sudo ln -sf /etc/nginx/sites-available/secured-guard-ci /etc/nginx/sites-enabled/
            
            # Testar configuração
            sudo nginx -t
            
            # Recarregar Nginx
            sudo systemctl reload nginx
            
            echo "✅ Nginx configurado!"
          EOF

      # ============================================
      # 1️⃣7️⃣ NOTIFICAÇÃO DE SUCESSO
      # ============================================
      - name: 🎉 Deployment successful
        if: success()
        run: |
          echo "🎉 ================================"
          echo "✅ DEPLOY CI CONCLUÍDO COM SUCESSO!"
          echo "🐳 Método: Docker Compose"
          echo "🌐 URL: https://ci.z7botsolutions.com.br"
          echo "📅 Data: $(date +'%Y-%m-%d %H:%M:%S')"
          echo "🔖 Commit: ${{ github.sha }}"
          echo "🌿 Branch: ci"
          echo "================================"

      # ============================================
      # ❌ ROLLBACK EM CASO DE FALHA
      # ============================================
      - name: 🔄 Rollback on failure
        if: failure()
        run: |
          echo "❌ Deploy falhou! Iniciando rollback..."
          
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/secured-guard/ci
            
            # Parar containers atuais
            docker-compose -f docker-compose.ci.yml down
            
            # Restaurar backup se existir
            LATEST_BACKUP=$(ls -t /var/www/secured-guard/ci/backups/ | head -1)
            
            if [ -n "$LATEST_BACKUP" ]; then
              echo "🔄 Restaurando backup: $LATEST_BACKUP"
              
              # Restaurar dados do banco
              rm -rf postgres_ci_data
              cp -r "/var/www/secured-guard/ci/backups/$LATEST_BACKUP/postgres_ci_data" ./
              
              # Iniciar containers com versão anterior
              docker-compose -f docker-compose.ci.yml up -d
              
              echo "✅ Rollback concluído!"
            else
              echo "⚠️ Nenhum backup encontrado para rollback"
            fi
          EOF
