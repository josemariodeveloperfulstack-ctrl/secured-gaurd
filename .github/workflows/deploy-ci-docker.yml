name: 🐳 Deploy CI Environment (Docker Compose)

on:
  push:
    branches:
      - ci
      - prod
  workflow_dispatch:

env:
  ENVIRONMENT: ci
  DEPLOY_PATH: /var/www/secured_guard/ci
  APP_URL: https://ci.z7botsolutions.com.br

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy to CI (Docker)
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    
    steps:
      # ============================================
      # CHECKOUT E SETUP (necessários mas não na imagem)
      # ============================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      # ============================================
      # 1️⃣ SETUP NODE.JS 20
      # ============================================
      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ============================================
      # 2️⃣ BUILD BACKEND (Maven)
      # ============================================
      - name: 🔨 Build Backend (Maven)
        working-directory: ./backend
        timeout-minutes: 30
        run: |
          echo "🔨 Iniciando build do backend..."
          echo "📋 Informações do ambiente:"
          echo "  - Java: $(java -version 2>&1 | head -1)"
          echo "  - Maven do sistema: $(mvn -version 2>&1 | head -1 || echo 'Maven não disponível')"
          echo "  - Memória disponível: $(free -h | grep Mem || echo 'N/A')"
          
          chmod +x mvnw || true
          echo "📋 Verificando Maven Wrapper..."
          ls -la mvnw || echo "⚠️ mvnw não encontrado"
          echo "📋 Verificando pom.xml..."
          ls -la pom.xml || echo "❌ pom.xml não encontrado"
          echo "📋 Verificando estrutura do projeto..."
          ls -la src/main/java/com/z7design/secured_guard/ || echo "⚠️ Diretório src não encontrado"
          
          # Configurar Maven para usar retry
          echo "📋 Configurando Maven com retry..."
          mkdir -p ~/.m2
          printf '%s\n' \
            '<settings>' \
            '  <profiles>' \
            '    <profile>' \
            '      <id>retry</id>' \
            '      <properties>' \
            '        <maven.wagon.http.retryHandler.count>5</maven.wagon.http.retryHandler.count>' \
            '        <maven.wagon.httpconnectionManager.ttlSeconds>120</maven.wagon.httpconnectionManager.ttlSeconds>' \
            '        <maven.wagon.http.readTimeout>60000</maven.wagon.http.readTimeout>' \
            '      </properties>' \
            '    </profile>' \
            '  </profiles>' \
            '  <activeProfiles>' \
            '    <activeProfile>retry</activeProfile>' \
            '  </activeProfiles>' \
            '</settings>' > ~/.m2/settings.xml
          
          echo "🔨 Executando Maven clean package..."
          echo "📋 Configurando variáveis de ambiente do Maven..."
          export MAVEN_OPTS="-Xmx2048m"
          
          # Tentar usar Maven Wrapper com retry, ou usar Maven do sistema
          MAVEN_CMD="./mvnw"
          if ! ./mvnw -v >/dev/null 2>&1; then
            echo "⚠️ Maven Wrapper não disponível, tentando usar Maven do sistema..."
            if command -v mvn >/dev/null 2>&1; then
              MAVEN_CMD="mvn"
              echo "✅ Usando Maven do sistema: $(mvn -version | head -1)"
            else
              echo "❌ Nenhum Maven disponível!"
              exit 1
            fi
          fi
          
          # Tentar build com retry
          for attempt in 1 2 3; do
            echo "🔨 Tentativa $attempt de build..."
            timeout 1800 $MAVEN_CMD clean package -Dmaven.test.skip=true -Dspring.profiles.active=ci -DskipTests=true && {
              echo "✅ Build concluído com sucesso!"
              break
            } || {
              if [ $attempt -lt 3 ]; then
                echo "⚠️ Tentativa $attempt falhou, aguardando 10 segundos antes de tentar novamente..."
                sleep 10
              else
                echo "❌ Build falhou após 3 tentativas! Verificando logs..."
                echo "📋 Listando arquivos em target/..."
                ls -la target/ 2>/dev/null || echo "⚠️ Diretório target não existe"
                echo "📋 Verificando logs do Maven..."
                find . -name "*.log" -type f -exec tail -50 {} \; 2>/dev/null || echo "⚠️ Nenhum log encontrado"
                exit 1
              fi
            }
          done
          
          echo "✅ Build concluído! Verificando JAR gerado..."
          ls -lh target/*.jar || echo "⚠️ Nenhum JAR encontrado em target/"
          echo "📋 Listando todos os arquivos em target/:"
          ls -lah target/ || echo "⚠️ Diretório target não existe"

      # ============================================
      # 3️⃣ BUILD FRONTEND (Vite)
      # ============================================
      - name: 🎨 Build Frontend (Vite)
        working-directory: ./frontend
        env:
          VITE_API_URL: https://ci.z7botsolutions.com.br/api
          VITE_ENVIRONMENT: ci
        run: |
          npm ci
          npm run build

      # ============================================
      # 3.5️⃣ SETUP DOCKER BUILDX
      # ============================================
      - name: 🐳 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================
      # 4️⃣ BUILD DOCKER IMAGES
      # ============================================
      - name: 🐳 Build Docker images
        run: |
          echo "🐳 Iniciando build das imagens Docker..."
          
          # Verificar se os Dockerfiles existem
          echo "📋 Verificando Dockerfiles..."
          ls -la backend/Dockerfile.prod || echo "❌ backend/Dockerfile.prod não encontrado"
          ls -la frontend/Dockerfile.prod || echo "❌ frontend/Dockerfile.prod não encontrado"
          ls -la whatsapp-service/Dockerfile || echo "❌ whatsapp-service/Dockerfile não encontrado"
          
          # Verificar se o JAR foi gerado
          echo "📋 Verificando JAR do backend..."
          ls -lh backend/target/*.jar || echo "⚠️ Nenhum JAR encontrado em backend/target/"
          
          # Verificar se o dist do frontend foi gerado
          echo "📋 Verificando build do frontend..."
          ls -lh frontend/dist/ || echo "⚠️ Diretório frontend/dist/ não encontrado"
          
          # Build Backend
          echo "🔨 Construindo imagem do backend..."
          docker build --no-cache \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ghcr.io/${{ github.repository_owner }}/secured-guard-backend:ci \
            -f backend/Dockerfile.prod ./backend || {
            echo "❌ Build do backend Docker falhou!"
            exit 1
          }
          echo "✅ Imagem do backend construída com sucesso!"
          
          # Build Frontend
          echo "🎨 Construindo imagem do frontend..."
          docker build --no-cache \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ghcr.io/${{ github.repository_owner }}/secured-guard-frontend:ci \
            --build-arg VITE_API_URL=https://ci.z7botsolutions.com.br/api \
            --build-arg VITE_WS_URL=wss://ci.z7botsolutions.com.br/ws \
            --build-arg VITE_ENVIRONMENT=ci \
            -f frontend/Dockerfile.prod ./frontend || {
            echo "❌ Build do frontend Docker falhou!"
            exit 1
          }
          echo "✅ Imagem do frontend construída com sucesso!"
          
          # Build WhatsApp Service
          echo "📱 Construindo imagem do WhatsApp service..."
          docker build --no-cache \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ghcr.io/${{ github.repository_owner }}/secured-guard-whatsapp:ci \
            -f whatsapp-service/Dockerfile ./whatsapp-service || {
            echo "❌ Build do WhatsApp service Docker falhou!"
            exit 1
          }
          echo "✅ Imagem do WhatsApp service construída com sucesso!"
          
          # Verificar imagens construídas
          echo "📋 Verificando imagens construídas..."
          docker images | grep ghcr.io/${{ github.repository_owner }}/secured-guard || echo "⚠️ Nenhuma imagem encontrada"

      # ============================================
      # 5️⃣ LOGIN TO GHCR
      # ============================================
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ============================================
      # 6️⃣ PUSH IMAGES TO GHCR
      # ============================================
      - name: 📤 Push images to GitHub Container Registry
        run: |
          push_with_retry() {
            local img=$1
            for i in 1 2 3; do
              echo "Push attempt $i/3: $img"
              if docker push "$img"; then return 0; fi
              echo "Retry in 30s..."
              sleep 30
            done
            return 1
          }
          push_with_retry ghcr.io/${{ github.repository_owner }}/secured-guard-backend:ci
          push_with_retry ghcr.io/${{ github.repository_owner }}/secured-guard-frontend:ci
          push_with_retry ghcr.io/${{ github.repository_owner }}/secured-guard-whatsapp:ci

      # ============================================
      # 7️⃣ INSTALL SSHPASS AND CONFIGURE SSH
      # ============================================
      - name: 🔑 Install sshpass and configure SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          for i in 1 2 3; do
            ssh-keyscan -H ${{ secrets.VPS_HOST_CI }} >> ~/.ssh/known_hosts 2>/dev/null && break || sleep 10
          done

      # ============================================
      # 7b Validar VPS_HOST_CI (evitar IP inválido ex: 0.0.7.234)
      # ============================================
      - name: 🔍 Validar host VPS (CI)
        run: |
          HOST="${{ secrets.VPS_HOST_CI }}"
          if [ -z "$HOST" ]; then
            echo "::error::VPS_HOST_CI está vazio. Configure em Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [[ "$HOST" == 0.* ]]; then
            echo "::error::VPS_HOST_CI parece inválido (IP começa com 0.). Ex.: use 10.0.7.234 em vez de 0.0.7.234. Corrija o secret VPS_HOST_CI no repositório."
            exit 1
          fi
          echo "✓ Host VPS validado"

      # ============================================
      # 8️⃣ TRANSFER FILES TO VPS (com retry para Connection reset)
      # ============================================
      - name: 📤 Transfer files to VPS
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          do_transfer() {
            sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh $SSH_OPTS ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} "mkdir -p /var/www/secured_guard/ci/nginx /var/www/secured_guard/ci/scripts /var/www/secured_guard/traefik/dynamic" || return 1
            sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS docker-compose.traefik.yml ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/ || return 1
            sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS docker-compose.ci.yml ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/ci/ || return 1
            sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS nginx/ci.conf ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/ci/nginx/ || return 1
            sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS scripts/health-check-ci.sh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/ci/scripts/ || return 1
            sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS scripts/clear-service-worker-cache.sh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/ci/scripts/ || return 1
            sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS scripts/recover-ci-502.sh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/ci/scripts/ 2>/dev/null || true
            sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS scripts/fix-404-traefik.sh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/ci/scripts/ 2>/dev/null || true
            sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS scripts/free-host-ports-for-traefik.sh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/ci/scripts/ 2>/dev/null || true
            sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS traefik-dynamic-ci.yml ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/traefik-dynamic-ci.yml 2>/dev/null || true
            sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS traefik-dynamic-ci.yml ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/traefik/dynamic/ci.yml 2>/dev/null || true
            return 0
          }
          for i in 1 2 3 4 5; do
            echo "📤 Tentativa $i de transferência..."
            if do_transfer; then echo "✅ Transferência concluída!"; exit 0; fi
            echo "⚠️ Falha na tentativa $i - aguardando 15s antes de retry..."
            sleep 15
          done
          echo "❌ Transferência falhou após 5 tentativas"
          exit 1



      # ============================================
      # 🔟 CREATE .ENV FILE ON VPS
      # ============================================
      - name: ⚙️ Create .env file on VPS
        env:
          MAIL_PASSWORD_SECRET: ${{ secrets.MAIL_PASSWORD }}
        run: |
          # Criar arquivo .env localmente primeiro para evitar problemas com caracteres especiais
          # Usar printf para cada linha, exceto MAIL_PASSWORD que usa variável de ambiente
          {
            printf 'POSTGRES_PASSWORD_CI=%s\n' "${{ secrets.POSTGRES_PASSWORD_CI || '4KaCiJc6an@7sgbdcid2025' }}"
            printf 'REDIS_PASSWORD_CI=%s\n' "${{ secrets.REDIS_PASSWORD_CI || 'redis_ci_2025' }}"
            printf 'JWT_SECRET_CI=%s\n' "${{ secrets.JWT_SECRET_CI || 'jwt_secret_ci_2025_secure_key_64bytes_minimum_required_for_hmac_sha512_algorithm_secure_extra_long_key' }}"
            printf '# Email Configuration\n'
            printf 'MAIL_HOST=%s\n' "${{ secrets.MAIL_HOST || 'mail.z7design.com.br' }}"
            printf 'MAIL_PORT=%s\n' "${{ secrets.MAIL_PORT || '465' }}"
            printf 'MAIL_USERNAME=%s\n' "${{ secrets.MAIL_USERNAME || 'securedguard@z7design.com.br' }}"
            # Para MAIL_PASSWORD, usar variável de ambiente (já definida no env do step)
            # Isso evita problemas com caracteres especiais como $( na senha
            if [ -n "${MAIL_PASSWORD_SECRET}" ]; then
              # Usar printf com %s para evitar interpretação de caracteres especiais
              printf 'MAIL_PASSWORD='
              printf '%s' "${MAIL_PASSWORD_SECRET}"
              printf '\n'
            else
              # Se não houver secret, deixar vazio - o Spring Boot usará o valor do application-ci.properties
              printf 'MAIL_PASSWORD=\n'
            fi
            printf 'MAIL_STARTTLS_ENABLE=%s\n' "${{ secrets.MAIL_STARTTLS_ENABLE || 'false' }}"
            printf 'MAIL_SSL_ENABLE=%s\n' "${{ secrets.MAIL_SSL_ENABLE || 'true' }}"
            printf 'MAIL_SOCKET_FACTORY=%s\n' "${{ secrets.MAIL_SOCKET_FACTORY || 'javax.net.ssl.SSLSocketFactory' }}"
            printf 'MAIL_SOCKET_FACTORY_PORT=%s\n' "${{ secrets.MAIL_SOCKET_FACTORY_PORT || '465' }}"
            printf 'MAIL_CONNECTION_TIMEOUT=%s\n' "${{ secrets.MAIL_CONNECTION_TIMEOUT || '10000' }}"
            printf 'MAIL_TIMEOUT=%s\n' "${{ secrets.MAIL_TIMEOUT || '10000' }}"
            printf 'MAIL_WRITE_TIMEOUT=%s\n' "${{ secrets.MAIL_WRITE_TIMEOUT || '10000' }}"
            printf 'MAIL_DEBUG=%s\n' "${{ secrets.MAIL_DEBUG || 'false' }}"
            printf '# WhatsApp Configuration\n'
            # Usar whatsapp-service-ci:3333 que está definido no docker-compose.ci.yml
            printf 'BAILEYS_REST_URL=%s\n' "${{ secrets.BAILEYS_REST_URL || 'http://whatsapp-service-ci:3333' }}"
            printf 'BAILEYS_ENABLED=%s\n' "${{ secrets.BAILEYS_ENABLED || 'true' }}"
            printf 'BAILEYS_INSTANCE_KEY=%s\n' "${{ secrets.BAILEYS_INSTANCE_KEY || 'securedguard_ci' }}"
          } > /tmp/ci.env
          # Enviar arquivo para VPS
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp /tmp/ci.env ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/ci/.env
          # Limpar arquivo temporário
          rm -f /tmp/ci.env



      # ============================================
      # 1️⃣3️⃣ EXECUTE ALL DEPLOYMENT COMMANDS IN SINGLE SSH SESSION
      # ============================================
      - name: 🚀 Execute Deployment (Single SSH Session)
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=60 -o ConnectTimeout=60 -o IPQoS=none -o TCPKeepAlive=yes"
          
          SUCCESS=0
          for i in 1 2 3 4 5; do
            echo "======================================"
            echo "🔁 Tentativa $i de 5 de conexão SSH..."
            echo "======================================"
            
            set +e
            sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh $SSH_OPTS ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF'
            set -e
            export DOCKER_CLIENT_TIMEOUT=600
            export DOCKER_HTTP_TIMEOUT=600
            export COMPOSE_HTTP_TIMEOUT=600

            echo "🔧 Force exit Swarm mode and complete cleanup..."
            docker swarm leave --force 2>/dev/null || true
            # NÃO deletar ci.yml - ele é necessário como fallback para o Traefik descobrir o nginx-ci
            cd /var/www/secured_guard/ci
            docker-compose -f docker-compose.ci.yml down --remove-orphans 2>/dev/null || true
            docker ps -a | grep "secured-guard-.*-ci" | awk '{print $1}' | xargs -r docker rm -f 2>/dev/null || true

            # Rede nomeada secured-guard-ci: se algum container externo a usar, "docker network rm" falha e o próximo "up" dá "already exists".
            remove_secured_guard_ci_network() {
              local net=secured-guard-ci
              docker network inspect "$net" >/dev/null 2>&1 || return 0
              local cids
              cids=$(docker network inspect "$net" -f '{{range $k, $v := .Containers}}{{$k}} {{end}}' 2>/dev/null || true)
              for cid in $cids; do
                [ -n "$cid" ] || continue
                echo "   Desligando endpoint $cid da rede $net..."
                docker network disconnect -f "$net" "$cid" 2>/dev/null || true
              done
              docker network rm "$net" 2>/dev/null && echo "✅ Rede $net removida" || echo "⚠️ Rede $net ainda não removida (tentativa seguinte ou uso manual)"
            }
            remove_secured_guard_ci_network

            echo "🔎 Verificando acesso ao GHCR (forçar IPv4)..."
            GHCR_OK=0
            for j in 1 2 3 4 5; do
              if curl -4 --connect-timeout 30 -fsSL https://ghcr.io/v2/ >/dev/null 2>&1; then
                echo "✅ GHCR acessível"
                GHCR_OK=1
                break
              fi
              WAIT=$((j * 10))
              echo "⚠️ Tentativa $j de acesso ao GHCR falhou, aguardando ${WAIT}s..."
              sleep $WAIT
            done
            if [ $GHCR_OK -eq 0 ]; then
              echo "⚠️ GHCR inacessível da VPS (Contabo). Tentando usar imagens em cache..."
            fi

            echo "🔐 Login no GitHub Container Registry..."
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin 2>/dev/null || echo "⚠️ Login falhou (GHCR pode estar inacessível)"

            # Pull com fallback: se falhar, usar imagens em cache
            pull_or_use_cache() {
              local img=$1
              local name=$2
              for j in 1 2 3 4 5; do
                if docker pull "$img" 2>/dev/null; then echo "✅ $name baixado"; return 0; fi
                WAIT=$((j * 10 + 5))
                echo "⚠️ Pull $name falhou ($j/5), aguardando ${WAIT}s..."
                sleep $WAIT
              done
              if docker image inspect "$img" >/dev/null 2>&1; then
                echo "⚠️ Usando imagem $name em cache (GHCR inacessível)"
                return 0
              fi
              echo "❌ $name não disponível e sem cache"; return 1
            }
            echo "📥 Pull backend..."
            pull_or_use_cache ghcr.io/${{ github.repository_owner }}/secured-guard-backend:ci "backend" || exit 1
            echo "📥 Pull frontend..."
            pull_or_use_cache ghcr.io/${{ github.repository_owner }}/secured-guard-frontend:ci "frontend" || exit 1
            echo "📥 Pull whatsapp..."
            pull_or_use_cache ghcr.io/${{ github.repository_owner }}/secured-guard-whatsapp:ci "whatsapp" || exit 1

            echo "🧹 Removendo imagens antigas (após pull bem-sucedido)..."
            docker image prune -f --filter "dangling=true" 2>/dev/null || true

            echo "🔎 Labels das imagens:"
            docker image inspect ghcr.io/${{ github.repository_owner }}/secured-guard-backend:ci --format 'backend.revision={{ index .Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || echo "backend.revision=unknown"
            docker image inspect ghcr.io/${{ github.repository_owner }}/secured-guard-frontend:ci --format 'frontend.revision={{ index .Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || echo "frontend.revision=unknown"
            docker image inspect ghcr.io/${{ github.repository_owner }}/secured-guard-whatsapp:ci --format 'whatsapp.revision={{ index .Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || echo "whatsapp.revision=unknown"

            echo "🧹 Limpando redes (compose down + desligar endpoints da secured-guard-ci)..."
            docker-compose -f docker-compose.ci.yml down --remove-orphans 2>/dev/null || true
            remove_secured_guard_ci_network
            sleep 2
            
            echo "📦 Iniciando banco de dados (Postgres + Redis)..."
            docker-compose -f docker-compose.ci.yml up -d postgres-ci redis-ci
            echo "⏳ Aguardando Postgres aceitar conexões (até ~200s; VPS lenta pode demorar)..."
            PG_READY=0
            for j in $(seq 1 40); do
              if docker exec secured-guard-db-ci pg_isready -U secured_guard_ci -d secured_guard_ci 2>/dev/null \
                && docker exec secured-guard-db-ci psql -U secured_guard_ci -d secured_guard_ci -tAc "SELECT 1" >/dev/null 2>&1; then
                echo "✅ Postgres pronto (pg_isready + SELECT 1) após ~$(((j - 1) * 5))s"
                PG_READY=1
                break
              fi
              if [ $((j % 5)) -eq 0 ]; then
                echo "   ...ainda aguardando Postgres (tentativa $j/40, ~$((j * 5))s)..."
              fi
              [ $j -eq 40 ] && { echo "⚠️ Timeout aguardando Postgres após 200s"; exit 1; }
              sleep 5
            done
            [ "$PG_READY" -eq 1 ] || { echo "⚠️ Postgres não ficou pronto"; exit 1; }
            sleep 3
            
            echo "🧹 Executando limpeza de duplicatas (Roles & Permissions)..."
            docker exec secured-guard-db-ci psql -U secured_guard_ci -d secured_guard_ci < scripts/fix_all_duplicates.sql || echo "⚠️ Erro na limpeza, continuando..."
            
            echo "🔧 Flyway: removendo entradas de migrações falhas em flyway_schema_history (permite reexecutar V1013, etc.)..."
            docker exec secured-guard-db-ci psql -U secured_guard_ci -d secured_guard_ci -c "DELETE FROM flyway_schema_history WHERE success = false;" 2>/dev/null || true
            docker exec secured-guard-db-ci psql -U secured_guard_ci -d secured_guard_ci -c "DELETE FROM flyway_schema_history WHERE version = '457';" 2>/dev/null || true
            docker exec secured-guard-db-ci psql -U secured_guard_ci -d secured_guard_ci -c "DELETE FROM flyway_schema_history WHERE version = '1008';" 2>/dev/null || true
            docker exec secured-guard-db-ci psql -U secured_guard_ci -d secured_guard_ci -c "UPDATE flyway_schema_history SET checksum = 318441356 WHERE version = '424';" 2>/dev/null || true
            docker exec secured-guard-db-ci psql -U secured_guard_ci -d secured_guard_ci -c "UPDATE flyway_schema_history SET checksum = -1437677079 WHERE version = '427';" 2>/dev/null || true
            
            echo "🚀 Iniciando todos os containers (usando imagens já baixadas)..."
            docker-compose -f docker-compose.ci.yml up -d --force-recreate --remove-orphans
            
            echo "⏳ Aguardando backend + Flyway em /api/health (máx. 540s; compose start_period=420s)..."
            for j in $(seq 1 54); do
              BACKEND_STATE=$(docker inspect secured-guard-backend-ci --format '{{.State.Status}}' 2>/dev/null || echo "missing")
              if [ "$BACKEND_STATE" = "exited" ] || [ "$BACKEND_STATE" = "dead" ]; then
                echo "❌ Backend crashou (status: $BACKEND_STATE). Logs:"
                docker logs --tail 100 secured-guard-backend-ci 2>&1 || true
                exit 1
              fi
              if curl -sf http://localhost:8081/api/health >/dev/null 2>&1; then
                echo "✅ Backend respondendo após ~$(((j - 1) * 10))s"
                break
              fi
              echo "   Aguardando... ~$((j * 10))s (backend status: $BACKEND_STATE)"
              sleep 10
              if [ $j -eq 54 ]; then
                echo "❌ Timeout 540s - backend não respondeu em /api/health. Logs:"
                docker logs --tail 200 secured-guard-backend-ci 2>&1 || true
                exit 1
              fi
            done
            
            docker-compose -f docker-compose.ci.yml ps
            
            echo "🔐 Verificando JWT_SECRET e configs..."
            cat .env | grep JWT_SECRET || true
            
            echo "--- Logs do backend (últimas 80 linhas) ---"
            docker logs --tail 80 secured-guard-backend-ci 2>&1 || true
            
            echo "🌐 Testando conexão local..."
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:8081/api/health || echo "Backend não responde"
            
            echo "🔄 Rodando script proativo de correção 404 do Traefik..."
            chmod +x /var/www/secured_guard/ci/scripts/fix-404-traefik.sh 2>/dev/null || true
            bash /var/www/secured_guard/ci/scripts/fix-404-traefik.sh 2>/dev/null || true
            sleep 5
            
            echo "🏥 Iniciando script de Health Check internamente..."
            chmod +x /var/www/secured_guard/ci/scripts/health-check-ci.sh
            /var/www/secured_guard/ci/scripts/health-check-ci.sh
            
            echo "🧹 Limpando cache do Service Worker..."
            chmod +x /var/www/secured_guard/ci/scripts/clear-service-worker-cache.sh
            /var/www/secured_guard/ci/scripts/clear-service-worker-cache.sh
            
          EOF
            SSH_EXIT_CODE=$?
            set -e
            
            if [ $SSH_EXIT_CODE -eq 0 ]; then
              echo "✅ Deployment concluído com sucesso!"
              SUCCESS=1
              break
            else
              echo "⚠️ Erro na execução SSH (Código: $SSH_EXIT_CODE). Aguardando 20s para tentar novamente..."
              sleep 20
            fi
          done
          
          if [ $SUCCESS -eq 0 ]; then
            echo "❌ Falha crítica: O Deploy não pôde ser concluído após 5 tentativas de conexão SSH."
            exit 1
          fi





      # ============================================
      # 2️⃣7️⃣ RUN LOGIN AFTER DEPLOY
      # ============================================
      - name: 🔐 Run login after deploy
        run: |
          sleep 30
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://ci.z7botsolutions.com.br/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"test","password":"test"}' \
            --max-time 10 2>/dev/null || echo "000")
          echo "HTTP Code: $HTTP_CODE"

      # ============================================
      # 2️⃣7️⃣ DEPLOYMENT SUCCESSFUL
      # ============================================
      - name: 🎉 Deployment successful
        if: success()
        run: |
          echo "✅ Deploy CI concluído com sucesso!"
          echo "🌐 URL: https://ci.z7botsolutions.com.br"

      # ============================================
      # 2️⃣8️⃣ ROLLBACK ON FAILURE
      # ============================================
      - name: 🔄 Rollback on failure
        if: failure()
        run: |
          echo "❌ Deploy falhou!"
