      if $DOCKER_CMD ps -a --format "{{.Names}}" | grep -q "^secured-guard-nginx-ci$"; then
        $DOCKER_CMD start secured-guard-nginx-ci 2>&1 || $COMPOSE_CMD -f docker-compose.ci.yml up -d nginx-ci
      else
