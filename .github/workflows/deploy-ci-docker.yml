                echo "📋 Logs de $container:"
                $DOCKER_CMD logs --tail 50 "$container" 2>&1 | tail -30 || echo "  ⚠️ Não foi possível obter logs"
              done
            fi
            
    # Verificar se PostgreSQL e Redis estão rodando
    echo ""
    echo "🔍 Verificando PostgreSQL e Redis..."
    
    # Verificar usando docker-compose ps (mais confiável)
    if ! $COMPOSE_CMD -f docker-compose.ci.yml ps postgres-ci 2>&1 | grep -q "Up"; then
