name: 🐳 Deploy CI Environment (Docker Compose)

on:
  push:
    branches:
      - ci
  workflow_dispatch:

env:
  ENVIRONMENT: ci
  DEPLOY_PATH: /var/www/secured_guard/ci
  APP_URL: https://ci.z7botsolutions.com.br

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy to CI (Docker)
    runs-on: ubuntu-latest
    
    steps:
      # ============================================
      # 0️⃣ VERIFICAR SECRETS (antes de começar)
      # ============================================
      - name: 🔐 Verificar secrets necessários
        continue-on-error: true
        run: |
          echo "🔐 Verificando se os secrets estão configurados..."
          echo ""
          echo "📋 Secrets necessários:"
          echo "  - DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME != '' && '✅ Configurado' || '❌ Não configurado' }}"
          echo "  - DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD != '' && '✅ Configurado' || '❌ Não configurado' }}"
          echo "  - VPS_HOST_CI: ${{ secrets.VPS_HOST_CI != '' && '✅ Configurado' || '❌ Não configurado' }}"
          echo "  - VPS_USER_CI: ${{ secrets.VPS_USER_CI != '' && '✅ Configurado' || '❌ Não configurado' }}"
          echo "  - VPS_PASSWORD_CI: ${{ secrets.VPS_PASSWORD_CI != '' && '✅ Configurado' || '❌ Não configurado' }}"
          echo "  - POSTGRES_PASSWORD_CI: ${{ secrets.POSTGRES_PASSWORD_CI != '' && '✅ Configurado' || '❌ Não configurado' }}"
          echo "  - REDIS_PASSWORD_CI: ${{ secrets.REDIS_PASSWORD_CI != '' && '✅ Configurado' || '❌ Não configurado' }}"
          echo "  - JWT_SECRET_CI: ${{ secrets.JWT_SECRET_CI != '' && '✅ Configurado' || '❌ Não configurado (usará padrão)' }}"
          echo ""
          if [ -z "${{ secrets.VPS_HOST_CI }}" ] || [ -z "${{ secrets.VPS_USER_CI }}" ] || [ -z "${{ secrets.VPS_PASSWORD_CI }}" ]; then
            echo "❌ ERRO: Secrets de VPS não estão configurados!"
            echo "   Configure os secrets em: Settings → Secrets and variables → Actions"
            echo "   Veja SECRETS_CONFIG.md para a lista completa"
            exit 1
          fi
          echo "✅ Secrets básicos configurados. Continuando com o deploy..."

      # ============================================
      # 1️⃣ CHECKOUT DO CÓDIGO
      # ============================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ci

      # ============================================
      # 2️⃣ SETUP JAVA 17
      # ============================================
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      # ============================================
      # 3️⃣ SETUP NODE.JS 20
      # ============================================
      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ============================================
      # 4️⃣ BUILD BACKEND (Maven)
      # ============================================
      - name: 🔨 Build Backend (Maven)
        working-directory: ./backend
        continue-on-error: false
        run: |
          echo "🔨 Compilando backend para ambiente CI..."
          chmod +x mvnw || echo "⚠️ mvnw já tem permissão"
          # pular totalmente compilação/execução de testes no CI (-Dmaven.test.skip=true)
          ./mvnw clean package -Dmaven.test.skip=true -Dspring.profiles.active=ci || {
            echo "❌ Erro ao compilar backend"
            echo "📋 Verificando logs do Maven..."
            cat target/surefire-reports/*.txt 2>/dev/null || echo "Nenhum relatório de teste encontrado"
            exit 1
          }
          echo "✅ Backend compilado com sucesso!"
          ls -lh target/*.jar || echo "⚠️ Nenhum JAR encontrado"

      # ============================================
      # 5️⃣ BUILD FRONTEND (Vite)
      # ============================================
      - name: 🎨 Build Frontend (Vite)
        working-directory: ./frontend
        continue-on-error: false
        env:
          VITE_API_URL: https://ci.z7botsolutions.com.br/api
          VITE_ENVIRONMENT: ci
        run: |
          echo "🎨 Compilando frontend para ambiente CI..."
          npm ci || {
            echo "❌ Erro ao executar npm ci"
            echo "📋 Verificando package-lock.json..."
            ls -lh package-lock.json || echo "⚠️ package-lock.json não encontrado"
            exit 1
          }
          npm run build || {
            echo "❌ Erro ao executar npm run build"
            echo "📋 Verificando logs do Vite..."
            exit 1
          }
          echo "✅ Frontend compilado com sucesso!"
          ls -lh dist/ || echo "⚠️ Diretório dist/ não encontrado"

      # ============================================
      # 6️⃣ BUILD DOCKER IMAGES
      # ============================================
      - name: 🐳 Build Docker images
        run: |
          echo "🐳 Construindo imagens Docker..."
          
          # Build backend image (sem cache para garantir atualização)
          docker build --no-cache -t z7design/secured-guard-backend:ci \
            -f backend/Dockerfile.prod ./backend
          
          # Build frontend image com variáveis de ambiente do CI (sem cache para garantir atualização)
          docker build --no-cache -t z7design/secured-guard-frontend:ci \
            --build-arg VITE_API_URL=https://ci.z7botsolutions.com.br/api \
            --build-arg VITE_WS_URL=wss://ci.z7botsolutions.com.br/ws \
            --build-arg VITE_ENVIRONMENT=ci \
            -f frontend/Dockerfile.prod ./frontend
          
          # Build WhatsApp service image (Baileys) (sem cache para garantir atualização)
          docker build --no-cache -t z7design/secured-guard-whatsapp:ci \
            -f whatsapp-service/Dockerfile ./whatsapp-service
          
          echo "✅ Imagens Docker construídas!"

      # ============================================
      # 7️⃣ LOGIN NO DOCKER HUB
      # ============================================
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ============================================
      # 8️⃣ PUSH IMAGES TO DOCKER HUB
      # ============================================
      - name: 📤 Push images to Docker Hub
        run: |
          echo "📤 Enviando imagens para Docker Hub..."
          docker push z7design/secured-guard-backend:ci
          docker push z7design/secured-guard-frontend:ci
          docker push z7design/secured-guard-whatsapp:ci
          echo "✅ Imagens enviadas com sucesso!"

      # ============================================
      # 9️⃣ INSTALAR SSHPASS E CONFIGURAR SSH
      # ============================================
      - name: 🔑 Install sshpass and configure SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST_CI }} >> ~/.ssh/known_hosts
          echo "✅ SSH configurado para usar senha"

      # ============================================
      # 🔟 TRANSFERIR ARQUIVOS PARA VPS
      # ============================================
      - name: 📤 Transfer files to VPS
        run: |
          echo "📤 Transferindo arquivos para VPS..."
          
          # Configurar opções SSH para conexões mais robustas
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -o BatchMode=no"
          
          # Criar diretório de deploy na VPS (com retry)
          echo "📁 Criando diretórios na VPS..."
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh $SSH_OPTS ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} \
              "mkdir -p /var/www/secured_guard/ci /var/www/secured_guard/ci/uploads /var/www/secured_guard/ci/logs /var/www/secured_guard/ci/nginx /var/www/secured_guard/ci/postgres_data /var/www/secured_guard/ci/redis_data /var/www/secured_guard/ci/evolution_instances /var/www/secured_guard/ci/holerites /var/www/secured_guard/ci/whatsapp_sessions" 2>&1
            then
              echo "✅ Diretórios criados com sucesso!"
              break
            else
              echo "⚠️ Tentativa $ATTEMPT/$MAX_ATTEMPTS falhou. Aguardando 5 segundos..."
              sleep 5
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done
          
          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "❌ Falha ao criar diretórios após $MAX_ATTEMPTS tentativas"
            exit 1
          fi
          
          # Transferir docker-compose.ci.yml (com retry)
          echo "📤 Transferindo docker-compose.ci.yml..."
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS docker-compose.ci.yml \
              ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/ci/
            then
              echo "✅ docker-compose.ci.yml transferido!"
              break
            else
              echo "⚠️ Tentativa $ATTEMPT/$MAX_ATTEMPTS falhou. Aguardando 5 segundos..."
              sleep 5
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done
          
          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "❌ Falha ao transferir docker-compose.ci.yml após $MAX_ATTEMPTS tentativas"
            exit 1
          fi
          
          # Transferir configuração do nginx (com retry)
          echo "📤 Transferindo nginx/ci.conf..."
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS nginx/ci.conf \
              ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/ci/nginx/
            then
              echo "✅ nginx/ci.conf transferido!"
              break
            else
              echo "⚠️ Tentativa $ATTEMPT/$MAX_ATTEMPTS falhou. Aguardando 5 segundos..."
              sleep 5
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done
          
          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo "❌ Falha ao transferir nginx/ci.conf após $MAX_ATTEMPTS tentativas"
            exit 1
          fi
          
          # Transferir configuração dinâmica do Traefik (se existir)
          if [ -f "traefik-dynamic-ci.yml" ]; then
            echo "📤 Transferindo traefik-dynamic-ci.yml..."
            ATTEMPT=1
            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              if sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh $SSH_OPTS ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} \
                "mkdir -p /var/www/secured_guard/traefik/dynamic" && \
                sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS traefik-dynamic-ci.yml \
                  ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/traefik/dynamic/ci.yml
              then
                echo "✅ traefik-dynamic-ci.yml transferido!"
                
                # Verificar se o arquivo foi transferido corretamente
                sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh $SSH_OPTS ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'VERIFY_EOF'
                  if [ -f "/var/www/secured_guard/traefik/dynamic/ci.yml" ]; then
                    echo "✅ Arquivo existe no servidor"
                    # Verificar se não tem healthCheck ou path solto
                    if grep -q "healthCheck" /var/www/secured_guard/traefik/dynamic/ci.yml || grep -q "^[[:space:]]*path:" /var/www/secured_guard/traefik/dynamic/ci.yml; then
                      echo "⚠️ Arquivo ainda contém healthCheck ou path solto. Corrigindo..."
                      sed -i '/healthCheck/d' /var/www/secured_guard/traefik/dynamic/ci.yml
                      sed -i '/^[[:space:]]*path:/d' /var/www/secured_guard/traefik/dynamic/ci.yml
                      sed -i '/^[[:space:]]*interval:/d' /var/www/secured_guard/traefik/dynamic/ci.yml
                      sed -i '/^[[:space:]]*timeout:/d' /var/www/secured_guard/traefik/dynamic/ci.yml
                      sed -i '/^[[:space:]]*scheme:/d' /var/www/secured_guard/traefik/dynamic/ci.yml
                      echo "✅ Arquivo corrigido"
                    else
                      echo "✅ Arquivo está correto (sem healthCheck ou path solto)"
                    fi
                  else
                    echo "❌ Arquivo não foi transferido!"
                  fi
                VERIFY_EOF
                
                break
              else
                echo "⚠️ Tentativa $ATTEMPT/$MAX_ATTEMPTS falhou. Aguardando 5 segundos..."
                sleep 5
                ATTEMPT=$((ATTEMPT + 1))
              fi
            done
            
            if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
              echo "⚠️ Falha ao transferir traefik-dynamic-ci.yml (não crítico, continuando...)"
            fi
          else
            echo "⚠️ Arquivo traefik-dynamic-ci.yml não encontrado, pulando..."
          fi
          
          echo "✅ Arquivos transferidos com sucesso!"

      # ============================================
      # 1️⃣1️⃣ VALIDAR E CONFIGURAR JWT_SECRET
      # ============================================
      - name: 🔐 Validate and configure JWT_SECRET
        run: |
          echo "🔐 Validando JWT_SECRET..."
          
          # Valor padrão seguro (80 caracteres - suficiente para HS512)
          DEFAULT_JWT_SECRET="jwt_secret_ci_2025_secure_key_64bytes_minimum_required_for_hmac_sha512_algorithm_secure_extra_long_key"
          
          # Atribuir secret a uma variável primeiro para poder verificar o tamanho
          JWT_SECRET_FROM_SECRETS="${{ secrets.JWT_SECRET_CI }}"
          
          # Usar secret se estiver definido e tiver pelo menos 64 caracteres
          if [ -n "$JWT_SECRET_FROM_SECRETS" ] && [ ${#JWT_SECRET_FROM_SECRETS} -ge 64 ]; then
            JWT_SECRET_VALUE="$JWT_SECRET_FROM_SECRETS"
            echo "✅ Usando JWT_SECRET do GitHub Secrets (${#JWT_SECRET_VALUE} caracteres)"
          else
            JWT_SECRET_VALUE="$DEFAULT_JWT_SECRET"
            if [ -n "$JWT_SECRET_FROM_SECRETS" ]; then
              echo "⚠️ JWT_SECRET do GitHub Secrets é muito curto (${#JWT_SECRET_FROM_SECRETS} caracteres). Usando valor padrão."
            else
              echo "ℹ️ JWT_SECRET não está definido no GitHub Secrets. Usando valor padrão."
            fi
          fi
          
          # Verificar tamanho final
          if [ ${#JWT_SECRET_VALUE} -lt 64 ]; then
            echo "❌ ERRO: JWT_SECRET ainda é muito curto (${#JWT_SECRET_VALUE} caracteres)!"
            exit 1
          fi
          
          echo "✅ JWT_SECRET configurado com ${#JWT_SECRET_VALUE} caracteres (mínimo: 64)"
          echo "JWT_SECRET_VALUE=$JWT_SECRET_VALUE" >> $GITHUB_ENV

      # ============================================
      # 1️⃣2️⃣ CRIAR ARQUIVO .ENV NA VPS
      # ============================================
      - name: ⚙️ Create .env file on VPS
        env:
          JWT_SECRET_VALUE: ${{ env.JWT_SECRET_VALUE }}
        run: |
          echo "⚙️ Criando arquivo .env localmente..."
          
          # Determinar qual secret usar para POSTGRES_PASSWORD_CI
          if [ -n "${{ secrets.POSTGRES_PASSWORD_CI }}" ]; then
            POSTGRES_PASSWORD_VALUE="${{ secrets.POSTGRES_PASSWORD_CI }}"
            echo "✅ Usando POSTGRES_PASSWORD_CI do GitHub Secrets"
          elif [ -n "${{ secrets.POSTGRES_PASSWORD }}" ]; then
            POSTGRES_PASSWORD_VALUE="${{ secrets.POSTGRES_PASSWORD }}"
            echo "⚠️ POSTGRES_PASSWORD_CI não encontrado, usando POSTGRES_PASSWORD"
          else
            POSTGRES_PASSWORD_VALUE="4KaCiJc6an@7sgbdcid2025"
            echo "⚠️ Nenhum secret de PostgreSQL encontrado, usando valor padrão"
          fi
          
          # Criar arquivo .env localmente usando echo para evitar problemas com YAML parser
          {
            echo "# ===== AMBIENTE CI ====="
            echo "ENVIRONMENT=ci"
            echo "APP_URL=https://ci.z7botsolutions.com.br"
            echo ""
            echo "# ===== BANCO DE DADOS ====="
            echo "POSTGRES_PASSWORD_CI=${POSTGRES_PASSWORD_VALUE}"
            echo ""
            echo "# ===== REDIS ====="
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD_CI }}"
            echo ""
            echo "# ===== JWT ====="
            echo "# Valor padrão seguro (80 caracteres) se não estiver definido no host"
            echo "JWT_SECRET=${{ env.JWT_SECRET_VALUE }}"
            echo ""
            echo "# ===== DOCKER ====="
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}"
            echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}"
          } > .env.ci
          
          # Verificar tamanho do JWT_SECRET no arquivo
          JWT_LENGTH=$(grep "^JWT_SECRET=" .env.ci | cut -d'=' -f2 | wc -c)
          echo "Tamanho do JWT_SECRET: $((JWT_LENGTH - 1)) caracteres"
          
          if [ $JWT_LENGTH -lt 65 ]; then
            echo "❌ ERRO: JWT_SECRET no .env é muito curto!"
            exit 1
          fi
          
          # Transferir arquivo para VPS
          echo "📤 Transferindo .env para VPS..."
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp .env.ci \
            ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/secured_guard/ci/.env
          
          # Definir permissões corretas
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} \
            "chmod 600 /var/www/secured_guard/ci/.env && echo '✅ Arquivo .env criado e configurado!'"
          
          # Verificar no servidor remoto
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF'
            echo "🔍 Verificando JWT_SECRET no .env remoto..."
            JWT_LENGTH=$(grep "^JWT_SECRET=" /var/www/secured_guard/ci/.env | cut -d'=' -f2 | wc -c)
            echo "Tamanho do JWT_SECRET no servidor: $((JWT_LENGTH - 1)) caracteres"
            
            if [ $JWT_LENGTH -lt 65 ]; then
              echo "❌ ERRO: JWT_SECRET no .env remoto é muito curto!"
              exit 1
            fi
            echo "✅ JWT_SECRET verificado com sucesso!"
          EOF

      # ============================================
      # 1️⃣3️⃣ GARANTIR QUE JWT_SECRET ESTÁ CORRETO NO HOST E NO .ENV
      # ============================================
      - name: 🔐 Ensure JWT_SECRET is correct on host and .env
        env:
          JWT_SECRET_VALUE: ${{ env.JWT_SECRET_VALUE }}
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << EOF
            echo "🔐 Verificando e corrigindo JWT_SECRET no host e .env..."
            
            # Valor correto do JWT_SECRET
            CORRECT_JWT_SECRET="${{ env.JWT_SECRET_VALUE }}"
            
            # 1. Remover JWT_SECRET do ambiente do host se estiver definido com valor curto
            if [ -n "\$JWT_SECRET" ]; then
              JWT_LENGTH=\${#JWT_SECRET}
              if [ \$JWT_LENGTH -lt 64 ]; then
                echo "⚠️ JWT_SECRET no host é muito curto (\$JWT_LENGTH caracteres). Removendo..."
                unset JWT_SECRET
                # Remover de .bashrc, .bash_profile, .profile se existir
                sed -i '/^export JWT_SECRET=/d' ~/.bashrc 2>/dev/null || true
                sed -i '/^export JWT_SECRET=/d' ~/.bash_profile 2>/dev/null || true
                sed -i '/^export JWT_SECRET=/d' ~/.profile 2>/dev/null || true
                echo "✅ JWT_SECRET removido do ambiente do host"
              else
                echo "✅ JWT_SECRET no host está OK (\$JWT_LENGTH caracteres)"
              fi
            else
              echo "ℹ️ JWT_SECRET não está definido no host (usando valor do .env ou docker-compose)"
            fi
            
            # 2. Verificar e corrigir JWT_SECRET no arquivo .env
            cd /var/www/secured_guard/ci
            if [ -f .env ]; then
              CURRENT_JWT=\$(grep "^JWT_SECRET=" .env | cut -d'=' -f2 || echo "")
              if [ -n "\$CURRENT_JWT" ]; then
                CURRENT_LENGTH=\${#CURRENT_JWT}
                echo "JWT_SECRET atual no .env: \${CURRENT_JWT:0:20}... (\$CURRENT_LENGTH caracteres)"
                
                if [ \$CURRENT_LENGTH -lt 64 ]; then
                  echo "⚠️ JWT_SECRET no .env é muito curto! Corrigindo..."
                  # Atualizar JWT_SECRET no .env
                  sed -i "s|^JWT_SECRET=.*|JWT_SECRET=\${CORRECT_JWT_SECRET}|g" .env
                  echo "✅ JWT_SECRET corrigido no .env"
                else
                  echo "✅ JWT_SECRET no .env está OK (\$CURRENT_LENGTH caracteres)"
                  # Mesmo assim, garantir que está usando o valor correto
                  sed -i "s|^JWT_SECRET=.*|JWT_SECRET=\${CORRECT_JWT_SECRET}|g" .env
                  echo "✅ JWT_SECRET atualizado para garantir valor correto"
                fi
              else
                echo "⚠️ JWT_SECRET não encontrado no .env. Adicionando..."
                echo "JWT_SECRET=\${CORRECT_JWT_SECRET}" >> .env
                echo "✅ JWT_SECRET adicionado ao .env"
              fi
              
              # Verificar novamente após correção
              VERIFIED_JWT=\$(grep "^JWT_SECRET=" .env | cut -d'=' -f2)
              VERIFIED_LENGTH=\${#VERIFIED_JWT}
              if [ \$VERIFIED_LENGTH -ge 64 ]; then
                echo "✅ JWT_SECRET verificado no .env: \${VERIFIED_LENGTH} caracteres"
              else
                echo "❌ ERRO: JWT_SECRET ainda está incorreto após correção!"
                exit 1
              fi
            else
              echo "⚠️ Arquivo .env não existe. Será criado no próximo passo."
            fi
          EOF

      # ============================================
      # 1️⃣4️⃣ FORÇAR CORREÇÃO DO .ENV ANTES DE PARAR CONTAINERS
      # ============================================
      - name: 🔧 Force .env correction before stopping containers
        env:
          JWT_SECRET_VALUE: ${{ env.JWT_SECRET_VALUE }}
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << EOF
            echo "🔧 Forçando correção do .env antes de parar containers..."
            
            cd /var/www/secured_guard/ci
            CORRECT_JWT_SECRET="${{ env.JWT_SECRET_VALUE }}"
            
            # Garantir que o .env existe e tem o JWT_SECRET correto
            if [ ! -f .env ]; then
              echo "Criando arquivo .env..."
              touch .env
            fi
            
            # Atualizar ou adicionar JWT_SECRET
            if grep -q "^JWT_SECRET=" .env; then
              sed -i "s|^JWT_SECRET=.*|JWT_SECRET=\${CORRECT_JWT_SECRET}|g" .env
              echo "✅ JWT_SECRET atualizado no .env"
            else
              echo "JWT_SECRET=\${CORRECT_JWT_SECRET}" >> .env
              echo "✅ JWT_SECRET adicionado ao .env"
            fi
            
            # Verificar tamanho
            JWT_LENGTH=\$(grep "^JWT_SECRET=" .env | cut -d'=' -f2 | wc -c)
            echo "Tamanho do JWT_SECRET no .env: \$((JWT_LENGTH - 1)) caracteres"
            
            if [ \$JWT_LENGTH -lt 65 ]; then
              echo "❌ ERRO: JWT_SECRET ainda está muito curto após correção!"
              exit 1
            fi
            
            echo "✅ .env corrigido e verificado!"
          EOF

      # ============================================
      # 1️⃣4️⃣.5️⃣ FORÇAR SAÍDA DO SWARM MODE E LIMPEZA COMPLETA
      # ============================================
      - name: 🔧 Force exit Swarm mode and complete cleanup
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF'
            echo "🔧 =========================================="
            echo "🔧 FORÇANDO SAÍDA DO SWARM MODE E LIMPEZA"
            echo "🔧 ========================================="
            echo ""
            
            cd /var/www/secured_guard/ci
            
            # 1. Verificar e sair do Swarm mode
            echo "📋 Verificando modo Docker..."
            if docker info 2>/dev/null | grep -q "Swarm: active"; then
              echo "⚠️ Docker está em modo Swarm"
              echo "🔄 Tentando sair do modo Swarm..."
              docker swarm leave --force 2>/dev/null || echo "⚠️ Não foi possível sair do modo Swarm (pode estar em uso)"
              sleep 5
            else
              echo "✅ Docker não está em modo Swarm"
            fi
            
            # 2. Parar TODOS os containers relacionados (usando docker-compose e docker diretamente)
            echo ""
            echo "🛑 Parando todos os containers relacionados..."
            
            # Parar usando docker-compose
            if command -v docker &> /dev/null && docker compose version &> /dev/null; then
              docker compose -f docker-compose.ci.yml down --remove-orphans 2>/dev/null || true
            else
              docker-compose -f docker-compose.ci.yml down --remove-orphans 2>/dev/null || true
            fi
            
            # Parar e remover containers manualmente (incluindo os com nomes estranhos)
            echo "🧹 Removendo containers manualmente..."
            docker ps -a --format "{{.ID}} {{.Names}}" | grep -E "(secured-guard|cc[0-9a-f]+_secured-guard)" | awk '{print $1}' | xargs -r docker rm -f 2>/dev/null || true
            
            # Remover containers específicos com padrões conhecidos
            docker ps -a | grep "secured-guard" | awk '{print $1}' | xargs -r docker rm -f 2>/dev/null || true
            docker ps -a | grep -E "cc[0-9a-f]+_secured-guard" | awk '{print $1}' | xargs -r docker rm -f 2>/dev/null || true
            
            # 3. Remover imagens corrompidas ou antigas
            echo ""
            echo "🧹 Removendo imagens corrompidas..."
            docker images | grep "z7design/secured-guard" | grep -E "(<none>|ci)" | awk '{print $3}' | xargs -r docker rmi -f 2>/dev/null || true
            
            # 4. Limpar redes órfãs
            echo ""
            echo "🧹 Limpando redes órfãs..."
            docker network prune -f 2>/dev/null || true
            docker network rm secured-guard-ci-network 2>/dev/null || true
            
            # 5. Limpar volumes órfãos (cuidado: não remover volumes com dados)
            echo ""
            echo "🧹 Limpando volumes órfãos..."
            docker volume prune -f 2>/dev/null || true
            
            # 6. Verificar se nginx.conf existe
            echo ""
            echo "📋 Verificando arquivos necessários..."
            if [ ! -f "nginx/ci.conf" ]; then
              echo "⚠️ nginx/ci.conf não encontrado! Criando diretório..."
              mkdir -p nginx
            else
              echo "✅ nginx/ci.conf encontrado"
            fi
            
            echo ""
            echo "✅ Limpeza completa concluída!"
          EOF

      # ============================================
      # 1️⃣5️⃣ FAZER BACKUP E PARAR CONTAINERS ANTIGOS
      # ============================================
      - name: 💾 Backup and stop old containers
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF'
            echo "💾 Fazendo backup e parando containers antigos..."
            
            cd /var/www/secured_guard/ci
            
            # Fazer backup dos volumes se existirem
            if [ -d "postgres_data" ]; then
              BACKUP_DIR="/var/www/secured_guard/ci/backups/$(date +'%Y%m%d_%H%M%S')"
              mkdir -p "$BACKUP_DIR"
              cp -r postgres_data "$BACKUP_DIR/" 2>/dev/null || true
              echo "✅ Backup dos dados criado em: $BACKUP_DIR"
            fi
            
            # Parar e remover containers antigos (já foi feito no passo anterior, mas garantindo)
            if command -v docker &> /dev/null && docker compose version &> /dev/null; then
              docker compose -f docker-compose.ci.yml down --remove-orphans 2>/dev/null || true
            else
              docker-compose -f docker-compose.ci.yml down --remove-orphans 2>/dev/null || true
            fi
            
            echo "✅ Containers antigos parados!"
          EOF

      # ============================================
      # 1️⃣6️⃣ FAZER PULL DAS NOVAS IMAGENS
      # ============================================
      - name: 📥 Pull new images
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF'
            echo "📥 Fazendo pull das novas imagens..."
            
            cd /var/www/secured_guard/ci
            
            # Login no Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Remover imagens antigas para forçar pull das novas
            echo "🧹 Removendo imagens antigas para forçar atualização..."
            docker rmi z7design/secured-guard-backend:ci 2>/dev/null || true
            docker rmi z7design/secured-guard-frontend:ci 2>/dev/null || true
            docker rmi z7design/secured-guard-whatsapp:ci 2>/dev/null || true
            
            # Pull das imagens (forçando atualização)
            echo "📥 Fazendo pull das imagens atualizadas..."
            docker pull z7design/secured-guard-backend:ci || echo "⚠️ Erro ao fazer pull do backend"
            docker pull z7design/secured-guard-frontend:ci || echo "⚠️ Erro ao fazer pull do frontend"
            docker pull z7design/secured-guard-whatsapp:ci || echo "⚠️ Erro ao fazer pull do whatsapp"
            
            echo "✅ Imagens atualizadas!"
            
            # Verificar se as imagens foram baixadas
            echo ""
            echo "🔍 Verificando imagens baixadas..."
            docker images | grep "z7design/secured-guard" || echo "⚠️ Nenhuma imagem z7design/secured-guard encontrada"
            
            # Mostrar data de criação das imagens para confirmar que são novas
            echo ""
            echo "📅 Data das imagens baixadas:"
            docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.CreatedAt}}" | grep "z7design/secured-guard" || echo "⚠️ Nenhuma imagem encontrada"
          EOF

      # ============================================
      # 1️⃣6️⃣.5️⃣ VERIFICAR IMAGENS ANTES DE INICIAR
