            echo "⏳ Aguardando containers iniciarem (60s)..."
            sleep 60
            
            # Verificar containers que saíram imediatamente
            echo ""
            echo "🔍 Verificando containers que podem ter saído..."
            EXITED_CONTAINERS=$($DOCKER_CMD ps -a --filter "status=exited" --format "{{.Names}}" | grep "secured-guard" || true)
            if [ -n "$EXITED_CONTAINERS" ]; then
              echo "⚠️ Containers que saíram:"
              echo "$EXITED_CONTAINERS"
              echo ""
              echo "📋 Logs dos containers que saíram:"
