            fi
            
            echo "✅ Verificação concluída!"
          EOF

      # ============================================
      # 1️⃣7️⃣ INICIAR NOVOS CONTAINERS
      # ============================================
      - name: 🚀 Start new containers
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF'
            echo "🚀 =========================================="
            echo "🚀 INICIANDO NOVOS CONTAINERS"
            echo "🚀 ========================================="
            echo ""
            
            # Carregar PATH do Docker (necessário em sessões SSH não-interativas)
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"
            
            # Verificar se Docker está disponível
            DOCKER_CMD=""
            if command -v docker &> /dev/null; then
              DOCKER_CMD="docker"
            elif [ -x /usr/bin/docker ]; then
              DOCKER_CMD="/usr/bin/docker"
              export PATH="/usr/bin:$PATH"
            elif [ -x /usr/local/bin/docker ]; then
              DOCKER_CMD="/usr/local/bin/docker"
              export PATH="/usr/local/bin:$PATH"
            elif [ -x /snap/bin/docker ]; then
              DOCKER_CMD="/snap/bin/docker"
              export PATH="/snap/bin:$PATH"
            else
              echo "⚠️ Docker não encontrado no PATH padrão. Procurando em todo o sistema..."
              DOCKER_FOUND=$(find /usr /opt /snap -name docker -type f -executable 2>/dev/null | head -1)
              if [ -n "$DOCKER_FOUND" ]; then
                DOCKER_CMD="$DOCKER_FOUND"
                export PATH="$(dirname $DOCKER_FOUND):$PATH"
                echo "✅ Docker encontrado em: $DOCKER_FOUND"
              else
                echo "❌ ERRO: Docker não encontrado no sistema!"
                echo "📋 Verificando se Docker está instalado mas não iniciado..."
                if systemctl list-units --type=service | grep -q docker; then
                  echo "⚠️ Serviço Docker encontrado. Tentando iniciar..."
                  systemctl start docker 2>&1 || true
                  sleep 3
                  if command -v docker &> /dev/null; then
                    DOCKER_CMD="docker"
                  fi
                fi
                if [ -z "$DOCKER_CMD" ]; then
                  echo "❌ Docker não está instalado ou não está acessível."
                  echo "📋 Instale o Docker com: apt-get update && apt-get install -y docker.io docker-compose"
                  exit 1
                fi
              fi
            fi
            
            # Verificar se docker-compose está disponível
            COMPOSE_CMD=""
            if command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            elif [ -x /usr/local/bin/docker-compose ]; then
              COMPOSE_CMD="/usr/local/bin/docker-compose"
            elif [ -x /usr/bin/docker-compose ]; then
              COMPOSE_CMD="/usr/bin/docker-compose"
            elif $DOCKER_CMD compose version &> /dev/null 2>&1; then
              COMPOSE_CMD="$DOCKER_CMD compose"
            else
              echo "⚠️ docker-compose não encontrado. Tentando usar 'docker compose' (v2)..."
              if $DOCKER_CMD compose version &> /dev/null 2>&1; then
                COMPOSE_CMD="$DOCKER_CMD compose"
              else
                echo "❌ docker-compose não está disponível!"
                exit 1
              fi
            fi
            
            # Verificar se Docker está funcionando
            if ! $DOCKER_CMD info &> /dev/null; then
              echo "⚠️ Docker não está respondendo. Tentando iniciar serviço..."
              systemctl start docker 2>&1 || true
              sleep 3
              if ! $DOCKER_CMD info &> /dev/null; then
                echo "❌ ERRO: Docker não está funcionando!"
                exit 1
              fi
            fi
            
            echo "✅ Docker encontrado: $DOCKER_CMD"
            echo "✅ Docker versão: $($DOCKER_CMD --version)"
            echo "✅ docker-compose: $COMPOSE_CMD"
            
            cd /var/www/secured_guard/ci
            
            # Garantir que não está em modo Swarm
            if $DOCKER_CMD info 2>/dev/null | grep -q "Swarm: active"; then
              echo "❌ ERRO: Docker ainda está em modo Swarm!"
              echo "🔄 Tentando sair do modo Swarm novamente..."
              $DOCKER_CMD swarm leave --force 2>/dev/null || true
              sleep 5
            fi
            
            # Verificar novamente
            if $DOCKER_CMD info 2>/dev/null | grep -q "Swarm: active"; then
              echo "❌ ERRO: Não foi possível sair do modo Swarm. Abortando..."
              exit 1
            else
