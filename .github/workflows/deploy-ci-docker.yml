      echo "📋 Logs do Frontend:"
      if $DOCKER_CMD ps -a --format "{{.Names}}" | grep -q "^secured-guard-frontend-ci$"; then
        $DOCKER_CMD logs --tail 50 secured-guard-frontend-ci 2>&1 | tail -30
