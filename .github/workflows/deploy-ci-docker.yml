              exit 1
            fi
            
            # Criar redes Docker se não existirem
            echo ""
            echo "🌐 Verificando e criando redes Docker..."
            
            # Criar rede z7network se não existir
            if ! $DOCKER_CMD network ls | grep -q "z7network"; then
              echo "📡 Criando rede z7network..."
              $DOCKER_CMD network create z7network 2>&1 || echo "⚠️ Erro ao criar rede z7network (pode já existir)"
            else
              echo "✅ Rede z7network já existe"
            fi
            
            # Criar rede secured-guard-ci-network se não existir
            if ! $DOCKER_CMD network ls | grep -q "secured-guard-ci"; then
              echo "📡 Criando rede secured-guard-ci-network..."
              $DOCKER_CMD network create secured-guard-ci-network 2>&1 || echo "⚠️ Erro ao criar rede secured-guard-ci-network (pode já existir)"
            else
              echo "✅ Rede secured-guard-ci-network já existe"
            fi
            
            # Verificar se as redes foram criadas
            echo ""
            echo "📋 Redes Docker disponíveis:"
            $DOCKER_CMD network ls | grep -E "(z7network|secured-guard)" || echo "⚠️ Nenhuma rede encontrada"
            
    # Parar containers existentes antes de recriar (sem remover redes compartilhadas)
    echo ""
    echo "🛑 Parando containers existentes..."
    $COMPOSE_CMD -f docker-compose.ci.yml stop 2>&1 || true
    $COMPOSE_CMD -f docker-compose.ci.yml rm -f 2>&1 || true
    sleep 5
            
            # Iniciar TODOS os containers de uma vez (docker-compose gerencia dependências)
            echo ""
            echo "🚀 Iniciando TODOS os containers..."
            echo "📥 Forçando pull das imagens mais recentes..."
            COMPOSE_HTTP_TIMEOUT=300 $COMPOSE_CMD -f docker-compose.ci.yml pull
            COMPOSE_HTTP_TIMEOUT=300 $COMPOSE_CMD -f docker-compose.ci.yml up -d --force-recreate --pull always --remove-orphans
            
            if [ $? -ne 0 ]; then
              echo "❌ ERRO ao iniciar containers!"
