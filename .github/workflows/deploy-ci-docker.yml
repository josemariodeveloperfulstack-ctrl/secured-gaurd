      # Verificar se container existe antes de tentar iniciar
      if $DOCKER_CMD ps -a --format "{{.Names}}" | grep -q "^secured-guard-db-ci$"; then
        $DOCKER_CMD start secured-guard-db-ci 2>&1 || $COMPOSE_CMD -f docker-compose.ci.yml up -d postgres-ci
      else
        $COMPOSE_CMD -f docker-compose.ci.yml up -d postgres-ci
      fi
      sleep 10
    fi
    
    if ! $COMPOSE_CMD -f docker-compose.ci.yml ps redis-ci 2>&1 | grep -q "Up"; then
