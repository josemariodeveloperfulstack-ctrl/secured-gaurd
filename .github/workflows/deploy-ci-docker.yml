      # Verificar se container existe antes de tentar iniciar
      if $DOCKER_CMD ps -a --format "{{.Names}}" | grep -q "^secured-guard-redis-ci$"; then
        $DOCKER_CMD start secured-guard-redis-ci 2>&1 || $COMPOSE_CMD -f docker-compose.ci.yml up -d redis-ci
      else
        $COMPOSE_CMD -f docker-compose.ci.yml up -d redis-ci
      fi
      sleep 10
    fi
            
            # Aguardar PostgreSQL e Redis ficarem saudáveis
            echo "⏳ Aguardando PostgreSQL e Redis ficarem saudáveis (20s)..."
            sleep 20
            
    # Verificar novamente se estão rodando usando docker-compose ps
    if ! $COMPOSE_CMD -f docker-compose.ci.yml ps postgres-ci 2>&1 | grep -q "Up"; then
