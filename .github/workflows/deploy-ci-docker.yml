name: 🐳 Deploy CI Environment (Docker Compose)

on:
  push:
    branches:
      - ci
  workflow_dispatch:

env:
  ENVIRONMENT: ci
  DEPLOY_PATH: /var/www/secured_guard/ci
  APP_URL: https://ci.z7botsolutions.com.br

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy to CI (Docker)
    runs-on: ubuntu-latest
    
    steps:
      # ============================================
      # 1️⃣ CHECKOUT DO CÓDIGO
      # ============================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ci

      # ============================================
      # 2️⃣ SETUP JAVA 17
      # ============================================
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      # ============================================
      # 3️⃣ SETUP NODE.JS 20
      # ============================================
      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ============================================
      # 4️⃣ BUILD BACKEND (Maven)
      # ============================================
      - name: 🔨 Build Backend (Maven)
        working-directory: ./backend
        run: |
          echo "🔨 Compilando backend para ambiente CI..."
          ./mvnw clean package -DskipTests -Dspring.profiles.active=ci
          echo "✅ Backend compilado com sucesso!"
          ls -lh target/*.jar

      # ============================================
      # 5️⃣ BUILD FRONTEND (Vite)
      # ============================================
      - name: 🎨 Build Frontend (Vite)
        working-directory: ./frontend
        env:
          VITE_API_URL: https://ci.z7botsolutions.com.br/api
          VITE_ENVIRONMENT: ci
        run: |
          echo "🎨 Compilando frontend para ambiente CI..."
          npm ci
          npm run build
          echo "✅ Frontend compilado com sucesso!"
          ls -lh dist/

      # ============================================
      # 6️⃣ BUILD DOCKER IMAGES
      # ============================================
      - name: 🐳 Build Docker images
        run: |
          echo "🐳 Construindo imagens Docker..."
          
          # Build backend image
          docker build -t z7design/secured-guard-backend:ci \
            -f backend/Dockerfile.prod ./backend
          
          # Build frontend image
          docker build -t z7design/secured-guard-frontend:ci \
            -f frontend/Dockerfile.prod ./frontend
          
          # Build WhatsApp service image (Baileys)
          docker build -t z7design/secured-guard-whatsapp:ci \
            -f whatsapp-service/Dockerfile ./whatsapp-service
          
          echo "✅ Imagens Docker construídas!"

      # ============================================
      # 7️⃣ LOGIN NO DOCKER HUB
      # ============================================
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ============================================
      # 8️⃣ PUSH IMAGES TO DOCKER HUB
      # ============================================
      - name: 📤 Push images to Docker Hub
        run: |
          echo "📤 Enviando imagens para Docker Hub..."
          docker push z7design/secured-guard-backend:ci
          docker push z7design/secured-guard-frontend:ci
          docker push z7design/secured-guard-whatsapp:ci
          echo "✅ Imagens enviadas com sucesso!"

      # ============================================
      # 9️⃣ INSTALAR SSHPASS E CONFIGURAR SSH
      # ============================================
      - name: 🔑 Install sshpass and configure SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          echo "✅ SSH configurado para usar senha"

      # ============================================
      # 🔟 TRANSFERIR ARQUIVOS PARA VPS
      # ============================================
      - name: 📤 Transfer files to VPS
        run: |
          echo "📤 Transferindo arquivos para VPS..."
          
          # Criar diretório de deploy na VPS
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            mkdir -p /var/www/secured_guard/ci
            mkdir -p /var/www/secured_guard/ci/uploads
            mkdir -p /var/www/secured_guard/ci/logs
            mkdir -p /var/www/secured_guard/ci/nginx
            mkdir -p /var/www/secured_guard/ci/postgres_data
            mkdir -p /var/www/secured_guard/ci/redis_data
            mkdir -p /var/www/secured_guard/ci/evolution_instances
            mkdir -p /var/www/secured_guard/ci/holerites
            mkdir -p /var/www/secured_guard/ci/whatsapp_sessions
          EOF
          
          # Transferir docker-compose.ci.yml
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp docker-compose.ci.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured_guard/ci/
          
          # Transferir configuração do nginx
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp nginx/ci.conf \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured_guard/ci/nginx/
          
          echo "✅ Arquivos transferidos com sucesso!"

      # ============================================
      # 1️⃣1️⃣ VALIDAR E CONFIGURAR JWT_SECRET
      # ============================================
      - name: 🔐 Validate and configure JWT_SECRET
        run: |
          echo "🔐 Validando JWT_SECRET..."
          
          # Valor padrão seguro (80 caracteres - suficiente para HS512)
          DEFAULT_JWT_SECRET="jwt_secret_ci_2025_secure_key_64bytes_minimum_required_for_hmac_sha512_algorithm_secure_extra_long_key"
          
          # Usar secret se estiver definido e tiver pelo menos 64 caracteres
          if [ -n "${{ secrets.JWT_SECRET }}" ] && [ ${#{{ secrets.JWT_SECRET }}} -ge 64 ]; then
            JWT_SECRET_VALUE="${{ secrets.JWT_SECRET }}"
            echo "✅ Usando JWT_SECRET do GitHub Secrets (${#JWT_SECRET_VALUE} caracteres)"
          else
            JWT_SECRET_VALUE="$DEFAULT_JWT_SECRET"
            if [ -n "${{ secrets.JWT_SECRET }}" ]; then
              echo "⚠️ JWT_SECRET do GitHub Secrets é muito curto (${#{{ secrets.JWT_SECRET }}} caracteres). Usando valor padrão."
            else
              echo "ℹ️ JWT_SECRET não está definido no GitHub Secrets. Usando valor padrão."
            fi
          fi
          
          # Verificar tamanho final
          if [ ${#JWT_SECRET_VALUE} -lt 64 ]; then
            echo "❌ ERRO: JWT_SECRET ainda é muito curto (${#JWT_SECRET_VALUE} caracteres)!"
            exit 1
          fi
          
          echo "✅ JWT_SECRET configurado com ${#JWT_SECRET_VALUE} caracteres (mínimo: 64)"
          echo "JWT_SECRET_VALUE=$JWT_SECRET_VALUE" >> $GITHUB_ENV

      # ============================================
      # 1️⃣2️⃣ CRIAR ARQUIVO .ENV NA VPS
      # ============================================
      - name: ⚙️ Create .env file on VPS
        env:
          JWT_SECRET_VALUE: ${{ env.JWT_SECRET_VALUE }}
        run: |
          echo "⚙️ Criando arquivo .env localmente..."
          
          # Criar arquivo .env localmente
          cat > .env.ci << EOF
# ===== AMBIENTE CI =====
ENVIRONMENT=ci
APP_URL=https://ci.z7botsolutions.com.br

# ===== BANCO DE DADOS =====
POSTGRES_PASSWORD_CI=${{ secrets.POSTGRES_PASSWORD_CI }}

# ===== REDIS =====
REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

# ===== JWT =====
# Valor padrão seguro (80 caracteres) se não estiver definido no host
JWT_SECRET=${{ env.JWT_SECRET_VALUE }}

# ===== DOCKER =====
DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}
EOF
          
          # Verificar tamanho do JWT_SECRET no arquivo
          JWT_LENGTH=$(grep "^JWT_SECRET=" .env.ci | cut -d'=' -f2 | wc -c)
          echo "Tamanho do JWT_SECRET: $((JWT_LENGTH - 1)) caracteres"
          
          if [ $JWT_LENGTH -lt 65 ]; then
            echo "❌ ERRO: JWT_SECRET no .env é muito curto!"
            exit 1
          fi
          
          # Transferir arquivo para VPS
          echo "📤 Transferindo .env para VPS..."
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp .env.ci \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured_guard/ci/.env
          
          # Definir permissões corretas
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chmod 600 /var/www/secured_guard/ci/.env && echo '✅ Arquivo .env criado e configurado!'"
          
          # Verificar no servidor remoto
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🔍 Verificando JWT_SECRET no .env remoto..."
            JWT_LENGTH=$(grep "^JWT_SECRET=" /var/www/secured_guard/ci/.env | cut -d'=' -f2 | wc -c)
            echo "Tamanho do JWT_SECRET no servidor: $((JWT_LENGTH - 1)) caracteres"
            
            if [ $JWT_LENGTH -lt 65 ]; then
              echo "❌ ERRO: JWT_SECRET no .env remoto é muito curto!"
              exit 1
            fi
            echo "✅ JWT_SECRET verificado com sucesso!"
          EOF

      # ============================================
      # 1️⃣3️⃣ GARANTIR QUE JWT_SECRET ESTÁ CORRETO NO HOST E NO .ENV
      # ============================================
      - name: 🔐 Ensure JWT_SECRET is correct on host and .env
        env:
          JWT_SECRET_VALUE: ${{ env.JWT_SECRET_VALUE }}
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            echo "🔐 Verificando e corrigindo JWT_SECRET no host e .env..."
            
            # Valor correto do JWT_SECRET
            CORRECT_JWT_SECRET="${{ env.JWT_SECRET_VALUE }}"
            
            # 1. Remover JWT_SECRET do ambiente do host se estiver definido com valor curto
            if [ -n "\$JWT_SECRET" ]; then
              JWT_LENGTH=\${#JWT_SECRET}
              if [ \$JWT_LENGTH -lt 64 ]; then
                echo "⚠️ JWT_SECRET no host é muito curto (\$JWT_LENGTH caracteres). Removendo..."
                unset JWT_SECRET
                # Remover de .bashrc, .bash_profile, .profile se existir
                sed -i '/^export JWT_SECRET=/d' ~/.bashrc 2>/dev/null || true
                sed -i '/^export JWT_SECRET=/d' ~/.bash_profile 2>/dev/null || true
                sed -i '/^export JWT_SECRET=/d' ~/.profile 2>/dev/null || true
                echo "✅ JWT_SECRET removido do ambiente do host"
              else
                echo "✅ JWT_SECRET no host está OK (\$JWT_LENGTH caracteres)"
              fi
            else
              echo "ℹ️ JWT_SECRET não está definido no host (usando valor do .env ou docker-compose)"
            fi
            
            # 2. Verificar e corrigir JWT_SECRET no arquivo .env
            cd /var/www/secured_guard/ci
            if [ -f .env ]; then
              CURRENT_JWT=\$(grep "^JWT_SECRET=" .env | cut -d'=' -f2 || echo "")
              if [ -n "\$CURRENT_JWT" ]; then
                CURRENT_LENGTH=\${#CURRENT_JWT}
                echo "JWT_SECRET atual no .env: \${CURRENT_JWT:0:20}... (\$CURRENT_LENGTH caracteres)"
                
                if [ \$CURRENT_LENGTH -lt 64 ]; then
                  echo "⚠️ JWT_SECRET no .env é muito curto! Corrigindo..."
                  # Atualizar JWT_SECRET no .env
                  sed -i "s|^JWT_SECRET=.*|JWT_SECRET=\${CORRECT_JWT_SECRET}|g" .env
                  echo "✅ JWT_SECRET corrigido no .env"
                else
                  echo "✅ JWT_SECRET no .env está OK (\$CURRENT_LENGTH caracteres)"
                  # Mesmo assim, garantir que está usando o valor correto
                  sed -i "s|^JWT_SECRET=.*|JWT_SECRET=\${CORRECT_JWT_SECRET}|g" .env
                  echo "✅ JWT_SECRET atualizado para garantir valor correto"
                fi
              else
                echo "⚠️ JWT_SECRET não encontrado no .env. Adicionando..."
                echo "JWT_SECRET=\${CORRECT_JWT_SECRET}" >> .env
                echo "✅ JWT_SECRET adicionado ao .env"
              fi
              
              # Verificar novamente após correção
              VERIFIED_JWT=\$(grep "^JWT_SECRET=" .env | cut -d'=' -f2)
              VERIFIED_LENGTH=\${#VERIFIED_JWT}
              if [ \$VERIFIED_LENGTH -ge 64 ]; then
                echo "✅ JWT_SECRET verificado no .env: \${VERIFIED_LENGTH} caracteres"
              else
                echo "❌ ERRO: JWT_SECRET ainda está incorreto após correção!"
                exit 1
              fi
            else
              echo "⚠️ Arquivo .env não existe. Será criado no próximo passo."
            fi
          EOF

      # ============================================
      # 1️⃣4️⃣ FORÇAR CORREÇÃO DO .ENV ANTES DE PARAR CONTAINERS
      # ============================================
      - name: 🔧 Force .env correction before stopping containers
        env:
          JWT_SECRET_VALUE: ${{ env.JWT_SECRET_VALUE }}
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            echo "🔧 Forçando correção do .env antes de parar containers..."
            
            cd /var/www/secured_guard/ci
            CORRECT_JWT_SECRET="${{ env.JWT_SECRET_VALUE }}"
            
            # Garantir que o .env existe e tem o JWT_SECRET correto
            if [ ! -f .env ]; then
              echo "Criando arquivo .env..."
              touch .env
            fi
            
            # Atualizar ou adicionar JWT_SECRET
            if grep -q "^JWT_SECRET=" .env; then
              sed -i "s|^JWT_SECRET=.*|JWT_SECRET=\${CORRECT_JWT_SECRET}|g" .env
              echo "✅ JWT_SECRET atualizado no .env"
            else
              echo "JWT_SECRET=\${CORRECT_JWT_SECRET}" >> .env
              echo "✅ JWT_SECRET adicionado ao .env"
            fi
            
            # Verificar tamanho
            JWT_LENGTH=\$(grep "^JWT_SECRET=" .env | cut -d'=' -f2 | wc -c)
            echo "Tamanho do JWT_SECRET no .env: \$((JWT_LENGTH - 1)) caracteres"
            
            if [ \$JWT_LENGTH -lt 65 ]; then
              echo "❌ ERRO: JWT_SECRET ainda está muito curto após correção!"
              exit 1
            fi
            
            echo "✅ .env corrigido e verificado!"
          EOF

      # ============================================
      # 1️⃣5️⃣ FAZER BACKUP E PARAR CONTAINERS ANTIGOS
      # ============================================
      - name: 💾 Backup and stop old containers
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "💾 Fazendo backup e parando containers antigos..."
            
            cd /var/www/secured_guard/ci
            
            # Fazer backup dos volumes se existirem
            if [ -d "postgres_data" ]; then
              BACKUP_DIR="/var/www/secured_guard/ci/backups/$(date +'%Y%m%d_%H%M%S')"
              mkdir -p "$BACKUP_DIR"
              cp -r postgres_data "$BACKUP_DIR/" 2>/dev/null || true
              echo "✅ Backup dos dados criado em: $BACKUP_DIR"
            fi
            
            # Parar e remover containers antigos
            docker-compose -f docker-compose.ci.yml down || true
            
            echo "✅ Containers antigos parados!"
          EOF

      # ============================================
      # 1️⃣6️⃣ FAZER PULL DAS NOVAS IMAGENS
      # ============================================
      - name: 📥 Pull new images
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "📥 Fazendo pull das novas imagens..."
            
            cd /var/www/secured_guard/ci
            
            # Login no Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Pull das imagens
            docker pull z7design/secured-guard-backend:ci
            docker pull z7design/secured-guard-frontend:ci
            docker pull z7design/secured-guard-whatsapp:ci
            
            echo "✅ Imagens atualizadas!"
          EOF

      # ============================================
      # 1️⃣7️⃣ INICIAR NOVOS CONTAINERS
      # ============================================
      - name: 🚀 Start new containers
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🚀 Iniciando novos containers..."
            
            cd /var/www/secured_guard/ci
            
            # Iniciar containers
            docker-compose -f docker-compose.ci.yml up -d
            
            echo "⏳ Aguardando containers iniciarem (30s)..."
            sleep 30
            
            # Verificar status dos containers
            docker-compose -f docker-compose.ci.yml ps
            
            echo "✅ Containers iniciados!"
          EOF

      # ============================================
      # 1️⃣8️⃣ VERIFICAR JWT_SECRET NO CONTAINER
      # ============================================
      - name: 🔐 Verify JWT_SECRET in container
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🔐 Verificando JWT_SECRET no container backend..."
            
            # Aguardar container iniciar
            sleep 10
            
            # Verificar se JWT_SECRET está configurado corretamente
            JWT_SECRET_IN_CONTAINER=$(docker exec secured-guard-backend-ci printenv JWT_SECRET 2>/dev/null || echo "")
            
            if [ -z "$JWT_SECRET_IN_CONTAINER" ]; then
              echo "❌ ERRO: JWT_SECRET não está definido no container!"
              exit 1
            fi
            
            JWT_LENGTH=${#JWT_SECRET_IN_CONTAINER}
            echo "Tamanho do JWT_SECRET no container: $JWT_LENGTH caracteres"
            
            if [ $JWT_LENGTH -lt 64 ]; then
              echo "❌ ERRO: JWT_SECRET no container é muito curto ($JWT_LENGTH caracteres)!"
              echo "Valor atual (primeiros 30 caracteres): ${JWT_SECRET_IN_CONTAINER:0:30}..."
              exit 1
            fi
            
            echo "✅ JWT_SECRET está configurado corretamente no container ($JWT_LENGTH caracteres)"
          EOF

      # ============================================
      # 1️⃣9️⃣ DIAGNÓSTICO DOS CONTAINERS
      # ============================================
      - name: 🔍 Diagnostic - Container Status
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🔍 Verificando status dos containers..."
            cd /var/www/secured_guard/ci
            docker-compose -f docker-compose.ci.yml ps
            
            echo ""
            echo "🔍 Verificando logs do backend (últimas 50 linhas)..."
            docker logs --tail 50 secured-guard-backend-ci
            
            echo ""
            echo "🔍 Verificando logs do frontend (últimas 30 linhas)..."
            docker logs --tail 30 secured-guard-frontend-ci
            
            echo ""
            echo "🔍 Verificando logs do nginx (últimas 30 linhas)..."
            docker logs --tail 30 secured-guard-nginx-ci
          EOF

      # ============================================
      # 2️⃣0️⃣ DIAGNÓSTICO DE CONECTIVIDADE
      # ============================================
      - name: 🌐 Diagnostic - Network Connectivity
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🌐 Testando conectividade..."
            
            # Testar backend diretamente
            echo "1. Testando backend na porta 8081..."
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:8081/api/health || echo "❌ Backend não responde"
            
            # Testar nginx
            echo "2. Testando nginx na porta 8082..."
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:8082 || echo "❌ Nginx não responde"
            
            # Verificar Traefik
            echo "3. Verificando Traefik..."
            if docker ps | grep -q traefik; then
              echo "✅ Traefik está rodando"
            else
              echo "❌ Traefik NÃO está rodando!"
            fi
          EOF

      # ============================================
      # 2️⃣1️⃣ VERIFICAR STATUS DOS CONTAINERS ANTES DO HEALTH CHECK
      # ============================================
      - name: 🔍 Verify containers are running
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🔍 Verificando status dos containers..."
            cd /var/www/secured_guard/ci
            
            # Verificar se containers estão rodando
            docker-compose -f docker-compose.ci.yml ps
            
            # Verificar logs do backend para ver se iniciou
            echo ""
            echo "📋 Últimas 30 linhas dos logs do backend:"
            docker logs --tail 30 secured-guard-backend-ci 2>&1 || echo "⚠️ Container backend não encontrado"
            
            # Verificar se o backend está escutando na porta
            echo ""
            echo "🔌 Verificando se backend está escutando na porta 8081..."
            timeout 5 bash -c 'until nc -z localhost 8081; do sleep 1; done' && echo "✅ Backend está escutando" || echo "⚠️ Backend ainda não está escutando"
          EOF

      # ============================================
      # 2️⃣2️⃣ HEALTH CHECK COM MAIS TEMPO E DIAGNÓSTICO
      # ============================================
      - name: 🏥 Health check
        run: |
          echo "🏥 Verificando saúde da aplicação CI..."
          echo "⏳ Aguardando 60 segundos para aplicação inicializar completamente..."
          sleep 60
          
          MAX_ATTEMPTS=15
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Tentativa $ATTEMPT de $MAX_ATTEMPTS..."
            
            # Tentar health check com timeout maior
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 https://ci.z7botsolutions.com.br/api/health 2>&1 || echo "000")
            
            echo "HTTP Code recebido: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passou! Aplicação CI está respondendo."
              
              # Verificar resposta completa
              RESPONSE=$(curl -s --max-time 10 https://ci.z7botsolutions.com.br/api/health)
              echo "Resposta completa: $RESPONSE"
              
              exit 0
            elif [ "$HTTP_CODE" = "000" ]; then
              echo "⚠️ Timeout ou erro de conexão. Aplicação ainda pode estar iniciando..."
            else
              echo "⚠️ HTTP Code: $HTTP_CODE (esperado: 200)"
            fi
            
            # A cada 3 tentativas, verificar logs do backend
            if [ $((ATTEMPT % 3)) -eq 0 ]; then
              echo ""
              echo "🔍 Verificando logs do backend (últimas 20 linhas)..."
              sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
                cd /var/www/secured_guard/ci
                docker logs --tail 20 secured-guard-backend-ci 2>&1 | tail -20
              EOF
            fi
            
            echo "⏳ Aguardando 15 segundos antes da próxima tentativa..."
            sleep 15
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo ""
          echo "❌ Health check falhou após $MAX_ATTEMPTS tentativas!"
          echo ""
          echo "🔍 Coletando informações de diagnóstico..."
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "📋 Status dos containers:"
            cd /var/www/secured_guard/ci
            docker-compose -f docker-compose.ci.yml ps
            
            echo ""
            echo "📋 Logs do backend (últimas 50 linhas):"
            docker logs --tail 50 secured-guard-backend-ci 2>&1 || echo "Container não encontrado"
            
            echo ""
            echo "📋 Logs do nginx (últimas 30 linhas):"
            docker logs --tail 30 secured-guard-nginx-ci 2>&1 || echo "Container nginx não encontrado"
            
            echo ""
            echo "🌐 Testando conectividade interna:"
            curl -s -o /dev/null -w "Backend (localhost:8081): %{http_code}\n" http://localhost:8081/api/health || echo "Backend não responde"
          EOF
          
          exit 1

      # ============================================
      # 2️⃣3️⃣ NOTIFICAÇÃO DE SUCESSO
      # ============================================
      - name: 🎉 Deployment successful
        if: success()
        run: |
          echo "🎉 ================================"
          echo "✅ DEPLOY CI CONCLUÍDO COM SUCESSO!"
          echo "🐳 Método: Docker Compose"
          echo "🌐 URL: https://ci.z7botsolutions.com.br"
          echo "📅 Data: $(date +'%Y-%m-%d %H:%M:%S')"
          echo "🔖 Commit: ${{ github.sha }}"
          echo "🌿 Branch: ci"
          echo "================================"

      # ============================================
      # 2️⃣4️⃣ ROLLBACK EM CASO DE FALHA
      # ============================================
      - name: 🔄 Rollback on failure
        if: failure()
        run: |
          echo "❌ Deploy falhou! Iniciando rollback..."
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/secured_guard/ci
            
            # Parar containers atuais
            docker-compose -f docker-compose.ci.yml down
            
            # Restaurar backup se existir
            LATEST_BACKUP=$(ls -t /var/www/secured_guard/ci/backups/ | head -1)
            
            if [ -n "$LATEST_BACKUP" ]; then
              echo "🔄 Restaurando backup: $LATEST_BACKUP"
              
              # Restaurar dados do banco
              rm -rf postgres_data
              cp -r "/var/www/secured_guard/ci/backups/$LATEST_BACKUP/postgres_data" ./
              
              # Iniciar containers com versão anterior
              docker-compose -f docker-compose.ci.yml up -d
              
              echo "✅ Rollback concluído!"
            else
              echo "⚠️ Nenhum backup encontrado para rollback"
            fi
          EOF
