    fi
            
            echo "⏳ Aguardando containers iniciarem (30s)..."
            sleep 30
            
            # Verificar status dos containers
            echo ""
            echo "📋 Status dos containers:"
            $COMPOSE_CMD -f docker-compose.ci.yml ps
            
            # Verificar se containers foram criados
            echo ""
            echo "🔍 Verificando containers criados..."
            $DOCKER_CMD ps -a | grep "secured-guard" || echo "⚠️ Nenhum container secured-guard encontrado"
            
            # Verificar e tentar iniciar containers que não estão rodando
            echo ""
            echo "🔍 Verificando e corrigindo containers que não estão rodando..."
            REQUIRED_SERVICES=("postgres-ci" "redis-ci" "backend-ci" "whatsapp-service-ci" "frontend-ci" "nginx-ci")
            MAX_RETRIES=3
            RETRY=0
            
            while [ $RETRY -lt $MAX_RETRIES ]; do
              RETRY=$((RETRY + 1))
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "Verificação $RETRY de $MAX_RETRIES..."
              
              STOPPED_SERVICES=()
              
              # Usar docker-compose ps para verificar status real
              for service in "${REQUIRED_SERVICES[@]}"; do
                SERVICE_STATUS=$($COMPOSE_CMD -f docker-compose.ci.yml ps "$service" 2>&1 | tail -1 || echo "")
                if echo "$SERVICE_STATUS" | grep -q "Up"; then
                  echo "  ✅ $service está rodando"
                elif echo "$SERVICE_STATUS" | grep -q "Exit"; then
                  echo "  ⚠️ $service saiu (Exit)"
                  STOPPED_SERVICES+=("$service")
                  
                  # Mostrar logs do serviço que saiu
                  echo "  📋 Logs de $service:"
                  $COMPOSE_CMD -f docker-compose.ci.yml logs --tail 30 "$service" 2>&1 | tail -20 || echo "  ⚠️ Não foi possível obter logs"
                else
                  echo "  ❌ $service não está rodando"
                  STOPPED_SERVICES+=("$service")
                fi
              done
              
              if [ ${#STOPPED_SERVICES[@]} -eq 0 ]; then
                echo ""
                echo "✅ Todos os containers estão rodando!"
                break
              fi
              
              if [ $RETRY -lt $MAX_RETRIES ]; then
                echo ""
                echo "🔄 Tentando reiniciar serviços parados..."
                
                for service in "${STOPPED_SERVICES[@]}"; do
                  echo "  🔄 Reiniciando $service..."
                  
                  # Tentar reiniciar o serviço
                  $COMPOSE_CMD -f docker-compose.ci.yml restart "$service" 2>&1 || {
                    echo "  ⚠️ Erro ao reiniciar $service. Tentando recriar..."
                    $COMPOSE_CMD -f docker-compose.ci.yml pull "$service" 2>&1 || echo "  ⚠️ Erro ao fazer pull de $service"
                    $COMPOSE_CMD -f docker-compose.ci.yml up -d --force-recreate --pull always "$service" 2>&1 || echo "  ⚠️ Erro ao recriar $service"
                  }
                done
                
                echo "⏳ Aguardando serviços iniciarem (30s)..."
                sleep 30
              fi
            done
            
            # Verificação final usando docker-compose ps
            echo ""
            echo "🔍 Verificação final dos containers..."
            FINAL_STOPPED=()
            
            for service in "${REQUIRED_SERVICES[@]}"; do
              SERVICE_STATUS=$($COMPOSE_CMD -f docker-compose.ci.yml ps "$service" 2>&1 | tail -1 || echo "")
              if ! echo "$SERVICE_STATUS" | grep -q "Up"; then
                echo "  ❌ $service NÃO está rodando!"
                FINAL_STOPPED+=("$service")
                
                # Mostrar logs do serviço que não está rodando
                echo "  📋 Logs de $service:"
                $COMPOSE_CMD -f docker-compose.ci.yml logs --tail 50 "$service" 2>&1 | tail -30 || echo "  ⚠️ Não foi possível obter logs"
              fi
            done
            
            if [ ${#FINAL_STOPPED[@]} -gt 0 ]; then
              echo ""
              echo "❌ ERRO: Os seguintes serviços não estão rodando após $MAX_RETRIES tentativas:"
              printf '  - %s\n' "${FINAL_STOPPED[@]}"
              echo ""
              echo "📋 Logs do docker-compose (últimos 100 linhas):"
              $COMPOSE_CMD -f docker-compose.ci.yml logs --tail 100 2>&1 | tail -100
              echo ""
              echo "📋 Status detalhado:"
              $COMPOSE_CMD -f docker-compose.ci.yml ps -a
              echo ""
              echo "📋 Containers que saíram:"
              $DOCKER_CMD ps -a --filter "status=exited" --format "table {{.Names}}\t{{.Status}}\t{{.ExitCode}}" | grep "secured-guard" || echo "Nenhum container exited encontrado"
              exit 1
            fi
            
            echo ""
            echo "✅ Todos os containers estão rodando com sucesso!"
          EOF

      # ============================================
      # 1️⃣7️⃣.5️⃣ VERIFICAR E CORRIGIR CONTAINERS QUE NÃO ESTÃO RODANDO
      # ============================================
      - name: 🔧 Fix containers that are not running
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF'
            echo "🔧 Verificando e corrigindo containers que não estão rodando..."
            
            cd /var/www/secured_guard/ci
            
            # Verificar containers críticos (incluindo PostgreSQL e Redis)
            CRITICAL_CONTAINERS=("secured-guard-db-ci" "secured-guard-redis-ci" "secured-guard-backend-ci" "secured-guard-whatsapp-ci" "secured-guard-frontend-ci" "secured-guard-nginx-ci")
            
            for container in "${CRITICAL_CONTAINERS[@]}"; do
              if ! docker ps --format "{{.Names}}" | grep -q "^${container}$"; then
                echo "⚠️ $container não está rodando!"
                echo "📋 Verificando logs..."
                docker logs --tail 50 "$container" 2>&1 | tail -30 || echo "Container não encontrado"
                
                # Tentar iniciar
                echo "🔄 Tentando iniciar $container..."
                docker start "$container" 2>&1 || {
                  echo "⚠️ Erro ao iniciar. Tentando recriar..."
                  
                  # Extrair nome do serviço do docker-compose
                  if [[ "$container" == *"db"* ]] || [[ "$container" == *"postgres"* ]]; then
                    SERVICE_NAME="postgres-ci"
                  elif [[ "$container" == *"redis"* ]]; then
                    SERVICE_NAME="redis-ci"
                  elif [[ "$container" == *"backend"* ]]; then
                    SERVICE_NAME="backend-ci"
                  elif [[ "$container" == *"whatsapp"* ]]; then
                    SERVICE_NAME="whatsapp-service-ci"
                  elif [[ "$container" == *"frontend"* ]]; then
                    SERVICE_NAME="frontend-ci"
                  elif [[ "$container" == *"nginx"* ]]; then
                    SERVICE_NAME="nginx-ci"
                  else
                    continue
                  fi
                  
                  # Recriar o serviço
                  if command -v docker &> /dev/null && docker compose version &> /dev/null; then
                    docker compose -f docker-compose.ci.yml pull "$SERVICE_NAME" 2>&1 || echo "  ⚠️ Erro ao fazer pull de $SERVICE_NAME"
                    docker compose -f docker-compose.ci.yml up -d --force-recreate --pull always --no-deps "$SERVICE_NAME"
                  else
                    docker-compose -f docker-compose.ci.yml pull "$SERVICE_NAME" 2>&1 || echo "  ⚠️ Erro ao fazer pull de $SERVICE_NAME"
                    docker-compose -f docker-compose.ci.yml up -d --force-recreate --pull always --no-deps "$SERVICE_NAME"
                  fi
                  
                  echo "⏳ Aguardando $container iniciar (15s)..."
                  sleep 15
                  
                  # Verificar novamente
                  if docker ps --format "{{.Names}}" | grep -q "^${container}$"; then
                    echo "✅ $container iniciado com sucesso!"
                  else
                    echo "❌ $container ainda não está rodando após recriação"
                    echo "📋 Logs finais:"
                    docker logs --tail 30 "$container" 2>&1 | tail -20 || echo "Container não encontrado"
                  fi
                }
              else
                echo "✅ $container está rodando"
              fi
            done
            
            # Verificação final
            echo ""
            echo "🔍 Verificação final dos containers críticos..."
            ALL_RUNNING=true
            
            for container in "${CRITICAL_CONTAINERS[@]}"; do
              if ! docker ps --format "{{.Names}}" | grep -q "^${container}$"; then
                echo "❌ $container NÃO está rodando!"
                ALL_RUNNING=false
              fi
            done
            
            if [ "$ALL_RUNNING" = false ]; then
              echo ""
              echo "❌ ERRO: Alguns containers críticos não estão rodando!"
              echo "📋 Status de todos os containers:"
              docker ps -a | grep "secured-guard" || echo "Nenhum container encontrado"
              exit 1
            fi
            
            echo "✅ Todos os containers críticos estão rodando!"
          EOF

      # ============================================
      # 1️⃣8️⃣ VERIFICAR E CORRIGIR JWT_SECRET NO CONTAINER
      # ============================================
      - name: 🔐 Verify and fix JWT_SECRET in container
        env:
          JWT_SECRET_VALUE: ${{ env.JWT_SECRET_VALUE }}
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << EOF
            echo "🔐 Verificando e corrigindo JWT_SECRET no container backend..."
            
            # Aguardar container iniciar
            sleep 15
            
            CORRECT_JWT_SECRET="${{ env.JWT_SECRET_VALUE }}"
            MAX_RETRIES=3
            RETRY=0
            
            while [ \$RETRY -lt \$MAX_RETRIES ]; do
              RETRY=\$((RETRY + 1))
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "Tentativa \$RETRY de \$MAX_RETRIES..."
              
              # Verificar se JWT_SECRET está configurado corretamente
              JWT_SECRET_IN_CONTAINER=\$(docker exec secured-guard-backend-ci printenv JWT_SECRET 2>/dev/null || echo "")
              
              if [ -z "\$JWT_SECRET_IN_CONTAINER" ]; then
                echo "⚠️ JWT_SECRET não está definido no container. Corrigindo..."
              else
                JWT_LENGTH=\${#JWT_SECRET_IN_CONTAINER}
                echo "JWT_SECRET atual no container: \${JWT_SECRET_IN_CONTAINER:0:30}... (\$JWT_LENGTH caracteres)"
                
                if [ \$JWT_LENGTH -ge 64 ]; then
                  echo "✅ JWT_SECRET está configurado corretamente no container (\$JWT_LENGTH caracteres)"
                  break
                else
                  echo "⚠️ JWT_SECRET no container é muito curto (\$JWT_LENGTH caracteres). Corrigindo..."
                fi
              fi
              
              # Corrigir .env se necessário
              cd /var/www/secured_guard/ci
              if [ -f .env ]; then
                sed -i "s|^JWT_SECRET=.*|JWT_SECRET=\${CORRECT_JWT_SECRET}|g" .env
                echo "✅ .env atualizado com JWT_SECRET correto"
              fi
              
              # Reiniciar container backend para aplicar mudanças
              echo "🔄 Reiniciando container backend..."
              docker-compose -f docker-compose.ci.yml restart backend-ci
              
              echo "⏳ Aguardando container reiniciar (20s)..."
              sleep 20
              
              # Verificar se container está rodando
              if ! docker ps | grep -q secured-guard-backend-ci; then
                echo "❌ Container não está rodando após reinício!"
                docker logs --tail 30 secured-guard-backend-ci 2>&1 || echo "Container não encontrado"
                if [ \$RETRY -lt \$MAX_RETRIES ]; then
                  echo "Tentando iniciar container novamente..."
                  docker-compose -f docker-compose.ci.yml up -d backend-ci
                  sleep 20
                fi
              fi
            done
            
            # Verificação final
            FINAL_JWT=\$(docker exec secured-guard-backend-ci printenv JWT_SECRET 2>/dev/null || echo "")
            if [ -z "\$FINAL_JWT" ]; then
              echo "❌ ERRO: JWT_SECRET ainda não está definido no container após \$MAX_RETRIES tentativas!"
              echo "📋 Logs do backend:"
              docker logs --tail 50 secured-guard-backend-ci 2>&1 | grep -i jwt || echo "Nenhum log JWT encontrado"
              exit 1
            fi
            
            FINAL_LENGTH=\${#FINAL_JWT}
            if [ \$FINAL_LENGTH -lt 64 ]; then
              echo "❌ ERRO: JWT_SECRET ainda está muito curto (\$FINAL_LENGTH caracteres) após \$MAX_RETRIES tentativas!"
              echo "Valor atual: \${FINAL_JWT:0:50}..."
              echo "📋 Verificando .env:"
              grep "^JWT_SECRET=" .env || echo "JWT_SECRET não encontrado no .env"
              exit 1
            fi
            
            echo ""
            echo "✅ JWT_SECRET verificado e corrigido com sucesso!"
            echo "   Tamanho: \$FINAL_LENGTH caracteres"
            echo "   Valor (primeiros 30): \${FINAL_JWT:0:30}..."
          EOF

      # ============================================
      # 1️⃣9️⃣ GARANTIR ROLES E PERMISSÕES DOS USUÁRIOS
      # ============================================
      - name: 👥 Ensure user roles and permissions
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF'
            echo "👥 Verificando e garantindo roles e permissões dos usuários..."
            
            # Aguardar backend estar totalmente pronto
            sleep 30
            
            # Verificar se o backend está respondendo
            MAX_ATTEMPTS=10
            ATTEMPT=0
            BACKEND_READY=false
            
            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              ATTEMPT=$((ATTEMPT + 1))
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/api/health 2>/dev/null || echo "000")
              
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Backend está respondendo"
                BACKEND_READY=true
                break
              else
                echo "⏳ Aguardando backend iniciar... (tentativa $ATTEMPT/$MAX_ATTEMPTS)"
                sleep 10
              fi
            done
            
            if [ "$BACKEND_READY" = false ]; then
              echo "⚠️ Backend não está respondendo, mas continuando..."
              echo "📋 Logs do backend:"
              docker logs --tail 30 secured-guard-backend-ci 2>&1 | tail -20
            else
              echo "✅ Backend está pronto. Roles e permissões serão criadas automaticamente pelo RoleMigrationService."
              echo "   O serviço RoleMigrationService executa na inicialização da aplicação."
            fi
            
            # Verificar logs do backend para confirmar que roles foram criadas
            echo ""
            echo "📋 Verificando logs de migração de roles..."
            docker logs secured-guard-backend-ci 2>&1 | grep -i "role\|migration\|migração" | tail -10 || echo "Nenhum log de roles encontrado"
          EOF

      # ============================================
      # 2️⃣0️⃣ DIAGNÓSTICO DOS CONTAINERS
      # ============================================
      - name: 🔍 Diagnostic - Container Status
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF'
            echo "🔍 Verificando status dos containers..."
            cd /var/www/secured_guard/ci
            docker-compose -f docker-compose.ci.yml ps
            
            echo ""
            echo "🔍 Verificando logs do backend (últimas 50 linhas)..."
            docker logs --tail 50 secured-guard-backend-ci
            
            echo ""
            echo "🔍 Verificando logs do frontend (últimas 30 linhas)..."
            docker logs --tail 30 secured-guard-frontend-ci 2>&1 || echo "⚠️ Container frontend não encontrado"
            
            echo ""
            echo "🔍 Verificando logs do WhatsApp (últimas 30 linhas)..."
            docker logs --tail 30 secured-guard-whatsapp-ci 2>&1 || echo "⚠️ Container WhatsApp não encontrado"
            
            echo ""
            echo "🔍 Verificando logs do nginx (últimas 30 linhas)..."
            docker logs --tail 30 secured-guard-nginx-ci 2>&1 || echo "⚠️ Container nginx não encontrado"
          EOF

      # ============================================
      # 2️⃣1️⃣ DIAGNÓSTICO DE CONECTIVIDADE
      # ============================================
      - name: 🌐 Diagnostic - Network Connectivity
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF'
            echo "🌐 Testando conectividade..."
            
            # Testar backend diretamente
            echo "1. Testando backend na porta 8081..."
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:8081/api/health || echo "❌ Backend não responde"
            
            # Testar nginx
            echo "2. Testando nginx na porta 8082..."
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:8082 || echo "❌ Nginx não responde"
            
            # Verificar Traefik
            echo "3. Verificando Traefik..."
            if docker ps | grep -q traefik; then
              echo "✅ Traefik está rodando"
            else
              echo "❌ Traefik NÃO está rodando!"
            fi
          EOF

      # ============================================
      # 2️⃣2️⃣ VERIFICAR STATUS DOS CONTAINERS ANTES DO HEALTH CHECK
      # ============================================
      - name: 🔍 Verify containers are running
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF'
            echo "🔍 Verificando status dos containers..."
            cd /var/www/secured_guard/ci
            
            # Verificar se containers estão rodando
            docker-compose -f docker-compose.ci.yml ps
            
            # Verificar logs do backend para ver se iniciou
            echo ""
            echo "📋 Últimas 30 linhas dos logs do backend:"
            docker logs --tail 30 secured-guard-backend-ci 2>&1 || echo "⚠️ Container backend não encontrado"
            
            # Verificar se o backend está escutando na porta
            echo ""
            echo "🔌 Verificando se backend está escutando na porta 8081..."
            timeout 5 bash -c 'until nc -z localhost 8081; do sleep 1; done' && echo "✅ Backend está escutando" || echo "⚠️ Backend ainda não está escutando"
          EOF

      # ============================================
      # 2️⃣2️⃣5️⃣ VERIFICAR E INICIAR TRAEFIK (CRÍTICO)
      # ============================================
      - name: 🔄 Ensure Traefik is running
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF'
            echo "🔄 Verificando e iniciando Traefik (crítico para Cloudflare)..."
            
            cd /var/www/secured_guard
            
            # Verificar se Traefik está rodando
            if docker ps | grep -q "traefik"; then
              echo "✅ Traefik já está rodando"
              docker ps --filter "name=traefik" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              
              # Verificar e recarregar configuração dinâmica se existir
              if [ -f "/var/www/secured_guard/traefik/dynamic/ci.yml" ]; then
                echo "✅ Configuração dinâmica encontrada: /var/www/secured_guard/traefik/dynamic/ci.yml"
                
                # Reiniciar Traefik para garantir que a configuração seja carregada
                echo "🔄 Reiniciando Traefik para carregar configuração dinâmica..."
                docker restart traefik
                sleep 15
                
                # Verificar se Traefik reiniciou
                if docker ps | grep -q "traefik"; then
                  echo "✅ Traefik reiniciado com sucesso"
                else
                  echo "❌ Traefik não reiniciou!"
                  exit 1
                fi
                
                # Verificar se o router foi carregado
                echo "🔍 Verificando routers do Traefik..."
                ROUTERS=$(docker exec traefik wget -qO- http://localhost:8080/api/http/routers 2>/dev/null || echo "[]")
                if echo "$ROUTERS" | grep -q "ci-backend"; then
                  echo "✅ Router ci-backend encontrado no Traefik"
                else
                  echo "⚠️ Router ci-backend não encontrado no Traefik"
                  echo "📋 Routers disponíveis:"
                  echo "$ROUTERS" | jq -r '.[].name' 2>/dev/null || echo "$ROUTERS"
                fi
              else
                echo "⚠️ Configuração dinâmica não encontrada em /var/www/secured_guard/traefik/dynamic/ci.yml"
                echo "💡 Isso pode causar erro 404. Verifique se o arquivo foi transferido corretamente."
              fi
              
              # Garantir que Nginx está na rede z7network
              echo ""
              echo "🔗 Verificando se Nginx está na rede z7network..."
              if docker ps | grep -q "secured-guard-nginx-ci"; then
                if docker inspect secured-guard-nginx-ci 2>/dev/null | grep -q "z7network"; then
                  echo "✅ Nginx já está na rede z7network"
                else
                  echo "⚠️ Nginx não está na rede z7network. Conectando..."
                  docker network connect z7network secured-guard-nginx-ci 2>/dev/null || echo "⚠️ Pode já estar conectado"
                  sleep 2
                  if docker inspect secured-guard-nginx-ci 2>/dev/null | grep -q "z7network"; then
                    echo "✅ Nginx conectado à rede z7network"
                  else
                    echo "❌ Falha ao conectar Nginx à rede z7network"
                  fi
                fi
              else
                echo "⚠️ Nginx não está rodando"
              fi
            else
              echo "⚠️ Traefik não está rodando! Iniciando..."
              
              # Verificar se a rede z7network existe
              if ! docker network ls | grep -q "z7network"; then
                echo "📡 Criando rede z7network..."
                docker network create z7network
              fi
              
              # Verificar se os diretórios necessários existem
              mkdir -p /var/www/secured_guard/traefik/dynamic
              mkdir -p /var/www/secured_guard/traefik/letsencrypt
              mkdir -p /var/www/secured_guard/traefik/logs
              
              # Iniciar Traefik
              docker-compose -f docker-compose.traefik.yml up -d
              
              echo "⏳ Aguardando Traefik iniciar (15s)..."
              sleep 15
              
              # Verificar se iniciou
              if docker ps | grep -q "traefik"; then
                echo "✅ Traefik iniciado com sucesso!"
                docker ps --filter "name=traefik" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              else
                echo "❌ Traefik não iniciou! Verificando logs..."
                docker logs traefik --tail 50 2>&1 || echo "Container traefik não encontrado"
                exit 1
              fi
            fi
            
            # Verificar se Traefik está na rede z7network
            if docker inspect traefik 2>/dev/null | grep -q "z7network"; then
              echo "✅ Traefik está na rede z7network"
            else
              echo "⚠️ Traefik não está na rede z7network. Conectando..."
              docker network connect z7network traefik 2>&1 || echo "⚠️ Pode já estar conectado ou erro ao conectar"
            fi
            
            # Verificar se as portas 80 e 443 estão escutando
            echo ""
            echo "🔍 Verificando portas..."
            if netstat -tlnp 2>/dev/null | grep -q ":80 " || ss -tlnp 2>/dev/null | grep -q ":80 "; then
              echo "✅ Porta 80 está escutando"
            else
              echo "⚠️ Porta 80 não está escutando"
            fi
            
            if netstat -tlnp 2>/dev/null | grep -q ":443 " || ss -tlnp 2>/dev/null | grep -q ":443 "; then
              echo "✅ Porta 443 está escutando"
            else
              echo "⚠️ Porta 443 não está escutando"
            fi
            
            # Testar Traefik dashboard
            echo ""
            echo "🧪 Testando Traefik dashboard..."
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/overview | grep -q "200"; then
              echo "✅ Traefik dashboard está respondendo"
            else
              echo "⚠️ Traefik dashboard não está respondendo (pode ser normal se não estiver configurado)"
            fi
          EOF

      # ============================================
      # 2️⃣2️⃣5️⃣ CORRIGIR 404 NO TRAEFIK
      # ============================================
      - name: 🔧 Fix 404 Traefik
        run: |
          echo "🔧 Corrigindo problema de 404 no Traefik..."
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF'
            cd /var/www/secured_guard/ci
            
            # Verificar se script existe, se não, criar inline
            if [ -f "scripts/fix-404-traefik.sh" ]; then
              chmod +x scripts/fix-404-traefik.sh
              ./scripts/fix-404-traefik.sh
            else
              echo "⚠️ Script não encontrado, executando correção inline..."
              
              # 1. Verificar configuração dinâmica
              if [ ! -f "/var/www/secured_guard/traefik/dynamic/ci.yml" ]; then
                echo "❌ Arquivo de configuração dinâmica não encontrado!"
                echo "   Criando diretório..."
                mkdir -p /var/www/secured_guard/traefik/dynamic
                echo "   ⚠️ Arquivo ci.yml não existe. Verifique se foi transferido."
              else
                echo "✅ Arquivo de configuração dinâmica encontrado"
              fi
              
              # 2. Conectar Nginx à rede z7network
              if docker ps | grep -q "secured-guard-nginx-ci"; then
                if ! docker inspect secured-guard-nginx-ci 2>/dev/null | grep -q "z7network"; then
                  echo "🔗 Conectando Nginx à rede z7network..."
                  docker network connect z7network secured-guard-nginx-ci 2>/dev/null || echo "⚠️ Pode já estar conectado"
                  sleep 2
                else
                  echo "✅ Nginx já está na rede z7network"
                fi
              fi
              
              # 3. Reiniciar Traefik
              if docker ps | grep -q "traefik"; then
                echo "🔄 Reiniciando Traefik para carregar configuração dinâmica..."
                docker restart traefik
                sleep 15
                
                # Verificar se router foi carregado
                ROUTERS=$(docker exec traefik wget -qO- http://localhost:8080/api/http/routers 2>/dev/null || echo "[]")
                if echo "$ROUTERS" | grep -q "ci-backend"; then
                  echo "✅ Router ci-backend encontrado no Traefik"
                else
                  echo "❌ Router ci-backend NÃO encontrado no Traefik!"
                  echo "📋 Routers disponíveis:"
                  echo "$ROUTERS" | jq -r '.[].name' 2>/dev/null || echo "$ROUTERS"
                  echo ""
                  echo "📋 Verificando logs do Traefik:"
                  docker logs traefik --tail 30 | grep -i "error\|dynamic\|ci" || echo "Nenhum erro encontrado"
                fi
              fi
              
              # 4. Testar acesso
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: ci.z7botsolutions.com.br" http://localhost/api/health 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Acesso via Traefik funcionando! (HTTP $HTTP_CODE)"
              else
                echo "⚠️ Ainda retornando HTTP $HTTP_CODE"
              fi
            fi
          EOF

      # ============================================
      # 2️⃣3️⃣ HEALTH CHECK COM MAIS TEMPO E DIAGNÓSTICO
      # ============================================
      - name: 🏥 Health check
        env:
          SSH_USER: ${{ secrets.VPS_USER_CI }}
          SSH_HOST: ${{ secrets.VPS_HOST_CI }}
          SSH_PASSWORD: ${{ secrets.VPS_PASSWORD_CI }}
        run: |
          chmod +x scripts/health-check-ci.sh
          ./scripts/health-check-ci.sh

      # ============================================
      # 2️⃣4️⃣ TESTE DE LOGIN APÓS DEPLOY
      # ============================================
      - name: 🔐 Test login after deploy
        run: |
          echo "🔐 Testando login após deploy..."
          echo "⏳ Aguardando 30 segundos para aplicação estar totalmente pronta..."
          sleep 30
          
          # Tentar fazer login de teste (pode falhar se não houver usuário, mas verifica se o endpoint está funcionando)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://ci.z7botsolutions.com.br/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"test","password":"test"}' \
            --max-time 10 2>/dev/null || echo "000")
          
          echo "HTTP Code do login: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "✅ Endpoint de login está funcionando (retornou $HTTP_CODE - credenciais inválidas, mas endpoint OK)"
          elif [ "$HTTP_CODE" = "500" ]; then
            echo "❌ ERRO: Login retornou 500 (Internal Server Error)"
            echo "📋 Verificando logs do backend para erro de JWT..."
            sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} "docker logs --tail 50 secured-guard-backend-ci 2>&1 | grep -i 'jwt\|token\|secret' | tail -20 || echo 'Nenhum log JWT encontrado'"
            exit 1
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "⚠️ Timeout ao testar login (aplicação pode ainda estar iniciando)"
          else
            echo "ℹ️ Login retornou código $HTTP_CODE"
          fi

      # ============================================
      # 2️⃣5️⃣ NOTIFICAÇÃO DE SUCESSO
      # ============================================
      - name: 🎉 Deployment successful
        if: success()
        run: |
          echo "🎉 ================================"
          echo "✅ DEPLOY CI CONCLUÍDO COM SUCESSO!"
          echo "🐳 Método: Docker Compose"
          echo "🌐 URL: https://ci.z7botsolutions.com.br"
          echo "📅 Data: $(date +'%Y-%m-%d %H:%M:%S')"
          echo "🔖 Commit: ${{ github.sha }}"
          echo "🌿 Branch: ci"
          echo "================================"

      # ============================================
      # 2️⃣6️⃣ ROLLBACK EM CASO DE FALHA
      # ============================================
      - name: 🔄 Rollback on failure
        if: failure()
        run: |
          echo "❌ Deploy falhou! Iniciando rollback..."
          
          # Não deixar erros de rollback derrubarem o job inteiro
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'EOF' || true
            # Carregar PATH do Docker (necessário em sessões SSH não-interativas)
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            
            cd /var/www/secured_guard/ci || exit 0
            
            # Parar containers atuais (ignorando erros)
            if command -v docker &> /dev/null && docker compose version &> /dev/null; then
              docker compose -f docker-compose.ci.yml down --remove-orphans 2>/dev/null || true
            else
              docker-compose -f docker-compose.ci.yml down --remove-orphans 2>/dev/null || true
            fi
            
            # Restaurar backup se existir
            LATEST_BACKUP=$(ls -t /var/www/secured_guard/ci/backups/ 2>/dev/null | head -1)
            
            if [ -n "$LATEST_BACKUP" ]; then
              echo "🔄 Restaurando backup: $LATEST_BACKUP"
              
              # Restaurar dados do banco (ignorando erros caso diretórios não existam)
              rm -rf postgres_data 2>/dev/null || true
              cp -r "/var/www/secured_guard/ci/backups/$LATEST_BACKUP/postgres_data" ./ 2>/dev/null || true
              
              # Iniciar containers com versão anterior
              if command -v docker &> /dev/null && docker compose version &> /dev/null; then
                docker compose -f docker-compose.ci.yml up -d --remove-orphans 2>/dev/null || true
              else
                docker-compose -f docker-compose.ci.yml up -d --remove-orphans 2>/dev/null || true
              fi
              
              echo "✅ Rollback concluído!"
            else
              echo "⚠️ Nenhum backup encontrado para rollback"
            fi
          EOF
