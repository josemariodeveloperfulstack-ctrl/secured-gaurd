name: 🐳 Deploy PROD Environment (Docker Compose)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

env:
  ENVIRONMENT: prod
  DEPLOY_PATH: /var/www/secured_guard/prod
  APP_URL: https://securedguard.z7botsolutions.com.br

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy to PROD (Docker)
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🔨 Build Backend (Maven)
        working-directory: ./backend
        run: |
          chmod +x mvnw || true
          ./mvnw clean package -Dmaven.test.skip=true -Dspring.profiles.active=prod -DskipTests=true

      - name: 🎨 Build Frontend (Vite)
        working-directory: ./frontend
        env:
          VITE_API_URL: /api
          VITE_ENVIRONMENT: prod
        run: |
          npm ci
          npm run build

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build and Push Docker images
        run: |
          # Build Backend
          docker build --no-cache \
            -t z7design/secured-guard-backend:prod \
            -f backend/Dockerfile.prod ./backend
          
          # Build Frontend
          docker build --no-cache \
            -t z7design/secured-guard-frontend:prod \
            --build-arg VITE_API_URL=/api \
            --build-arg VITE_WS_URL=/ws \
            --build-arg VITE_ENVIRONMENT=prod \
            -f frontend/Dockerfile.prod ./frontend
          
          # Build WhatsApp Service
          docker build --no-cache \
            -t z7design/secured-guard-whatsapp:prod \
            -f whatsapp-service/Dockerfile ./whatsapp-service

          # Push Images
          docker push z7design/secured-guard-backend:prod
          docker push z7design/secured-guard-frontend:prod
          docker push z7design/secured-guard-whatsapp:prod

      - name: 🔑 Install sshpass and configure SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: 🚀 Execute Deployment (Single SSH Session)
        env:
          MAIL_PASS: ${{ secrets.MAIL_PASSWORD }}
        run: |
          # Create .env locally using printf for robustness
          {
            printf "POSTGRES_PASSWORD_PROD=%s\n" "${{ secrets.POSTGRES_PASSWORD_PROD }}"
            printf "REDIS_PASSWORD_PROD=%s\n" "${{ secrets.REDIS_PASSWORD_PROD }}"
            printf "JWT_SECRET_PROD=%s\n" "${{ secrets.JWT_SECRET_PROD }}"
            printf "MAIL_HOST=%s\n" "${{ secrets.MAIL_HOST }}"
            printf "MAIL_PORT=%s\n" "${{ secrets.MAIL_PORT }}"
            printf "MAIL_USERNAME=%s\n" "${{ secrets.MAIL_USERNAME }}"
            printf "MAIL_PASSWORD=%s\n" "$MAIL_PASS"
          } > .prod.env

          # Create deployment archive locally including the health check script
          chmod +x scripts/health-check-prod.sh scripts/fix-404-prod.sh scripts/diagnostico-502-prod.sh
          tar -czf prod-deploy.tar.gz .prod.env deploy/docker-compose.prod.yml deploy/nginx/nginx-prod.conf scripts/fix-404-prod.sh scripts/health-check-prod.sh scripts/diagnostico-502-prod.sh traefik-dynamic-prod.yml

          # Encode archive in base64 to safely pass it into the heredoc
          B64_TAR=$(base64 -w 0 prod-deploy.tar.gz)

          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -o ConnectTimeout=30 -o IPQoS=none -o TCPKeepAlive=yes"
          VPS_STR="${{ secrets.VPS_USER_PROD }}@${{ secrets.VPS_HOST_PROD }}"
          
          echo "🚀 Initiating single SSH session for full deployment..."
          SUCCESS=0
          
          for i in 1 2 3 4 5; do
            echo "======================================"
            echo "🔁 Tentativa $i de 5 de conexão SSH..."
            echo "======================================"
            
            set +e
            sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" ssh $SSH_OPTS $VPS_STR << EOF
            set -e
            
            export DEPLOY_DIR="/var/www/secured_guard/prod/deploy"
            export TRAEFIK_DIR="/var/www/secured_guard/traefik/dynamic"
            export SCRIPT_DIR="/var/www/secured_guard/prod/scripts"
            
            echo "📦 Extracting deployment files..."
            mkdir -p \$DEPLOY_DIR/nginx \$TRAEFIK_DIR \$SCRIPT_DIR
            echo "$B64_TAR" | base64 -d > /tmp/prod-deploy.tar.gz
            tar -xzf /tmp/prod-deploy.tar.gz -C /tmp
            
            mv /tmp/.prod.env \$DEPLOY_DIR/.env
            mv /tmp/deploy/docker-compose.prod.yml \$DEPLOY_DIR/
            mv /tmp/deploy/nginx/nginx-prod.conf \$DEPLOY_DIR/nginx/
            mv /tmp/scripts/fix-404-prod.sh \$DEPLOY_DIR/
            mv /tmp/scripts/health-check-prod.sh \$SCRIPT_DIR/
            mv /tmp/scripts/diagnostico-502-prod.sh \$SCRIPT_DIR/
            mv /tmp/traefik-dynamic-prod.yml \$TRAEFIK_DIR/prod.yml
            
            rm -rf /tmp/prod-deploy.tar.gz /tmp/deploy /tmp/scripts
            
            cd \$DEPLOY_DIR
            
            echo "🔐 Login Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Ensure networks exist
            if ! docker network ls | grep -q "secured-guard"; then docker network create secured-guard; fi
            if ! docker network ls | grep -q "z7network"; then docker network create z7network; fi
            
            echo "📥 Pull das imagens..."
            docker-compose -f docker-compose.prod.yml pull
            
            echo "🚀 Subindo containers..."
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "⏳ Aguardando 15s para Postgres ficar healthy..."
            sleep 15
            
            echo "🔧 Corrigindo 404 externo..."
            if [ -f fix-404-prod.sh ]; then bash fix-404-prod.sh; fi
            
            echo "🔄 Reiniciando Traefik (ignora se falhar)..."
            docker restart traefik 2>/dev/null || true
            sleep 15
            
            echo "🔧 Flyway repair PROD..."
            docker exec -i secured-guard-db-prod psql -U postgres -d secured_guard_prod -c "
              UPDATE flyway_schema_history SET checksum = 318441356 WHERE version = '424';
              UPDATE flyway_schema_history SET checksum = -1437677079 WHERE version = '427';
              UPDATE flyway_schema_history SET checksum = -1673547286 WHERE version = '429';
            " 2>/dev/null || true
            
            echo "🔄 Reiniciando backend para aplicar migrações..."
            docker restart secured-guard-backend-prod
            sleep 5
            
            BACKEND_STATE=\$(docker inspect secured-guard-backend-prod --format '{{.State.Status}}' 2>/dev/null || echo "missing")
            if [ "\$BACKEND_STATE" = "exited" ] || [ "\$BACKEND_STATE" = "dead" ]; then
              echo "❌ Backend em estado: \$BACKEND_STATE"
              docker logs --tail=80 secured-guard-backend-prod 2>&1
              exit 1
            fi
            echo "✅ Backend container presente e estado: \$BACKEND_STATE"
            
            echo "🏥 Iniciando script de Health Check internamente..."
            cd \$SCRIPT_DIR
            ./health-check-prod.sh
          EOF
            SSH_EXIT_CODE=$?
            set -e
            
            if [ $SSH_EXIT_CODE -eq 0 ]; then
              echo "✅ Deployment concluído com sucesso!"
              SUCCESS=1
              break
            else
              echo "⚠️ Erro na execução SSH (Código: $SSH_EXIT_CODE). Aguardando 15s para tentar novamente..."
              sleep 15
            fi
          done
          
          if [ $SUCCESS -eq 0 ]; then
            echo "❌ Falha crítica: O Deploy não pôde ser concluído após 5 tentativas de conexão SSH."
            exit 1
          fi

      - name: 🎉 Deployment Successful
        if: success()
        run: echo "✅ PROD Deployment completed successfully!"
