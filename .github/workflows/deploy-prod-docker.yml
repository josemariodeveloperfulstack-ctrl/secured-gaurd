name: 🐳 Deploy PROD Environment (Docker Compose)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

env:
  ENVIRONMENT: prod
  DEPLOY_PATH: /var/www/secured_guard/prod
  APP_URL: https://securedguard.z7botsolutions.com.br

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy to PROD (Docker)
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🔨 Build Backend (Maven)
        working-directory: ./backend
        run: |
          chmod +x mvnw || true
          ./mvnw clean package -Dmaven.test.skip=true -Dspring.profiles.active=prod -DskipTests=true

      - name: 🎨 Build Frontend (Vite)
        working-directory: ./frontend
        env:
          VITE_API_URL: https://securedguard.z7botsolutions.com.br/api
          VITE_ENVIRONMENT: prod
        run: |
          npm ci
          npm run build

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build and Push Docker images
        run: |
          # Build Backend
          docker build --no-cache \
            -t z7design/secured-guard-backend:prod \
            -f backend/Dockerfile.prod ./backend
          
          # Build Frontend
          docker build --no-cache \
            -t z7design/secured-guard-frontend:prod \
            --build-arg VITE_API_URL=https://securedguard.z7botsolutions.com.br/api \
            --build-arg VITE_WS_URL=wss://securedguard.z7botsolutions.com.br/ws \
            --build-arg VITE_ENVIRONMENT=prod \
            -f frontend/Dockerfile.prod ./frontend
          
          # Build WhatsApp Service
          docker build --no-cache \
            -t z7design/secured-guard-whatsapp:prod \
            -f whatsapp-service/Dockerfile ./whatsapp-service

          # Push Images
          docker push z7design/secured-guard-backend:prod
          docker push z7design/secured-guard-frontend:prod
          docker push z7design/secured-guard-whatsapp:prod

      - name: 🔑 Install sshpass and configure SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: ⚙️ Create .env file and Transfer structures
        env:
          MAIL_PASS: ${{ secrets.MAIL_PASSWORD }}
        run: |
          # Create .env locally using printf for robustness
          {
            printf "POSTGRES_PASSWORD_PROD=%s\n" "${{ secrets.POSTGRES_PASSWORD_PROD }}"
            printf "REDIS_PASSWORD_PROD=%s\n" "${{ secrets.REDIS_PASSWORD_PROD }}"
            printf "JWT_SECRET_PROD=%s\n" "${{ secrets.JWT_SECRET_PROD }}"
            printf "MAIL_HOST=%s\n" "${{ secrets.MAIL_HOST }}"
            printf "MAIL_PORT=%s\n" "${{ secrets.MAIL_PORT }}"
            printf "MAIL_USERNAME=%s\n" "${{ secrets.MAIL_USERNAME }}"
            printf "MAIL_PASSWORD=%s\n" "$MAIL_PASS"
          } > .prod.env

          SSH_OPTS="-o StrictHostKeyChecking=no"
          VPS_STR="${{ secrets.VPS_USER_PROD }}@${{ secrets.VPS_HOST_PROD }}"
          
          # Ensure target directory
          sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" ssh $SSH_OPTS $VPS_STR "mkdir -p $DEPLOY_PATH/deploy/nginx"
          
          # Transfer .env
          sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" scp $SSH_OPTS .prod.env $VPS_STR:$DEPLOY_PATH/deploy/.env
          
          # Transfer docker-compose, nginx config e scripts de diagnóstico/correção 404
          sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" scp $SSH_OPTS deploy/docker-compose.prod.yml $VPS_STR:$DEPLOY_PATH/deploy/
          sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" scp $SSH_OPTS deploy/nginx/nginx-prod.conf $VPS_STR:$DEPLOY_PATH/deploy/nginx/
          if [ -f deploy/fix-404-prod.sh ]; then sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" scp $SSH_OPTS deploy/fix-404-prod.sh $VPS_STR:$DEPLOY_PATH/deploy/; fi
          if [ -f deploy/diagnose-404-prod.sh ]; then sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" scp $SSH_OPTS deploy/diagnose-404-prod.sh $VPS_STR:$DEPLOY_PATH/deploy/; fi

      - name: 🚀 Pull and Restart on VPS
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no"
          VPS_STR="${{ secrets.VPS_USER_PROD }}@${{ secrets.VPS_HOST_PROD }}"
          
          sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" ssh $SSH_OPTS $VPS_STR << 'ENDSSH'
            set -e
            cd /var/www/secured_guard/prod/deploy
            
            echo "🔐 Login Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Ensure networks exist (Traefik usa z7network para descobrir o nginx)
            if ! docker network ls | grep -q "secured-guard"; then
              docker network create secured-guard
            fi
            if ! docker network ls | grep -q "z7network"; then
              docker network create z7network
            fi
            
            echo "📥 Pull das imagens..."
            docker-compose -f docker-compose.prod.yml pull
            
            echo "🚀 Subindo containers..."
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "📋 Status dos containers:"
            docker-compose -f docker-compose.prod.yml ps -a
            
            echo "⏳ Aguardando 15s para Postgres ficar healthy..."
            sleep 15
            
            echo "🔧 Flyway repair PROD (checksums V424, V427, V429)..."
            docker exec -i secured-guard-db-prod psql -U postgres -d secured_guard_prod -c "
              UPDATE flyway_schema_history SET checksum = 318441356 WHERE version = '424';
              UPDATE flyway_schema_history SET checksum = -1437677079 WHERE version = '427';
              UPDATE flyway_schema_history SET checksum = -1673547286 WHERE version = '429';
            "
            
            echo "🔄 Reiniciando backend para aplicar migrações..."
            docker restart secured-guard-backend-prod
            
            sleep 5
            if ! docker ps -a --format '{{.Names}}' | grep -qx 'secured-guard-backend-prod'; then
              echo "❌ Container secured-guard-backend-prod não existe após up!"
              docker ps -a --format 'table {{.Names}}\t{{.Status}}'
              docker-compose -f docker-compose.prod.yml logs --tail=50 backend 2>&1 || true
              exit 1
            fi
            BACKEND_STATE=$(docker inspect secured-guard-backend-prod --format '{{.State.Status}}' 2>/dev/null || echo "missing")
            if [ "$BACKEND_STATE" = "exited" ] || [ "$BACKEND_STATE" = "dead" ]; then
              echo "❌ Backend em estado: $BACKEND_STATE"
              docker logs --tail=80 secured-guard-backend-prod 2>&1
              exit 1
            fi
            echo "✅ Backend container presente e estado: $BACKEND_STATE"
          ENDSSH

      - name: 🏥 Health Check
        env:
          SSH_USER: ${{ secrets.VPS_USER_PROD }}
          SSH_HOST: ${{ secrets.VPS_HOST_PROD }}
          SSH_PASSWORD: ${{ secrets.VPS_PASSWORD_PROD }}
        run: |
          chmod +x scripts/health-check-prod.sh
          ./scripts/health-check-prod.sh

      - name: 🎉 Deployment Successful
        if: success()
        run: echo "✅ PROD Deployment completed successfully!"
