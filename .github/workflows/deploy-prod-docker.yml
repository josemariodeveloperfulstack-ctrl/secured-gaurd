name: 🌟 Deploy PROD Environment (Docker Compose)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

env:
  ENVIRONMENT: prod
  DEPLOY_PATH: /var/www/secured_guard/prod
  APP_URL: https://securedguard.z7botsolutions.com.br

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy to PROD (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: prod

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🔨 Build Backend (Maven)
        working-directory: ./backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -Dmaven.test.skip=true -Dspring.profiles.active=prod
          ls -lh target/*.jar

      - name: 🎨 Build Frontend (Vite)
        working-directory: ./frontend
        env:
          VITE_API_URL: https://securedguard.z7botsolutions.com.br/api
          VITE_ENVIRONMENT: prod
        run: |
          npm ci
          npm run build
          ls -lh dist/

      - name: 🐳 Build Docker images
        run: |
          docker build -t z7design/secured-guard-backend:prod \
            -f backend/Dockerfile.prod ./backend

          docker build -t z7design/secured-guard-frontend:prod \
            -f frontend/Dockerfile.prod ./frontend

          docker build -t z7design/secured-guard-whatsapp:prod \
            -f whatsapp-service/Dockerfile ./whatsapp-service

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📤 Push images to Docker Hub
        run: |
          docker push z7design/secured-guard-backend:prod
          docker push z7design/secured-guard-frontend:prod
          docker push z7design/secured-guard-whatsapp:prod

      - name: 🔑 Install sshpass and configure SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: ⚙️ Create/Update .env on PROD VPS
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" ssh ${{ secrets.VPS_USER_PROD }}@${{ secrets.VPS_HOST_PROD }} << 'EOF'
            mkdir -p /var/www/secured_guard/prod
            cd /var/www/secured_guard/prod
            cat > .env << 'ENVEOF'
POSTGRES_PASSWORD_PROD=${{ secrets.POSTGRES_PASSWORD_PROD }}
REDIS_PASSWORD_PROD=${{ secrets.REDIS_PASSWORD_PROD }}
JWT_SECRET_PROD=${{ secrets.JWT_SECRET_PROD }}
ENVEOF
          EOF

      - name: 📤 Transfer files to PROD VPS
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" ssh ${{ secrets.VPS_USER_PROD }}@${{ secrets.VPS_HOST_PROD }} << 'EOF'
            mkdir -p /var/www/secured_guard/prod/nginx
          EOF

          sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" scp deploy/docker-compose.prod.yml \
            ${{ secrets.VPS_USER_PROD }}@${{ secrets.VPS_HOST_PROD }}:/var/www/secured_guard/prod/docker-compose.prod.yml

          sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" scp deploy/nginx/nginx-prod.conf \
            ${{ secrets.VPS_USER_PROD }}@${{ secrets.VPS_HOST_PROD }}:/var/www/secured_guard/prod/nginx/nginx-prod.conf

      - name: 🚀 Start PROD containers
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" ssh ${{ secrets.VPS_USER_PROD }}@${{ secrets.VPS_HOST_PROD }} << 'EOF'
            cd /var/www/secured_guard/prod

            if ! docker network ls | grep -q "secured-guard"; then
              docker network create secured-guard
            fi

            docker-compose -f docker-compose.prod.yml pull || true
            docker-compose -f docker-compose.prod.yml up -d
          EOF

      - name: 🏥 Health check PROD
        run: |
          echo "⏳ Aguardando aplicação iniciar (60s)..."
          sleep 60

          for i in {1..15}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://securedguard.z7botsolutions.com.br/api/health || echo 000)
            echo "Tentativa $i - HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ PROD OK"
              exit 0
            fi
            sleep 10
          done

          echo "❌ Health check PROD falhou"
          exit 1
