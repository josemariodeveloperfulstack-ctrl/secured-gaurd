          POSTGRES_OUTPUT=$(sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o LogLevel=ERROR ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "POSTGRES_ID=\$(docker ps -a 2>&1 | grep postgres | grep secured-guard | grep -v CONTAINER | awk '{print \$1}' | head -1); if [ -n \"\$POSTGRES_ID\" ]; then echo 'Container ID: '\$POSTGRES_ID; docker logs \$POSTGRES_ID 2>&1 | tail -30; else echo '⚠️ Container PostgreSQL não encontrado'; docker ps -a 2>&1 | grep postgres || echo 'Nenhum container PostgreSQL no sistema'; fi" 2>&1 || echo "Erro ao executar comando SSH")
          echo "$POSTGRES_OUTPUT"
