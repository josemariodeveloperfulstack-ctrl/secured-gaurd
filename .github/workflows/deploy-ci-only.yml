          echo "$PORTS_OUTPUT"
          echo ""
          
          echo "📋 Testando conectividade final..."
          CONNECTIVITY_FULL=$(sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o LogLevel=ERROR ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'Testando porta 8081...' && (curl -v http://localhost:8081/api/health 2>&1 | head -20 || echo 'Backend não responde'); echo ''; echo 'Testando porta 80 (nginx)...' && (curl -v http://localhost:80/api/health 2>&1 | head -20 || echo 'Nginx não responde')" 2>&1 || echo "Erro ao executar comando SSH")
          echo "$CONNECTIVITY_FULL"
          echo ""
          
          echo "✅ Diagnóstico final concluído"
          echo "========================================="

      # ============================================
      # 2️⃣0️⃣ NOTIFICAÇÃO DE SUCESSO
