name: 🐳 Deploy CI Environment Only

on:
  # DESABILITADO: Usando deploy-ci-docker.yml em vez deste
  # push:
  #   branches:
  #     - ci
  workflow_dispatch:

env:
  ENVIRONMENT: ci
  APP_URL: https://ci.z7botsolutions.com.br

jobs:
  deploy-ci:
    name: 🚀 Deploy CI Environment
    runs-on: ubuntu-latest
    
    steps:
      # ============================================
      # 1️⃣ CHECKOUT DO CÓDIGO
      # ============================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ci

      # ============================================
      # 2️⃣ SETUP JAVA 17
      # ============================================
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      # ============================================
      # 3️⃣ SETUP NODE.JS 20
      # ============================================
      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ============================================
      # 4️⃣ BUILD BACKEND
      # ============================================
      - name: 🔨 Build Backend
        working-directory: ./backend
        run: |
          echo "🔨 Compilando backend para CI..."
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests -Dspring.profiles.active=ci
          echo "✅ Backend compilado!"

      # ============================================
      # 5️⃣ BUILD FRONTEND
      # ============================================
      - name: 🎨 Build Frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: https://ci.z7botsolutions.com.br/api
          VITE_ENVIRONMENT: ci
          # Pular instalação do Cypress binário no CI (não necessário para build)
          CYPRESS_INSTALL_BINARY: 0
        run: |
          echo "🎨 Compilando frontend para CI..."
          npm ci
          npm run build
          echo "✅ Frontend compilado!"

      # ============================================
      # 6️⃣ BUILD DOCKER IMAGES
      # ============================================
      - name: 🐳 Build Docker images
        run: |
          echo "🐳 Construindo imagens Docker..."
          docker build -t z7design/secured-guard-backend:ci -f backend/Dockerfile.prod ./backend
          docker build -t z7design/secured-guard-frontend:ci \
            --build-arg VITE_API_URL=https://ci.z7botsolutions.com.br/api \
            --build-arg VITE_WS_URL=wss://ci.z7botsolutions.com.br/ws \
            --build-arg VITE_ENVIRONMENT=ci \
            -f frontend/Dockerfile.prod ./frontend
          docker build -t z7design/secured-guard-whatsapp:ci -f whatsapp-service/Dockerfile ./whatsapp-service
          echo "✅ Imagens construídas!"

      # ============================================
      # 7️⃣ LOGIN E PUSH DOCKER HUB
      # ============================================
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📤 Push images
        run: |
          echo "📤 Enviando imagens..."
          docker push z7design/secured-guard-backend:ci
          docker push z7design/secured-guard-frontend:ci
          docker push z7design/secured-guard-whatsapp:ci
          echo "✅ Imagens enviadas!"

      # ============================================
      # 8️⃣ INSTALAR SSH PASS E CONFIGURAR SSH
      # ============================================
      - name: 🔑 Install sshpass and configure SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          echo "✅ SSH configurado para usar senha"

      # ============================================
      # 9️⃣ TRANSFERIR ARQUIVOS PARA VPS
      # ============================================
      - name: 📤 Transfer files to VPS
        run: |
          echo "📤 Transferindo arquivos para VPS..."
          
          # Criar estrutura de diretórios
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            mkdir -p /var/www/secured_guard/ci
            mkdir -p /var/www/secured_guard/ci/nginx
            mkdir -p /var/www/secured_guard/ci/uploads
            mkdir -p /var/www/secured_guard/ci/logs
            mkdir -p /var/www/secured_guard/ci/postgres_data
            mkdir -p /var/www/secured_guard/ci/redis_data
            mkdir -p /var/www/secured_guard/ci/whatsapp_sessions
            mkdir -p /var/www/secured_guard/traefik/dynamic
          EOF
          
          # Transferir docker-compose.ci.yml
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp docker-compose.ci.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured_guard/ci/
          
          # Transferir configuração do Nginx
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp nginx/ci.conf ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured_guard/ci/nginx/
          
          # Transferir configuração dinâmica do Traefik
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp traefik-dynamic-ci.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured_guard/traefik/dynamic/ci.yml
          
          # Transferir docker-compose.traefik.yml atualizado
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp docker-compose.traefik.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured_guard/
          
          echo "✅ Arquivos transferidos!"

      # ============================================
      # 🔟 CRIAR ARQUIVO .ENV NA VPS
      # ============================================
      - name: ⚙️ Create .env file
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "⚙️ Criando arquivo .env..."
            
            cat > /var/www/secured_guard/ci/.env << 'ENVEOF'
          # ===== AMBIENTE CI =====
          ENVIRONMENT=ci
          APP_URL=https://ci.z7botsolutions.com.br
          
          # ===== BANCO DE DADOS =====
          POSTGRES_PASSWORD_CI=${{ secrets.POSTGRES_PASSWORD_CI }}
          
          # ===== REDIS =====
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          
          # ===== JWT =====
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENVEOF
            
            chmod 600 /var/www/secured_guard/ci/.env
            echo "✅ Arquivo .env criado!"
          EOF

      # ============================================
      # 1️⃣1️⃣ FAZER BACKUP E PARAR CONTAINERS ANTIGOS
      # ============================================
      - name: 💾 Backup and stop old containers
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "💾 Fazendo backup e parando containers antigos..."
            
            cd /var/www/secured_guard/ci
            
            # Fazer backup dos volumes se existirem
            if [ -d "postgres_ci_data" ]; then
              BACKUP_DIR="/var/www/secured_guard/ci/backups/$(date +'%Y%m%d_%H%M%S')"
              mkdir -p "$BACKUP_DIR"
              cp -r postgres_ci_data "$BACKUP_DIR/" 2>/dev/null || true
              echo "✅ Backup criado em: $BACKUP_DIR"
            fi
            
            # Parar apenas containers que não são essenciais (preservar PostgreSQL e Redis se rodando)
            echo "🔄 Parando containers antigos (preservando PostgreSQL e Redis)..."
            docker-compose -f docker-compose.ci.yml stop backend-ci frontend-ci nginx-ci whatsapp-service-ci evolution-api-ci 2>&1 || true
            docker-compose -f docker-compose.ci.yml rm -f backend-ci frontend-ci nginx-ci whatsapp-service-ci evolution-api-ci 2>&1 || true
            # Limpar containers órfãos
            docker ps -a | grep "secured-guard" | grep -v "postgres\|redis" | awk '{print $1}' | xargs -r docker rm -f 2>&1 || true
            echo "✅ Containers antigos parados (PostgreSQL e Redis preservados)!"
          EOF

      # ============================================
      # 1️⃣2️⃣ REINICIAR TRAEFIK COM NOVA CONFIGURAÇÃO
      # ============================================
      - name: 🔄 Restart Traefik
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🔄 Reiniciando Traefik com nova configuração..."
            
            cd /var/www/secured_guard
            
            # Verificar se a rede z7network existe
            if ! docker network ls | grep -q "z7network"; then
              echo "⚠️  Rede z7network não existe. Criando..."
              docker network create z7network
            fi
            
            # Verificar se o diretório de configuração dinâmica existe
            mkdir -p /var/www/secured_guard/traefik/dynamic
            mkdir -p /var/www/secured_guard/traefik/letsencrypt
            mkdir -p /var/www/secured_guard/traefik/logs
            
            # Reiniciar Traefik para carregar configuração dinâmica
            docker-compose -f docker-compose.traefik.yml down
            docker-compose -f docker-compose.traefik.yml up -d
            
            echo "⏳ Aguardando Traefik iniciar (15s)..."
            sleep 15
            
            # Verificar se Traefik está rodando
            if docker ps | grep -q "traefik"; then
              echo "✅ Traefik está rodando"
            else
              echo "❌ Traefik não iniciou! Verificando logs..."
              docker logs traefik --tail 50
              exit 1
            fi
            
            # Verificar se o Traefik está na rede z7network
            if docker inspect traefik | grep -q "z7network"; then
              echo "✅ Traefik está na rede z7network"
            else
              echo "⚠️  Traefik não está na rede z7network. Reconectando..."
              docker network connect z7network traefik || echo "⚠️  Falha ao conectar (pode já estar conectado)"
            fi
            
            # Verificar se o Traefik está respondendo
            echo "🧪 Testando se o Traefik está respondendo..."
            MAX_RETRIES=10
            RETRY=0
            while [ $RETRY -lt $MAX_RETRIES ]; do
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/overview | grep -q "200"; then
                echo "✅ Traefik está respondendo"
                break
              fi
              RETRY=$((RETRY + 1))
              echo "⏳ Tentativa $RETRY/$MAX_RETRIES..."
              sleep 2
            done
            
            if [ $RETRY -eq $MAX_RETRIES ]; then
              echo "❌ Traefik não está respondendo após $MAX_RETRIES tentativas!"
              docker logs traefik --tail 50
              exit 1
            fi
            
            echo "✅ Traefik reiniciado e funcionando!"
          EOF

      # ============================================
      # 1️⃣3️⃣ FAZER PULL DAS NOVAS IMAGENS
      # ============================================
      - name: 📥 Pull new images
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "📥 Fazendo pull das novas imagens..."
            
            cd /var/www/secured_guard/ci
            
            # Login no Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Pull das imagens
            docker pull z7design/secured-guard-backend:ci
            docker pull z7design/secured-guard-frontend:ci
            docker pull z7design/secured-guard-whatsapp:ci
            
            echo "✅ Imagens atualizadas!"
          EOF

      # ============================================
      # 1️⃣4️⃣ INICIAR CONTAINERS CI
      # ============================================
      - name: 🚀 Start CI containers
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🚀 Iniciando containers CI..."
            
            cd /var/www/secured_guard/ci
            
            # Criar diretórios de dados se não existirem
            mkdir -p /var/www/secured_guard/ci/postgres_data
            mkdir -p /var/www/secured_guard/ci/redis_data
            chmod 755 /var/www/secured_guard/ci/postgres_data
            chmod 755 /var/www/secured_guard/ci/redis_data
            
            # Iniciar primeiro PostgreSQL e Redis
            echo "🔄 Iniciando PostgreSQL e Redis..."
            docker-compose -f docker-compose.ci.yml up -d postgres-ci redis-ci
            
            # Aguardar PostgreSQL ficar saudável
            echo "⏳ Aguardando PostgreSQL iniciar..."
            MAX_RETRIES=30
            RETRY=0
            while [ $RETRY -lt $MAX_RETRIES ]; do
              if docker-compose -f docker-compose.ci.yml ps postgres-ci | grep -q "Up"; then
                echo "✅ PostgreSQL está rodando"
                break
              fi
              RETRY=$((RETRY + 1))
              sleep 2
            done
            
            if [ $RETRY -eq $MAX_RETRIES ]; then
              echo "❌ PostgreSQL não iniciou! Verificando logs..."
              docker logs --tail 50 secured-guard-db-ci 2>&1 || echo "Container não encontrado"
            fi
            
            # Aguardar Redis ficar saudável
            echo "⏳ Aguardando Redis iniciar..."
            RETRY=0
            while [ $RETRY -lt $MAX_RETRIES ]; do
              if docker-compose -f docker-compose.ci.yml ps redis-ci | grep -q "Up"; then
                echo "✅ Redis está rodando"
                break
              fi
              RETRY=$((RETRY + 1))
              sleep 2
            done
            
            if [ $RETRY -eq $MAX_RETRIES ]; then
              echo "❌ Redis não iniciou! Verificando logs..."
              docker logs --tail 50 secured-guard-redis-ci 2>&1 || echo "Container não encontrado"
            fi
            
            # Verificar se PostgreSQL e Redis estão realmente rodando
            if ! docker-compose -f docker-compose.ci.yml ps postgres-ci | grep -q "Up"; then
              echo "❌ PostgreSQL não está rodando! Verificando logs..."
              docker logs secured-guard-db-ci 2>&1 | tail -50 || echo "Container não existe"
              echo ""
              echo "🔄 Tentando remover e recriar PostgreSQL..."
              docker-compose -f docker-compose.ci.yml rm -f postgres-ci 2>&1 || true
              docker rm -f secured-guard-db-ci 2>&1 || true
              # Limpar containers órfãos com prefixo
              docker ps -a | grep "secured-guard-db-ci" | awk '{print $1}' | xargs -r docker rm -f 2>&1 || true
              echo "🔄 Recriando PostgreSQL..."
              docker-compose -f docker-compose.ci.yml up -d postgres-ci
              sleep 15
              docker logs secured-guard-db-ci 2>&1 | tail -50 || echo "Container ainda não existe"
            fi
            
            if ! docker-compose -f docker-compose.ci.yml ps redis-ci | grep -q "Up"; then
              echo "❌ Redis não está rodando! Verificando logs..."
              docker logs secured-guard-redis-ci 2>&1 | tail -50 || echo "Container não existe"
              echo ""
              echo "🔄 Tentando remover e recriar Redis..."
              docker-compose -f docker-compose.ci.yml rm -f redis-ci 2>&1 || true
              docker rm -f secured-guard-redis-ci 2>&1 || true
              # Limpar containers órfãos com prefixo
              docker ps -a | grep "secured-guard-redis-ci" | awk '{print $1}' | xargs -r docker rm -f 2>&1 || true
              echo "🔄 Recriando Redis..."
              docker-compose -f docker-compose.ci.yml up -d redis-ci
              sleep 15
              docker logs secured-guard-redis-ci 2>&1 | tail -50 || echo "Container ainda não existe"
            fi
            
            # Verificar novamente se estão rodando antes de continuar
            if ! docker-compose -f docker-compose.ci.yml ps postgres-ci | grep -q "Up"; then
              echo "❌❌❌ PostgreSQL ainda não está rodando após tentativa de recriar!"
              echo "📋 Verificando portas em uso..."
              netstat -tlnp | grep :5432 || ss -tlnp | grep :5432 || echo "Comando netstat/ss não disponível"
              echo "📋 Verificando volumes..."
              ls -la /var/www/secured_guard/ci/postgres_data/ | head -10 || echo "Diretório não existe ou sem permissão"
              exit 1
            fi
            
            if ! docker-compose -f docker-compose.ci.yml ps redis-ci | grep -q "Up"; then
              echo "❌❌❌ Redis ainda não está rodando após tentativa de recriar!"
              echo "📋 Verificando portas em uso..."
              netstat -tlnp | grep :6379 || ss -tlnp | grep :6379 || echo "Comando netstat/ss não disponível"
              echo "📋 Verificando volumes..."
              ls -la /var/www/secured_guard/ci/redis_data/ | head -10 || echo "Diretório não existe ou sem permissão"
              exit 1
            fi
            
            # Agora iniciar os outros containers (sem force-recreate para não parar os que já estão rodando)
            echo "🔄 Iniciando outros containers..."
            docker-compose -f docker-compose.ci.yml up -d backend-ci frontend-ci nginx-ci whatsapp-service-ci evolution-api-ci
            
            echo "⏳ Aguardando containers iniciarem (30s)..."
            sleep 30
            
            # Verificar status
            echo ""
            echo "📋 Status dos containers:"
            docker-compose -f docker-compose.ci.yml ps
            
            # Verificar logs do PostgreSQL e Redis se não estiverem rodando
            if ! docker-compose -f docker-compose.ci.yml ps postgres-ci | grep -q "Up"; then
              echo ""
              echo "❌ PostgreSQL não está rodando! Logs:"
              docker logs --tail 50 secured-guard-db-ci 2>&1 || echo "Container não encontrado"
            fi
            
            if ! docker-compose -f docker-compose.ci.yml ps redis-ci | grep -q "Up"; then
              echo ""
              echo "❌ Redis não está rodando! Logs:"
              docker logs --tail 50 secured-guard-redis-ci 2>&1 || echo "Container não encontrado"
            fi
            
            # Verificar se WhatsApp service está rodando
            echo ""
            echo "📱 Verificando WhatsApp service..."
            docker logs --tail 20 secured-guard-whatsapp-ci 2>&1 || echo "⚠️ Container WhatsApp ainda não iniciou"
            
            # Testar health do WhatsApp service
            sleep 5
            curl -f http://localhost:3333/health 2>&1 && echo "✅ WhatsApp service está respondendo" || echo "⚠️ WhatsApp service ainda não está respondendo"
            
            echo "✅ Containers CI iniciados!"
          EOF

      # ============================================
      # 1️⃣5️⃣ VERIFICAR STATUS DOS CONTAINERS ANTES DO HEALTH CHECK
      # ============================================
      - name: 🔍 Verify containers are running
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🔍 Verificando status dos containers..."
            cd /var/www/secured_guard/ci
            
            # Verificar se containers estão rodando
            docker-compose -f docker-compose.ci.yml ps
            
            # Verificar logs do backend para ver se iniciou
            echo ""
            echo "📋 Últimas 30 linhas dos logs do backend:"
            docker logs --tail 30 secured-guard-backend-ci 2>&1 || echo "⚠️ Container backend não encontrado"
            
            # Verificar se o backend está escutando na porta
            echo ""
            echo "🔌 Verificando se backend está escutando na porta 8081..."
            timeout 5 bash -c 'until nc -z localhost 8081; do sleep 1; done' && echo "✅ Backend está escutando" || echo "⚠️ Backend ainda não está escutando"
            
            # Verificar WhatsApp service
            echo ""
            echo "📱 Verificando WhatsApp service..."
            
            # Verificar se imagem existe
            echo "📦 Verificando se imagem do WhatsApp existe..."
            docker images | grep secured-guard-whatsapp || echo "⚠️ Imagem do WhatsApp não encontrada localmente"
            
            # Verificar status do container (rodando, parado, ou não existe)
            WHATSAPP_STATUS=$(docker ps -a --format '{{.Names}}\t{{.Status}}' | grep whatsapp-service-ci || echo "NÃO_ENCONTRADO")
            echo "📋 Status do container WhatsApp: $WHATSAPP_STATUS"
            
            if echo "$WHATSAPP_STATUS" | grep -q "Up"; then
              echo "✅ Container WhatsApp está rodando"
              echo "📋 Últimas 50 linhas dos logs:"
              docker logs --tail 50 secured-guard-whatsapp-ci 2>&1 || true
              echo ""
              echo "🔌 Testando health endpoint..."
              curl -s -f http://localhost:3333/health && echo "✅ WhatsApp service está respondendo" || echo "⚠️ WhatsApp service não está respondendo"
            elif echo "$WHATSAPP_STATUS" | grep -q "Exited\|Error\|Restarting"; then
              echo "❌ Container WhatsApp está parado/com erro!"
              echo "📋 Status completo:"
              docker ps -a | grep whatsapp-service-ci || echo "Container não encontrado"
              echo ""
              echo "📋 Logs completos do container (últimas 100 linhas):"
              docker logs --tail 100 secured-guard-whatsapp-ci 2>&1 || echo "⚠️ Não foi possível ler logs do container WhatsApp"
              echo ""
              echo "🔄 Removendo container com erro..."
              docker rm -f secured-guard-whatsapp-ci 2>&1 || echo "⚠️ Container já foi removido"
            else
              echo "❌ Container WhatsApp NÃO existe!"
            fi
            
            # Tentar iniciar/reiniciar se não estiver rodando
            if ! echo "$WHATSAPP_STATUS" | grep -q "Up"; then
              echo ""
              echo "🔄 Tentando iniciar container WhatsApp..."
              
              # Verificar se diretório de sessões existe
              echo "📁 Verificando diretório de sessões..."
              ls -la /var/www/secured_guard/ci/whatsapp_sessions/ 2>&1 || echo "⚠️ Diretório não existe, criando..."
              mkdir -p /var/www/secured_guard/ci/whatsapp_sessions
              chmod 755 /var/www/secured_guard/ci/whatsapp_sessions
              
              # Verificar se volumes existem
              echo "📁 Verificando volumes..."
              ls -la /var/www/secured_guard/ci/ | grep -E "(whatsapp|uploads)" || echo "⚠️ Volumes não encontrados"
              
              # Tentar iniciar
              echo "🚀 Iniciando container..."
              docker-compose -f docker-compose.ci.yml up -d whatsapp-service-ci 2>&1
              
              # Aguardar um pouco
              sleep 5
              
              # Verificar status após iniciar
              echo ""
              echo "📋 Status após tentativa de iniciar:"
              docker ps -a | grep whatsapp-service-ci || echo "Container não encontrado"
              
              # Se ainda falhou, tentar recriar
              if ! docker ps | grep -q whatsapp-service-ci; then
                echo ""
                echo "❌ Container ainda não está rodando. Tentando recriar..."
                docker-compose -f docker-compose.ci.yml rm -f whatsapp-service-ci 2>&1 || true
                docker-compose -f docker-compose.ci.yml up -d --force-recreate whatsapp-service-ci 2>&1
                sleep 5
                
                # Verificar novamente
                echo ""
                echo "📋 Status após recriar:"
                docker ps -a | grep whatsapp-service-ci || echo "Container não encontrado"
              fi
              
              # Mostrar logs detalhados
              echo ""
              echo "📋 Logs detalhados (últimas 100 linhas):"
              docker logs --tail 100 secured-guard-whatsapp-ci 2>&1 || echo "⚠️ Não foi possível ler logs do container WhatsApp"
              
              # Verificar erros específicos
              echo ""
              echo "🔍 Verificando erros comuns..."
              docker logs secured-guard-whatsapp-ci 2>&1 | grep -i "error\|fail\|crash\|exit" | tail -20 || echo "Nenhum erro específico encontrado"
            fi
          EOF

      # ============================================
      # 1️⃣6️⃣ DIAGNÓSTICO PRÉ-HEALTH CHECK
      # ============================================
      - name: 🔍 Pre-health check diagnostics
        continue-on-error: true
        run: |
          set -x  # Ativar modo verbose
          set -e  # Parar em erro (mas continue-on-error permite continuar)
          
          echo "🔍 ========================================="
          echo "📋 DIAGNÓSTICO ANTES DO HEALTH CHECK"
          echo "========================================="
          echo ""
          
          echo "📋 Verificando status dos containers..."
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o LogLevel=ERROR ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /var/www/secured_guard/ci && docker-compose -f docker-compose.ci.yml ps 2>&1" || { echo "❌ Erro ao verificar status dos containers"; exit 0; }
          echo ""
          
          echo "📋 Verificando containers rodando..."
