            echo ""
            echo "🔍 Coletando informações de diagnóstico do Traefik..."
          else
            echo ""
            echo "❌ Backend também não está respondendo internamente (HTTP $INTERNAL_CHECK)"
            echo "❌ Deploy falhou - aplicação não está funcionando!"
            echo ""
            echo "🔍 Coletando informações de diagnóstico completo..."
          fi
          
          # Verificar Traefik
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF' || true
