name: 🐳 Deploy CI Environment Only

on:
  push:
    branches:
      - ci
  workflow_dispatch:

env:
  ENVIRONMENT: ci
  APP_URL: https://ci.z7botsolutions.com.br

jobs:
  deploy-ci:
    name: 🚀 Deploy CI Environment
    runs-on: ubuntu-latest
    
    steps:
      # ============================================
      # 1️⃣ CHECKOUT DO CÓDIGO
      # ============================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ci

      # ============================================
      # 2️⃣ SETUP JAVA 17
      # ============================================
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      # ============================================
      # 3️⃣ SETUP NODE.JS 20
      # ============================================
      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ============================================
      # 4️⃣ BUILD BACKEND
      # ============================================
      - name: 🔨 Build Backend
        working-directory: ./backend
        run: |
          echo "🔨 Compilando backend para CI..."
          ./mvnw clean package -DskipTests -Dspring.profiles.active=ci
          echo "✅ Backend compilado!"

      # ============================================
      # 5️⃣ BUILD FRONTEND
      # ============================================
      - name: 🎨 Build Frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: https://ci.z7botsolutions.com.br/api
          VITE_ENVIRONMENT: ci
        run: |
          echo "🎨 Compilando frontend para CI..."
          npm ci
          npm run build
          echo "✅ Frontend compilado!"

      # ============================================
      # 6️⃣ BUILD DOCKER IMAGES
      # ============================================
      - name: 🐳 Build Docker images
        run: |
          echo "🐳 Construindo imagens Docker..."
          docker build -t z7design/secured-guard-backend:ci -f backend/Dockerfile.prod ./backend
          docker build -t z7design/secured-guard-frontend:ci -f frontend/Dockerfile.prod ./frontend
          echo "✅ Imagens construídas!"

      # ============================================
      # 7️⃣ LOGIN E PUSH DOCKER HUB
      # ============================================
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📤 Push images
        run: |
          echo "📤 Enviando imagens..."
          docker push z7design/secured-guard-backend:ci
          docker push z7design/secured-guard-frontend:ci
          echo "✅ Imagens enviadas!"

      # ============================================
      # 8️⃣ INSTALAR SSH PASS E CONFIGURAR SSH
      # ============================================
      - name: 🔑 Install sshpass and configure SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          echo "✅ SSH configurado para usar senha"

      # ============================================
      # 9️⃣ TRANSFERIR ARQUIVOS PARA VPS
      # ============================================
      - name: 📤 Transfer files to VPS
        run: |
          echo "📤 Transferindo arquivos para VPS..."
          
          # Criar estrutura de diretórios
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            mkdir -p /var/www/secured-guard/ci
            mkdir -p /var/www/secured-guard/ci/uploads
            mkdir -p /var/www/secured-guard/ci/logs
          EOF
          
          # Transferir docker-compose.ci.yml
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp docker-compose.ci.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured-guard/ci/
          
          echo "✅ Arquivos transferidos!"

      # ============================================
      # 🔟 CRIAR ARQUIVO .ENV NA VPS
      # ============================================
      - name: ⚙️ Create .env file
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "⚙️ Criando arquivo .env..."
            
            cat > /var/www/secured-guard/ci/.env << 'ENVEOF'
# ===== AMBIENTE CI =====
ENVIRONMENT=ci
APP_URL=https://ci.z7botsolutions.com.br

# ===== BANCO DE DADOS =====
POSTGRES_PASSWORD_CI=${{ secrets.POSTGRES_PASSWORD_CI }}

# ===== REDIS =====
REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

# ===== JWT =====
JWT_SECRET=${{ secrets.JWT_SECRET }}
ENVEOF
            
            chmod 600 /var/www/secured-guard/ci/.env
            echo "✅ Arquivo .env criado!"
          EOF

      # ============================================
      # 1️⃣1️⃣ FAZER BACKUP E PARAR CONTAINERS ANTIGOS
      # ============================================
      - name: 💾 Backup and stop old containers
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "💾 Fazendo backup e parando containers antigos..."
            
            cd /var/www/secured-guard/ci
            
            # Fazer backup dos volumes se existirem
            if [ -d "postgres_ci_data" ]; then
              BACKUP_DIR="/var/www/secured-guard/ci/backups/$(date +'%Y%m%d_%H%M%S')"
              mkdir -p "$BACKUP_DIR"
              cp -r postgres_ci_data "$BACKUP_DIR/" 2>/dev/null || true
              echo "✅ Backup criado em: $BACKUP_DIR"
            fi
            
            # Parar containers antigos
            docker-compose -f docker-compose.ci.yml down || true
            echo "✅ Containers antigos parados!"
          EOF

      # ============================================
      # 1️⃣2️⃣ FAZER PULL DAS NOVAS IMAGENS
      # ============================================
      - name: 📥 Pull new images
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "📥 Fazendo pull das novas imagens..."
            
            cd /var/www/secured-guard/ci
            
            # Login no Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Pull das imagens
            docker pull z7design/secured-guard-backend:ci
            docker pull z7design/secured-guard-frontend:ci
            
            echo "✅ Imagens atualizadas!"
          EOF

      # ============================================
      # 1️⃣3️⃣ INICIAR CONTAINERS CI
      # ============================================
      - name: 🚀 Start CI containers
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🚀 Iniciando containers CI..."
            
            cd /var/www/secured-guard/ci
            
            # Iniciar containers
            docker-compose -f docker-compose.ci.yml up -d
            
            echo "⏳ Aguardando containers iniciarem (30s)..."
            sleep 30
            
            # Verificar status
            docker-compose -f docker-compose.ci.yml ps
            
            echo "✅ Containers CI iniciados!"
          EOF

      # ============================================
      # 1️⃣4️⃣ HEALTH CHECK
      # ============================================
      - name: 🏥 Health check
        run: |
          echo "🏥 Verificando saúde da aplicação CI..."
          
          MAX_ATTEMPTS=10
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Tentativa $ATTEMPT de $MAX_ATTEMPTS..."
            
            if curl -f -s -o /dev/null -w "%{http_code}" https://ci.z7botsolutions.com.br/api/health | grep -q "200"; then
              echo "✅ Health check passou! Aplicação CI está respondendo."
              exit 0
            fi
            
            echo "⏳ Aguardando 10 segundos..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "❌ Health check falhou!"
          exit 1

      # ============================================
      # 1️⃣5️⃣ NOTIFICAÇÃO DE SUCESSO
      # ============================================
      - name: 🎉 CI Deployment successful
        if: success()
        run: |
          echo "🎉 ================================"
          echo "✅ DEPLOY CI CONCLUÍDO COM SUCESSO!"
          echo "🐳 Método: Docker Compose"
          echo "🌐 URL: https://ci.z7botsolutions.com.br"
          echo "📅 Data: $(date +'%Y-%m-%d %H:%M:%S')"
          echo "🔖 Commit: ${{ github.sha }}"
          echo "🌿 Branch: ci"
          echo "================================"
