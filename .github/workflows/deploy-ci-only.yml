      # ============================================
      # 1️⃣7️⃣ VERIFICAR TRAEFIK ANTES DO HEALTH CHECK
      # ============================================
      - name: 🔍 Verify Traefik before health check
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🔍 Verificando Traefik antes do health check..."
            
            # Verificar se o Traefik está rodando
            if docker ps | grep -q "traefik"; then
              echo "✅ Traefik está rodando"
            else
              echo "❌ Traefik não está rodando! Tentando iniciar..."
              cd /var/www/secured_guard
              docker-compose -f docker-compose.traefik.yml up -d
              sleep 10
              
              if docker ps | grep -q "traefik"; then
                echo "✅ Traefik iniciado"
              else
                echo "❌ Traefik não iniciou! Verificando logs..."
                docker logs traefik --tail 50
                exit 1
              fi
            fi
            
            # Verificar se o Traefik está respondendo
            MAX_RETRIES=10
            RETRY=0
            while [ $RETRY -lt $MAX_RETRIES ]; do
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/overview | grep -q "200"; then
                echo "✅ Traefik está respondendo"
                break
              fi
              RETRY=$((RETRY + 1))
              echo "⏳ Tentativa $RETRY/$MAX_RETRIES..."
              sleep 2
            done
            
            if [ $RETRY -eq $MAX_RETRIES ]; then
              echo "❌ Traefik não está respondendo após $MAX_RETRIES tentativas!"
              docker logs traefik --tail 50
              exit 1
            fi
            
            # Verificar se o nginx-ci está na rede z7network
            if docker ps | grep -q "nginx-ci"; then
              if docker inspect secured-guard-nginx-ci | grep -q "z7network"; then
                echo "✅ nginx-ci está na rede z7network"
              else
                echo "⚠️  nginx-ci não está na rede z7network. Reconectando..."
                docker network connect z7network secured-guard-nginx-ci || echo "⚠️  Falha ao conectar (pode já estar conectado)"
              fi
            fi
            
            # Verificar routers do Traefik
            echo "🔍 Verificando routers do Traefik..."
            ROUTERS=$(curl -s http://localhost:8080/api/http/routers | grep -o '"name":"[^"]*"' | grep -i "nginx-ci" || echo "")
            if [ -n "$ROUTERS" ]; then
              echo "✅ Router nginx-ci está configurado no Traefik"
            else
              echo "⚠️  Router nginx-ci não está configurado no Traefik"
              echo "📋 Routers disponíveis:"
              curl -s http://localhost:8080/api/http/routers | grep -o '"name":"[^"]*"' | head -10 || echo "Não foi possível listar routers"
            fi
            
            echo "✅ Verificação do Traefik concluída!"
          EOF

      # ============================================
      # 1️⃣8️⃣ HEALTH CHECK COM MAIS TEMPO E DIAGNÓSTICO
      # ============================================
      - name: 🏥 Health check
        run: |
          echo "🏥 Verificando saúde da aplicação CI..."
          echo "⏳ Aguardando 60 segundos para aplicação inicializar completamente..."
          sleep 60
          
          MAX_ATTEMPTS=15
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Tentativa $ATTEMPT de $MAX_ATTEMPTS..."
            
            # Tentar health check externo (via HTTPS)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 --insecure https://ci.z7botsolutions.com.br/api/health 2>&1 || echo "000")
            
            echo "HTTP Code recebido (externo): $HTTP_CODE"
            
            # Se o health check externo falhar, testar interno como fallback
            INTERNAL_CODE="000"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "⚠️ Health check externo falhou. Testando conectividade interna como fallback..."
              INTERNAL_CODE=$(sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/health 2>&1 || echo '000'" || echo "000")
              echo "HTTP Code recebido (interno): $INTERNAL_CODE"
            fi
            
            # Se qualquer um dos health checks passar, considerar sucesso
            if [ "$HTTP_CODE" = "200" ] || [ "$INTERNAL_CODE" = "200" ]; then
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Health check externo passou! Aplicação CI está respondendo via HTTPS."
                RESPONSE=$(curl -s --max-time 10 --insecure https://ci.z7botsolutions.com.br/api/health || echo "")
                echo "Resposta completa: $RESPONSE"
              else
                echo "✅ Health check interno passou! Backend está funcionando internamente."
                echo "⚠️ Nota: Health check externo não passou, mas backend está respondendo internamente."
              fi
              
              # Sair com sucesso imediatamente
              echo "✅ Deploy CI concluído com sucesso!"
              exit 0
            elif [ "$HTTP_CODE" = "000" ] && [ "$INTERNAL_CODE" = "000" ]; then
              echo "⚠️ Timeout ou erro de conexão em ambos os checks. Aplicação ainda pode estar iniciando..."
