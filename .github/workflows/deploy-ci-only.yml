            curl -s http://localhost:8080/api/http/routers | grep -o '"name":"[^"]*"' | head -20 || echo "Não foi possível listar routers"
            
            echo ""
            echo "📋 Verificando se Traefik está na rede z7network:"
            if docker inspect traefik 2>/dev/null | grep -q "z7network"; then
              echo "✅ Traefik está na rede z7network"
            else
              echo "❌ Traefik não está na rede z7network!"
            fi
            
            echo ""
            echo "📋 Verificando se nginx-ci está na rede z7network:"
            if docker inspect secured-guard-nginx-ci 2>/dev/null | grep -q "z7network"; then
              echo "✅ nginx-ci está na rede z7network"
            else
              echo "❌ nginx-ci não está na rede z7network!"
            fi
            
            echo ""
            echo "📋 Testando conectividade entre Traefik e nginx-ci:"
            if docker exec traefik ping -c 1 secured-guard-nginx-ci > /dev/null 2>&1; then
              echo "✅ Traefik consegue alcançar nginx-ci"
            else
              echo "❌ Traefik não consegue alcançar nginx-ci"
            fi
            
            echo ""
            echo "📋 Testando se Traefik está respondendo:"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8080/api/overview || echo "Traefik não responde"
          EOF
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /var/www/secured_guard/ci && echo '📋 Status dos containers:' && docker-compose -f docker-compose.ci.yml ps" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Todos os containers relacionados:' && docker ps -a | grep -E '(secured-guard|postgres|redis)' || echo 'Nenhum container encontrado'" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Tentando encontrar container PostgreSQL (qualquer nome):' && docker ps -a | grep postgres || echo 'Nenhum container PostgreSQL encontrado'" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Tentando encontrar container Redis (qualquer nome):' && docker ps -a | grep redis || echo 'Nenhum container Redis encontrado'" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Logs do PostgreSQL (tentando todos os containers possíveis):' && (POSTGRES_ID=\$(docker ps -a | grep postgres | grep secured-guard | grep -v CONTAINER | awk '{print \$1}' | head -1); if [ -n \"\$POSTGRES_ID\" ]; then docker logs \$POSTGRES_ID 2>&1 | tail -50; else echo 'Nenhum container PostgreSQL encontrado para logs'; fi)" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Logs do Redis (tentando todos os containers possíveis):' && (REDIS_ID=\$(docker ps -a | grep redis | grep secured-guard | grep -v CONTAINER | awk '{print \$1}' | head -1); if [ -n \"\$REDIS_ID\" ]; then docker logs \$REDIS_ID 2>&1 | tail -50; else echo 'Nenhum container Redis encontrado para logs'; fi)" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Verificando volumes PostgreSQL:' && ls -la /var/www/secured_guard/ci/postgres_data/ 2>&1 | head -10 || echo 'Diretório não existe ou sem permissão'" || true
          
