              echo "⚠️ HTTP Code externo: $HTTP_CODE, interno: $INTERNAL_CODE (esperado: 200)"
            fi
            
            # A cada 3 tentativas, verificar logs do backend
            if [ $((ATTEMPT % 3)) -eq 0 ]; then
              echo ""
              echo "🔍 Verificando logs do backend (últimas 20 linhas)..."
              sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /var/www/secured_guard/ci && docker logs --tail 20 secured-guard-backend-ci 2>&1 | tail -20" || true
            fi
            
            echo "⏳ Aguardando 15 segundos antes da próxima tentativa..."
            sleep 15
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo ""
          echo "❌ Health check externo falhou após $MAX_ATTEMPTS tentativas!"
          echo ""
          echo "🔍 Verificando se o backend está funcionando internamente antes de considerar falha..."
          
          # Verificar se o backend está funcionando internamente
          INTERNAL_CHECK=$(sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/health 2>&1" || echo "000")
          
          if [ "$INTERNAL_CHECK" = "200" ]; then
