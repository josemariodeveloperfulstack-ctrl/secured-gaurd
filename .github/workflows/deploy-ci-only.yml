name: 🐳 Deploy CI Environment Only

on:
  push:
    branches:
      - ci
  workflow_dispatch:

env:
  ENVIRONMENT: ci
  APP_URL: https://ci.z7botsolutions.com.br

jobs:
  deploy-ci:
    name: 🚀 Deploy CI Environment
    runs-on: ubuntu-latest
    
    steps:
      # ============================================
      # 1️⃣ CHECKOUT DO CÓDIGO
      # ============================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ci

      # ============================================
      # 2️⃣ SETUP JAVA 17
      # ============================================
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      # ============================================
      # 3️⃣ SETUP NODE.JS 20
      # ============================================
      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ============================================
      # 4️⃣ BUILD BACKEND
      # ============================================
      - name: 🔨 Build Backend
        working-directory: ./backend
        run: |
          echo "🔨 Compilando backend para CI..."
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests -Dspring.profiles.active=ci
          echo "✅ Backend compilado!"

      # ============================================
      # 5️⃣ BUILD FRONTEND
      # ============================================
      - name: 🎨 Build Frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: https://ci.z7botsolutions.com.br/api
          VITE_ENVIRONMENT: ci
          # Pular instalação do Cypress binário no CI (não necessário para build)
          CYPRESS_INSTALL_BINARY: 0
        run: |
          echo "🎨 Compilando frontend para CI..."
          npm ci
          npm run build
          echo "✅ Frontend compilado!"

      # ============================================
      # 6️⃣ BUILD DOCKER IMAGES
      # ============================================
      - name: 🐳 Build Docker images
        run: |
          echo "🐳 Construindo imagens Docker..."
          docker build -t z7design/secured-guard-backend:ci -f backend/Dockerfile.prod ./backend
          docker build -t z7design/secured-guard-frontend:ci -f frontend/Dockerfile.prod ./frontend
          docker build -t z7design/secured-guard-whatsapp:ci -f whatsapp-service/Dockerfile ./whatsapp-service
          echo "✅ Imagens construídas!"

      # ============================================
      # 7️⃣ LOGIN E PUSH DOCKER HUB
      # ============================================
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📤 Push images
        run: |
          echo "📤 Enviando imagens..."
          docker push z7design/secured-guard-backend:ci
          docker push z7design/secured-guard-frontend:ci
          docker push z7design/secured-guard-whatsapp:ci
          echo "✅ Imagens enviadas!"

      # ============================================
      # 8️⃣ INSTALAR SSH PASS E CONFIGURAR SSH
      # ============================================
      - name: 🔑 Install sshpass and configure SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          echo "✅ SSH configurado para usar senha"

      # ============================================
      # 9️⃣ TRANSFERIR ARQUIVOS PARA VPS
      # ============================================
      - name: 📤 Transfer files to VPS
        run: |
          echo "📤 Transferindo arquivos para VPS..."
          
          # Criar estrutura de diretórios
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            mkdir -p /var/www/secured_guard/ci
            mkdir -p /var/www/secured_guard/ci/nginx
            mkdir -p /var/www/secured_guard/ci/uploads
            mkdir -p /var/www/secured_guard/ci/logs
            mkdir -p /var/www/secured_guard/ci/postgres_data
            mkdir -p /var/www/secured_guard/ci/redis_data
            mkdir -p /var/www/secured_guard/ci/whatsapp_sessions
            mkdir -p /var/www/secured_guard/traefik/dynamic
          EOF
          
          # Transferir docker-compose.ci.yml
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp docker-compose.ci.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured_guard/ci/
          
          # Transferir configuração do Nginx
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp nginx/ci.conf ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured_guard/ci/nginx/
          
          # Transferir configuração dinâmica do Traefik
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp traefik-dynamic-ci.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured_guard/traefik/dynamic/ci.yml
          
          # Transferir docker-compose.traefik.yml atualizado
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp docker-compose.traefik.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/secured_guard/
          
          echo "✅ Arquivos transferidos!"

      # ============================================
      # 🔟 CRIAR ARQUIVO .ENV NA VPS
      # ============================================
      - name: ⚙️ Create .env file
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "⚙️ Criando arquivo .env..."
            
            cat > /var/www/secured_guard/ci/.env << 'ENVEOF'
          # ===== AMBIENTE CI =====
          ENVIRONMENT=ci
          APP_URL=https://ci.z7botsolutions.com.br
          
          # ===== BANCO DE DADOS =====
          POSTGRES_PASSWORD_CI=${{ secrets.POSTGRES_PASSWORD_CI }}
          
          # ===== REDIS =====
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          
          # ===== JWT =====
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENVEOF
            
            chmod 600 /var/www/secured_guard/ci/.env
            echo "✅ Arquivo .env criado!"
          EOF

      # ============================================
      # 1️⃣1️⃣ FAZER BACKUP E PARAR CONTAINERS ANTIGOS
      # ============================================
      - name: 💾 Backup and stop old containers
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "💾 Fazendo backup e parando containers antigos..."
            
            cd /var/www/secured_guard/ci
            
            # Fazer backup dos volumes se existirem
            if [ -d "postgres_ci_data" ]; then
              BACKUP_DIR="/var/www/secured_guard/ci/backups/$(date +'%Y%m%d_%H%M%S')"
              mkdir -p "$BACKUP_DIR"
              cp -r postgres_ci_data "$BACKUP_DIR/" 2>/dev/null || true
              echo "✅ Backup criado em: $BACKUP_DIR"
            fi
            
            # Parar containers antigos
            docker-compose -f docker-compose.ci.yml down || true
            echo "✅ Containers antigos parados!"
          EOF

      # ============================================
      # 1️⃣2️⃣ REINICIAR TRAEFIK COM NOVA CONFIGURAÇÃO
      # ============================================
      - name: 🔄 Restart Traefik
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🔄 Reiniciando Traefik com nova configuração..."
            
            cd /var/www/secured_guard
            
            # Reiniciar Traefik para carregar configuração dinâmica
            docker-compose -f docker-compose.traefik.yml down
            docker-compose -f docker-compose.traefik.yml up -d
            
            echo "⏳ Aguardando Traefik iniciar (10s)..."
            sleep 10
            
            # Verificar se Traefik está rodando
            docker ps | grep traefik
            
            echo "✅ Traefik reiniciado!"
          EOF

      # ============================================
      # 1️⃣3️⃣ FAZER PULL DAS NOVAS IMAGENS
      # ============================================
      - name: 📥 Pull new images
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "📥 Fazendo pull das novas imagens..."
            
            cd /var/www/secured_guard/ci
            
            # Login no Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Pull das imagens
            docker pull z7design/secured-guard-backend:ci
            docker pull z7design/secured-guard-frontend:ci
            docker pull z7design/secured-guard-whatsapp:ci
            
            echo "✅ Imagens atualizadas!"
          EOF

      # ============================================
      # 1️⃣4️⃣ INICIAR CONTAINERS CI
      # ============================================
      - name: 🚀 Start CI containers
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🚀 Iniciando containers CI..."
            
            cd /var/www/secured_guard/ci
            
            # Criar diretórios de dados se não existirem
            mkdir -p /var/www/secured_guard/ci/postgres_data
            mkdir -p /var/www/secured_guard/ci/redis_data
            chmod 755 /var/www/secured_guard/ci/postgres_data
            chmod 755 /var/www/secured_guard/ci/redis_data
            
            # Iniciar primeiro PostgreSQL e Redis
            echo "🔄 Iniciando PostgreSQL e Redis..."
            docker-compose -f docker-compose.ci.yml up -d postgres-ci redis-ci
            
            # Aguardar PostgreSQL ficar saudável
            echo "⏳ Aguardando PostgreSQL iniciar..."
            MAX_RETRIES=30
            RETRY=0
            while [ $RETRY -lt $MAX_RETRIES ]; do
              if docker-compose -f docker-compose.ci.yml ps postgres-ci | grep -q "Up"; then
                echo "✅ PostgreSQL está rodando"
                break
              fi
              RETRY=$((RETRY + 1))
              sleep 2
            done
            
            if [ $RETRY -eq $MAX_RETRIES ]; then
              echo "❌ PostgreSQL não iniciou! Verificando logs..."
              docker logs --tail 50 secured-guard-db-ci 2>&1 || echo "Container não encontrado"
            fi
            
            # Aguardar Redis ficar saudável
            echo "⏳ Aguardando Redis iniciar..."
            RETRY=0
            while [ $RETRY -lt $MAX_RETRIES ]; do
              if docker-compose -f docker-compose.ci.yml ps redis-ci | grep -q "Up"; then
                echo "✅ Redis está rodando"
                break
              fi
              RETRY=$((RETRY + 1))
              sleep 2
            done
            
            if [ $RETRY -eq $MAX_RETRIES ]; then
              echo "❌ Redis não iniciou! Verificando logs..."
              docker logs --tail 50 secured-guard-redis-ci 2>&1 || echo "Container não encontrado"
            fi
            
            # Verificar se PostgreSQL e Redis estão realmente rodando
            if ! docker-compose -f docker-compose.ci.yml ps postgres-ci | grep -q "Up"; then
              echo "❌ PostgreSQL não está rodando! Verificando logs..."
              docker logs secured-guard-db-ci 2>&1 | tail -50 || echo "Container não existe"
              echo ""
              echo "🔄 Tentando remover e recriar PostgreSQL..."
              docker-compose -f docker-compose.ci.yml rm -f postgres-ci 2>&1 || true
              docker rm -f secured-guard-db-ci 2>&1 || true
              # Limpar containers órfãos com prefixo
              docker ps -a | grep "secured-guard-db-ci" | awk '{print $1}' | xargs -r docker rm -f 2>&1 || true
              echo "🔄 Recriando PostgreSQL..."
              docker-compose -f docker-compose.ci.yml up -d postgres-ci
              sleep 15
              docker logs secured-guard-db-ci 2>&1 | tail -50 || echo "Container ainda não existe"
            fi
            
            if ! docker-compose -f docker-compose.ci.yml ps redis-ci | grep -q "Up"; then
              echo "❌ Redis não está rodando! Verificando logs..."
              docker logs secured-guard-redis-ci 2>&1 | tail -50 || echo "Container não existe"
              echo ""
              echo "🔄 Tentando remover e recriar Redis..."
              docker-compose -f docker-compose.ci.yml rm -f redis-ci 2>&1 || true
              docker rm -f secured-guard-redis-ci 2>&1 || true
              # Limpar containers órfãos com prefixo
              docker ps -a | grep "secured-guard-redis-ci" | awk '{print $1}' | xargs -r docker rm -f 2>&1 || true
              echo "🔄 Recriando Redis..."
              docker-compose -f docker-compose.ci.yml up -d redis-ci
              sleep 15
              docker logs secured-guard-redis-ci 2>&1 | tail -50 || echo "Container ainda não existe"
            fi
            
            # Verificar novamente se estão rodando antes de continuar
            if ! docker-compose -f docker-compose.ci.yml ps postgres-ci | grep -q "Up"; then
              echo "❌❌❌ PostgreSQL ainda não está rodando após tentativa de recriar!"
              echo "📋 Verificando portas em uso..."
              netstat -tlnp | grep :5432 || ss -tlnp | grep :5432 || echo "Comando netstat/ss não disponível"
              echo "📋 Verificando volumes..."
              ls -la /var/www/secured_guard/ci/postgres_data/ | head -10 || echo "Diretório não existe ou sem permissão"
              exit 1
            fi
            
            if ! docker-compose -f docker-compose.ci.yml ps redis-ci | grep -q "Up"; then
              echo "❌❌❌ Redis ainda não está rodando após tentativa de recriar!"
              echo "📋 Verificando portas em uso..."
              netstat -tlnp | grep :6379 || ss -tlnp | grep :6379 || echo "Comando netstat/ss não disponível"
              echo "📋 Verificando volumes..."
              ls -la /var/www/secured_guard/ci/redis_data/ | head -10 || echo "Diretório não existe ou sem permissão"
              exit 1
            fi
            
            # Agora iniciar os outros containers
            echo "🔄 Iniciando outros containers..."
            docker-compose -f docker-compose.ci.yml up -d --force-recreate
            
            echo "⏳ Aguardando containers iniciarem (30s)..."
            sleep 30
            
            # Verificar status
            echo ""
            echo "📋 Status dos containers:"
            docker-compose -f docker-compose.ci.yml ps
            
            # Verificar logs do PostgreSQL e Redis se não estiverem rodando
            if ! docker-compose -f docker-compose.ci.yml ps postgres-ci | grep -q "Up"; then
              echo ""
              echo "❌ PostgreSQL não está rodando! Logs:"
              docker logs --tail 50 secured-guard-db-ci 2>&1 || echo "Container não encontrado"
            fi
            
            if ! docker-compose -f docker-compose.ci.yml ps redis-ci | grep -q "Up"; then
              echo ""
              echo "❌ Redis não está rodando! Logs:"
              docker logs --tail 50 secured-guard-redis-ci 2>&1 || echo "Container não encontrado"
            fi
            
            # Verificar se WhatsApp service está rodando
            echo ""
            echo "📱 Verificando WhatsApp service..."
            docker logs --tail 20 secured-guard-whatsapp-ci 2>&1 || echo "⚠️ Container WhatsApp ainda não iniciou"
            
            # Testar health do WhatsApp service
            sleep 5
            curl -f http://localhost:3333/health 2>&1 && echo "✅ WhatsApp service está respondendo" || echo "⚠️ WhatsApp service ainda não está respondendo"
            
            echo "✅ Containers CI iniciados!"
          EOF

      # ============================================
      # 1️⃣5️⃣ VERIFICAR STATUS DOS CONTAINERS ANTES DO HEALTH CHECK
      # ============================================
      - name: 🔍 Verify containers are running
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "🔍 Verificando status dos containers..."
            cd /var/www/secured_guard/ci
            
            # Verificar se containers estão rodando
            docker-compose -f docker-compose.ci.yml ps
            
            # Verificar logs do backend para ver se iniciou
            echo ""
            echo "📋 Últimas 30 linhas dos logs do backend:"
            docker logs --tail 30 secured-guard-backend-ci 2>&1 || echo "⚠️ Container backend não encontrado"
            
            # Verificar se o backend está escutando na porta
            echo ""
            echo "🔌 Verificando se backend está escutando na porta 8081..."
            timeout 5 bash -c 'until nc -z localhost 8081; do sleep 1; done' && echo "✅ Backend está escutando" || echo "⚠️ Backend ainda não está escutando"
            
            # Verificar WhatsApp service
            echo ""
            echo "📱 Verificando WhatsApp service..."
            if docker ps | grep -q whatsapp-service-ci; then
              echo "✅ Container WhatsApp está rodando"
              echo "📋 Últimas 20 linhas dos logs:"
              docker logs --tail 20 secured-guard-whatsapp-ci 2>&1 || true
              echo ""
              echo "🔌 Testando health endpoint..."
              curl -s -f http://localhost:3333/health && echo "✅ WhatsApp service está respondendo" || echo "⚠️ WhatsApp service não está respondendo"
            else
              echo "❌ Container WhatsApp NÃO está rodando!"
              echo "🔄 Removendo container antigo se existir..."
              docker rm -f secured-guard-whatsapp-ci 2>&1 || echo "⚠️ Nenhum container antigo encontrado para remover"
              echo "🔄 Tentando iniciar..."
              docker-compose -f docker-compose.ci.yml up -d whatsapp-service-ci || {
                echo "❌ Erro ao iniciar container. Tentando recriar..."
                docker-compose -f docker-compose.ci.yml rm -f whatsapp-service-ci 2>&1 || true
                docker-compose -f docker-compose.ci.yml up -d --force-recreate whatsapp-service-ci || echo "⚠️ Falha ao recriar container WhatsApp"
              }
              sleep 10
              docker logs --tail 30 secured-guard-whatsapp-ci 2>&1 || echo "⚠️ Não foi possível ler logs do container WhatsApp"
            fi
          EOF

      # ============================================
      # 1️⃣6️⃣ HEALTH CHECK COM MAIS TEMPO E DIAGNÓSTICO
      # ============================================
      - name: 🏥 Health check
        run: |
          echo "🏥 Verificando saúde da aplicação CI..."
          echo "⏳ Aguardando 60 segundos para aplicação inicializar completamente..."
          sleep 60
          
          MAX_ATTEMPTS=15
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Tentativa $ATTEMPT de $MAX_ATTEMPTS..."
            
            # Tentar health check externo (via HTTPS)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 --insecure https://ci.z7botsolutions.com.br/api/health 2>&1 || echo "000")
            
            echo "HTTP Code recebido (externo): $HTTP_CODE"
            
            # Se o health check externo falhar, testar interno como fallback
            INTERNAL_CODE="000"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "⚠️ Health check externo falhou. Testando conectividade interna como fallback..."
              INTERNAL_CODE=$(sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/health 2>&1 || echo '000'" || echo "000")
              echo "HTTP Code recebido (interno): $INTERNAL_CODE"
            fi
            
            # Se qualquer um dos health checks passar, considerar sucesso
            if [ "$HTTP_CODE" = "200" ] || [ "$INTERNAL_CODE" = "200" ]; then
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Health check externo passou! Aplicação CI está respondendo via HTTPS."
                RESPONSE=$(curl -s --max-time 10 --insecure https://ci.z7botsolutions.com.br/api/health || echo "")
                echo "Resposta completa: $RESPONSE"
              else
                echo "✅ Health check interno passou! Backend está funcionando internamente."
                echo "⚠️ Nota: Health check externo não passou, mas backend está respondendo internamente."
              fi
              
              # Sair com sucesso imediatamente
              echo "✅ Deploy CI concluído com sucesso!"
              exit 0
            elif [ "$HTTP_CODE" = "000" ] && [ "$INTERNAL_CODE" = "000" ]; then
              echo "⚠️ Timeout ou erro de conexão em ambos os checks. Aplicação ainda pode estar iniciando..."
            else
              echo "⚠️ HTTP Code externo: $HTTP_CODE, interno: $INTERNAL_CODE (esperado: 200)"
            fi
            
            # A cada 3 tentativas, verificar logs do backend
            if [ $((ATTEMPT % 3)) -eq 0 ]; then
              echo ""
              echo "🔍 Verificando logs do backend (últimas 20 linhas)..."
              sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /var/www/secured_guard/ci && docker logs --tail 20 secured-guard-backend-ci 2>&1 | tail -20" || true
            fi
            
            echo "⏳ Aguardando 15 segundos antes da próxima tentativa..."
            sleep 15
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo ""
          echo "❌ Health check falhou após $MAX_ATTEMPTS tentativas!"
          echo ""
          echo "🔍 Coletando informações de diagnóstico..."
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /var/www/secured_guard/ci && echo '📋 Status dos containers:' && docker-compose -f docker-compose.ci.yml ps" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Todos os containers relacionados:' && docker ps -a | grep -E '(secured-guard|postgres|redis)' || echo 'Nenhum container encontrado'" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Tentando encontrar container PostgreSQL (qualquer nome):' && docker ps -a | grep postgres || echo 'Nenhum container PostgreSQL encontrado'" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Tentando encontrar container Redis (qualquer nome):' && docker ps -a | grep redis || echo 'Nenhum container Redis encontrado'" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Logs do PostgreSQL (tentando todos os containers possíveis):' && (docker logs \$(docker ps -a | grep postgres | grep -v CONTAINER | awk '{print \$1}' | head -1) 2>&1 | tail -50 || echo 'Nenhum container PostgreSQL encontrado para logs')" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Logs do Redis (tentando todos os containers possíveis):' && (docker logs \$(docker ps -a | grep redis | grep -v CONTAINER | awk '{print \$1}' | head -1) 2>&1 | tail -50 || echo 'Nenhum container Redis encontrado para logs')" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Verificando volumes PostgreSQL:' && ls -la /var/www/secured_guard/ci/postgres_data/ 2>&1 | head -10 || echo 'Diretório não existe ou sem permissão'" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Verificando volumes Redis:' && ls -la /var/www/secured_guard/ci/redis_data/ 2>&1 | head -10 || echo 'Diretório não existe ou sem permissão'" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Verificando portas em uso:' && (netstat -tlnp | grep -E ':(5432|6379|8081)' || ss -tlnp | grep -E ':(5432|6379|8081)' || echo 'Comando netstat/ss não disponível')" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Logs do backend (tentando encontrar):' && (docker logs \$(docker ps -a | grep backend | grep -v CONTAINER | awk '{print \$1}' | head -1) 2>&1 | tail -50 || echo 'Container backend não encontrado')" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '📋 Logs do nginx (tentando encontrar):' && (docker logs \$(docker ps -a | grep nginx | grep secured-guard | grep -v CONTAINER | awk '{print \$1}' | head -1) 2>&1 | tail -30 || echo 'Container nginx não encontrado')" || true
          
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '' && echo '🌐 Testando conectividade interna:' && (curl -s -o /dev/null -w 'Backend (localhost:8081): %{http_code}\n' http://localhost:8081/api/health || echo 'Backend não responde'); exit 0" || true
          
          exit 1

      # ============================================
      # 1️⃣7️⃣ VALIDAR CORREÇÃO DO ERRO 405
      # ============================================
      - name: 🧪 Validate 405 fix
        run: |
          echo "🧪 Validando correção do erro 405..."
          
          # Testar endpoint de login
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://ci.z7botsolutions.com.br/api/auth/login \
            -H "Content-Type: application/json" \
            -H "Origin: https://ci.z7botsolutions.com.br" \
            -d '{"username":"test","password":"test"}')
          
          echo "HTTP Code recebido: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "405" ]; then
            echo "❌ Erro 405 ainda presente! Deploy falhou."
            exit 1
          elif [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Endpoint de login respondendo corretamente!"
            echo "✅ Erro 405 foi corrigido com sucesso!"
          else
            echo "⚠️  HTTP Code inesperado: $HTTP_CODE"
            echo "Mas não é 405, então a correção principal funcionou."
          fi

      # ============================================
      # 1️⃣8️⃣ NOTIFICAÇÃO DE SUCESSO
      # ============================================
      - name: 🎉 CI Deployment successful
        if: success()
        run: |
          echo "🎉 ================================"
          echo "✅ DEPLOY CI CONCLUÍDO COM SUCESSO!"
          echo "🐳 Método: Docker Compose"
          echo "🌐 URL: https://ci.z7botsolutions.com.br"
          echo "📅 Data: $(date +'%Y-%m-%d %H:%M:%S')"
          echo "🔖 Commit: ${{ github.sha }}"
          echo "🌿 Branch: ci"
          echo "✅ Erro 405 corrigido e validado"
          echo "================================"
