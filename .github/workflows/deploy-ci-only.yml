          BACKEND_OUTPUT=$(sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o LogLevel=ERROR ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "BACKEND_ID=\$(docker ps -a 2>&1 | grep backend | grep secured-guard | grep -v CONTAINER | awk '{print \$1}' | head -1); if [ -n \"\$BACKEND_ID\" ]; then echo 'Container ID: '\$BACKEND_ID; docker logs \$BACKEND_ID 2>&1 | tail -50; else echo '⚠️ Container Backend não encontrado'; docker ps -a 2>&1 | grep backend || echo 'Nenhum container Backend no sistema'; fi" 2>&1 || echo "Erro ao executar comando SSH")
