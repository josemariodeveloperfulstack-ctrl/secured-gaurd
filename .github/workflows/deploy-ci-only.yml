          REDIS_OUTPUT=$(sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o LogLevel=ERROR ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "REDIS_ID=\$(docker ps -a 2>&1 | grep redis | grep secured-guard | grep -v CONTAINER | awk '{print \$1}' | head -1); if [ -n \"\$REDIS_ID\" ]; then echo 'Container ID: '\$REDIS_ID; docker logs \$REDIS_ID 2>&1 | tail -30; else echo '⚠️ Container Redis não encontrado'; docker ps -a 2>&1 | grep redis || echo 'Nenhum container Redis no sistema'; fi" 2>&1 || echo "Erro ao executar comando SSH")
          echo "$REDIS_OUTPUT"
