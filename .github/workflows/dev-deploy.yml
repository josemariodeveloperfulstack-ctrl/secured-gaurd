name: 🛠️ Deploy Desenvolvimento - SecuredGuard

on:
  push:
    branches: [ develop, dev ]
  pull_request:
    branches: [ develop, dev ]
  workflow_dispatch: # Permite execução manual

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ========================================
  # JOB 1: CI - TESTES RÁPIDOS
  # ========================================
  quick-tests:
    name: 🧪 CI - Testes Rápidos
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secured_guard_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🧪 Testes Backend Rápidos
      run: |
        cd backend
        ./mvnw clean test -Dspring.profiles.active=test -Dtest="*Test"
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/secured_guard_test
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres

    - name: 🏗️ Build Frontend
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 📦 Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build

  # ========================================
  # JOB 2: DEPLOY - AMBIENTE DEV
  # ========================================
  deploy-dev:
    name: 🛠️ Deploy - Ambiente Desenvolvimento
    runs-on: ubuntu-latest
    needs: quick-tests
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/dev'
    
    environment: development

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🔐 Configurar SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

    - name: 📦 Transferir código para VPS (Dev)
      run: |
        rsync -avz --delete \
          --exclude='.git/' \
          --exclude='node_modules/' \
          --exclude='target/' \
          --exclude='*.log' \
          --exclude='uploads/' \
          --exclude='logs/' \
          --exclude='backups/' \
          -e "ssh -o StrictHostKeyChecking=no" \
          ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/secured-guard-dev/

    - name: 🐳 Deploy Ambiente Dev na VPS
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          cd /opt/secured-guard-dev
          
          # Parar containers dev existentes
          docker-compose -f deploy/docker-compose.dev.yml down || true
          
          # Subir containers dev
          docker-compose -f deploy/docker-compose.dev.yml up -d --build
          
          # Aguardar serviços ficarem prontos
          sleep 20
          
          # Verificar saúde dos serviços
          docker-compose -f deploy/docker-compose.dev.yml ps
          
          echo "✅ Deploy DEV concluído!"
        EOF

    - name: 🔍 Verificar deploy DEV
      run: |
        sleep 10
        curl -f http://${{ secrets.VPS_HOST }}:8082/actuator/health || echo "Backend dev pode não estar pronto ainda"
        echo "🛠️ Ambiente DEV disponível em: http://${{ secrets.VPS_HOST }}:3001"
