name: ⚡ Quick Deploy - SecuredGuard

on:
  workflow_dispatch: # Apenas execução manual
    inputs:
      environment:
        description: 'Ambiente para deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      force_deploy:
        description: 'Forçar deploy mesmo com testes falhando'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  DOCKER_BUILDKIT: 1

jobs:
  # ========================================
  # JOB 1: BUILD RÁPIDO
  # ========================================
  quick-build:
    name: ⚡ Build Rápido
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: 🏗️ Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 📦 Instalar dependências Frontend
      working-directory: ./frontend
      run: npm ci

    - name: 🏗️ Build Backend JAR
      working-directory: ./backend
      run: mvn clean package -DskipTests

    - name: 🏗️ Build Frontend
      working-directory: ./frontend
      run: npm run build

    - name: 📦 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: quick-build-artifacts
        path: |
          backend/target/*.jar
          frontend/dist/

  # ========================================
  # JOB 2: DEPLOY DIRETO
  # ========================================
  quick-deploy:
    name: 🚀 Deploy Direto
    runs-on: ubuntu-latest
    needs: quick-build

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 📦 Download Artifacts
      uses: actions/download-artifact@v4
      with:
        name: quick-build-artifacts
        path: ./

    - name: 🔐 Configurar SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

    - name: 📋 Verificar conexão VPS
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'Conexão SSH OK'"

    - name: 📦 Transferir código para VPS
      run: |
        rsync -avz --delete \
          --exclude='.git/' \
          --exclude='node_modules/' \
          --exclude='target/' \
          --exclude='*.log' \
          --exclude='uploads/' \
          --exclude='logs/' \
          --exclude='backups/' \
          --exclude='.DS_Store' \
          --exclude='Thumbs.db' \
          --exclude='*.swp' \
          --exclude='*.swo' \
          --exclude='*~' \
          --exclude='.github/' \
          --exclude='docs/' \
          --exclude='tests/' \
          --exclude='*.md' \
          --exclude='*.sql' \
          --exclude='*.ps1' \
          --exclude='*.sh' \
          --exclude='*.bat' \
          -e "ssh -o StrictHostKeyChecking=no" \
          ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/secured-guard/

    - name: 🐳 Deploy na VPS
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          cd /opt/secured-guard
          
          echo "🔄 Parando containers existentes..."
          docker-compose down || true
          
          echo "🏗️ Construindo e subindo novos containers..."
          docker-compose up -d --build
          
          echo "⏳ Aguardando serviços ficarem prontos..."
          sleep 30
          
          echo "📊 Verificando saúde dos serviços..."
          docker-compose ps
          
          echo "✅ Deploy rápido concluído!"
        EOF

    - name: 🔍 Verificação rápida
      run: |
        sleep 10
        curl -f http://${{ secrets.VPS_HOST }}:8081/actuator/health
        echo "🎉 Deploy rápido concluído em: http://${{ secrets.VPS_HOST }}"
