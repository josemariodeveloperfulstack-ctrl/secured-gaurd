name: Deploy to VPS

on:
  push:
    branches: [ main ]

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PORT: ${{ secrets.VPS_PORT || '22' }}

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      run: |
        echo "🔧 Configurando SSH..."
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        touch ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
        
        # Add VPS host key to known_hosts
        echo "🔑 Adicionando chave do host VPS..."
        ssh-keyscan -p ${{ env.VPS_PORT }} ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts
        
        # Verify the known_hosts file
        echo "📋 Verificando known_hosts:"
        cat ~/.ssh/known_hosts
        
        echo "✅ SSH configurado!"
        
    - name: Deploy to VPS
      run: |
        echo "🚀 Iniciando deploy para VPS..."
        
        # Make scripts executable
        chmod +x deploy/deploy-to-vps.sh
        chmod +x deploy.sh
        
        # Set environment variables
        export VPS_HOST="${{ env.VPS_HOST }}"
        export VPS_USER="${{ env.VPS_USER }}"
        export VPS_PORT="${{ env.VPS_PORT }}"
        
        # Copy deploy script to VPS
        scp -P ${{ env.VPS_PORT }} deploy.sh ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/opt/secured-guard/
        
        # Execute deploy on VPS
        ssh -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "cd /opt/secured-guard && chmod +x deploy.sh && ./deploy.sh"
        
        echo "✅ Deploy concluído!"
        
    - name: Verify Deployment
      run: |
        echo "🔍 Verificando deployment..."
        ssh -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
          "cd /opt/secured-guard && git log --oneline -1 && docker compose -f deploy/docker-compose.prod.yml ps"
        echo "✅ Verificação concluída!"
        
    - name: Test Domain
      run: |
        echo "🌐 Testando domínio do cliente..."
        if curl -f -s https://securedguard.z7botsolutions.com.br > /dev/null; then
          echo "✅ Domínio securedguard.z7botsolutions.com.br está funcionando"
        else
          echo "⚠️ Domínio pode estar com problema, mas VPS está funcionando"
        fi
        
    - name: Notify Success
      if: success()
      run: |
        echo "🎉 Deploy realizado com sucesso!"
        echo "📱 Aplicação disponível em: https://securedguard.z7botsolutions.com.br"
        echo "📊 Status: VPS atualizada com sucesso"
        echo "🌐 Domínio: securedguard.z7botsolutions.com.br"
        
    - name: Notify Failure
      if: failure()
      run: |
        echo "❌ Deploy falhou!"
        echo "🔍 Verifique os logs acima para mais detalhes"