name: 🚀 Deploy para VPS - SecuredGuard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite execução manual

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ========================================
  # JOB 1: CI - TESTES AUTOMATIZADOS
  # ========================================
  ci-tests:
    name: 🧪 CI - Testes Automatizados
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secured_guard_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🏗️ Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 📦 Instalar dependências Frontend
      run: |
        cd frontend
        npm ci

    - name: 🏗️ Build Frontend
      run: |
        cd frontend
        npm run build

    - name: 🧪 Testes Backend
      run: |
        cd backend
        ./mvnw clean test -Dspring.profiles.active=test
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/secured_guard_test
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6379

    - name: 📊 Relatório de Testes
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Backend Tests
        path: backend/target/surefire-reports/*.xml
        reporter: java-junit

  # ========================================
  # JOB 2: BUILD - CONSTRUIR IMAGENS
  # ========================================
  build-images:
    name: 🐳 Build - Imagens Docker
    runs-on: ubuntu-latest
    needs: ci-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🐳 Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🏗️ Build Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile.prod
        push: false
        tags: secured-guard-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 🏗️ Build Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.prod
        push: false
        tags: secured-guard-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ========================================
  # JOB 3: DEPLOY - VPS PRODUÇÃO
  # ========================================
  deploy-vps:
    name: ☁️ Deploy - VPS Produção
    runs-on: ubuntu-latest
    needs: [ci-tests, build-images]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    environment: production # Requer aprovação manual

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🔐 Configurar SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

    - name: 📋 Verificar conexão VPS
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'Conexão SSH OK'"

    - name: 📦 Transferir código para VPS
      run: |
        rsync -avz --delete \
          --exclude='.git/' \
          --exclude='node_modules/' \
          --exclude='target/' \
          --exclude='*.log' \
          --exclude='uploads/' \
          --exclude='logs/' \
          --exclude='backups/' \
          --exclude='.DS_Store' \
          --exclude='Thumbs.db' \
          --exclude='*.swp' \
          --exclude='*.swo' \
          --exclude='*~' \
          -e "ssh -o StrictHostKeyChecking=no" \
          ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/secured-guard/

    - name: 🐳 Deploy na VPS
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          cd /opt/secured-guard
          
          # Parar containers existentes
          docker-compose -f deploy/docker-compose.prod.yml down || true
          
          # Limpar imagens antigas
          docker image prune -f || true
          
          # Subir novos containers
          docker-compose -f deploy/docker-compose.prod.yml up -d --build
          
          # Aguardar serviços ficarem prontos
          sleep 30
          
          # Verificar saúde dos serviços
          docker-compose -f deploy/docker-compose.prod.yml ps
          
          # Testar aplicação
          curl -f http://localhost:8080/actuator/health || exit 1
          curl -f http://localhost/ || exit 1
          
          echo "✅ Deploy concluído com sucesso!"
        EOF

    - name: 🔍 Verificar deploy
      run: |
        # Aguardar um pouco mais para garantir que tudo está funcionando
        sleep 10
        
        # Testar endpoints
        curl -f http://${{ secrets.VPS_HOST }}:8080/actuator/health
        curl -f http://${{ secrets.VPS_HOST }}/
        
        echo "🎉 Aplicação está funcionando em:"
        echo "🌐 Frontend: http://${{ secrets.VPS_HOST }}"
        echo "🔧 Backend: http://${{ secrets.VPS_HOST }}:8080"

    - name: 📊 Notificar sucesso
      if: success()
      run: |
        echo "✅ Deploy para VPS concluído com sucesso!"
        echo "🌐 Aplicação disponível em: http://${{ secrets.VPS_HOST }}"

    - name: ❌ Notificar falha
      if: failure()
      run: |
        echo "❌ Falha no deploy para VPS"
        echo "Verifique os logs acima para mais detalhes"

  # ========================================
  # JOB 4: HEALTH CHECK - VERIFICAÇÃO PÓS-DEPLOY
  # ========================================
  health-check:
    name: 🏥 Health Check - Verificação Pós-Deploy
    runs-on: ubuntu-latest
    needs: deploy-vps
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: 🔍 Verificar Backend
      run: |
        for i in {1..5}; do
          if curl -f http://${{ secrets.VPS_HOST }}:8080/actuator/health; then
            echo "✅ Backend está funcionando"
            break
          else
            echo "⏳ Aguardando backend... ($i/5)"
            sleep 10
          fi
        done

    - name: 🔍 Verificar Frontend
      run: |
        for i in {1..5}; do
          if curl -f http://${{ secrets.VPS_HOST }}/; then
            echo "✅ Frontend está funcionando"
            break
          else
            echo "⏳ Aguardando frontend... ($i/5)"
            sleep 10
          fi
        done

    - name: 📊 Relatório Final
      run: |
        echo "🎉 Health Check concluído!"
        echo "🌐 Frontend: http://${{ secrets.VPS_HOST }}/"
        echo "🔧 Backend: http://${{ secrets.VPS_HOST }}:8080/actuator/health"
        echo "📊 Logs: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'docker-compose -f /opt/secured-guard/deploy/docker-compose.prod.yml logs'"