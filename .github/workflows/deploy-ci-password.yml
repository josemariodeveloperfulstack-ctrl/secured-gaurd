name: Deploy CI Environment (Password)

on:
  push:
    branches: [ ci, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/docker-compose.ci-domains.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'ci'
        type: choice
        options:
        - ci

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to CI Environment
      run: |
        # Configurações
        VPS_HOST="${{ secrets.VPS_HOST }}"
        VPS_USER="${{ secrets.VPS_USER }}"
        VPS_PORT="${{ secrets.VPS_PORT }}"
        VPS_PASSWORD="${{ secrets.VPS_PASSWORD }}"
        
        echo "🚀 Deploying to CI Environment..."
        
        # Instalar sshpass
        sudo apt-get update
        sudo apt-get install -y sshpass
        
        # Adicionar host conhecido
        ssh-keyscan -p $VPS_PORT $VPS_HOST >> ~/.ssh/known_hosts
        
        # Parar containers existentes
        sshpass -p "$VPS_PASSWORD" ssh -p $VPS_PORT -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "cd /opt/secured-guard && docker-compose -f deploy/docker-compose.ci-domains.yml down" || true
        
        # Copiar código atualizado
        sshpass -p "$VPS_PASSWORD" rsync -avz --delete \
          --exclude='.git/' \
          --exclude='node_modules/' \
          --exclude='target/' \
          --exclude='*.log' \
          --exclude='uploads/' \
          --exclude='logs/' \
          --exclude='backups/' \
          -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=no" \
          ./ $VPS_USER@$VPS_HOST:/opt/secured-guard/
        
        # Build e subir containers
        sshpass -p "$VPS_PASSWORD" ssh -p $VPS_PORT -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "cd /opt/secured-guard && docker-compose -f deploy/docker-compose.ci-domains.yml up -d --build"
        
        # Verificar status
        sshpass -p "$VPS_PASSWORD" ssh -p $VPS_PORT -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "cd /opt/secured-guard && docker-compose -f deploy/docker-compose.ci-domains.yml ps"
        
        echo "✅ CI Environment deployed successfully!"
        echo "🌐 Access: https://ci.z7botsolutions.com.br"
