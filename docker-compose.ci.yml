version: '3.8'

# ========================================
# DOCKER COMPOSE APENAS PARA AMBIENTE CI
# ========================================

services:
  # ========================================
  # DATABASE CI
  # ========================================
  postgres-ci:
    image: postgres:15-alpine
    container_name: secured-guard-db-ci
    environment:
      POSTGRES_DB: secured_guard_ci
      POSTGRES_USER: secured_guard_ci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_CI:-4KaCiJc6an@7sgbdcid2025}
    ports:
      - "5432:5432"
    volumes:
      - /var/www/secured_guard/ci/postgres_data:/var/lib/postgresql/data
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secured_guard_ci"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # REDIS CACHE CI
  # ========================================
  redis-ci:
    image: redis:7-alpine
    container_name: secured-guard-redis-ci
    ports:
      - "6379:6379"
    volumes:
      - /var/www/secured_guard/ci/redis_data:/data
    networks:
      - secured-guard-ci-network
      - z7network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_ci_2025}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_ci_2025}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # BACKEND API CI
  # ========================================
  backend-ci:
    image: z7design/secured-guard-backend:ci
    container_name: secured-guard-backend-ci
    environment:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ci:5432/secured_guard_ci
      SPRING_DATASOURCE_USERNAME: secured_guard_ci
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_CI:-4KaCiJc6an@7sgbdcid2025}
      SPRING_REDIS_HOST: redis-ci
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_ci_2025}
      JWT_SECRET: ${JWT_SECRET:-jwt_secret_ci_2025_secure_key_256bits_minimum_required_by_hmac_sha}
      JWT_EXPIRATION: 604800000
      JWT_REFRESH_EXPIRATION: 2592000000
      UPLOAD_DIR: /var/www/secured_guard/ci/uploads
      LOGGING_FILE_PATH: /var/www/secured_guard/ci/logs/application.log
    ports:
      - "8081:8081"
    volumes:
      - /var/www/secured_guard/ci/uploads:/var/www/secured_guard/ci/uploads
      - /var/www/secured_guard/ci/logs:/var/www/secured_guard/ci/logs
    depends_on:
      postgres-ci:
        condition: service_healthy
      redis-ci:
        condition: service_healthy
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # DESABILITADO TRAEFIK - usando Nginx como proxy reverso
    labels:
      - "traefik.enable=false"

  # ========================================
  # EVOLUTION API (WhatsApp)
  # ========================================
  evolution-api-ci:
    image: atendai/evolution-api:v2.1.0
    container_name: evolution-api-ci
    ports:
      - "9000:8080"
    environment:
      # URL da Evolution API
      - SERVER_URL=https://evolution.z7botsolutions.com.br
      # Autenticação
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-B6D711FCDE4D4FD5936544120E713976}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      # Configurações de Sessão
      - LANGUAGE=pt-BR
      - CONFIG_SESSION_PHONE_CLIENT=SecuredGuard
      - CONFIG_SESSION_PHONE_NAME=chrome
      - CONFIG_SESSION_PHONE_VERSION=2.2413.51
      # QR Code
      - QRCODE_LIMIT=1902
      - QRCODE_COLOR=#000000
      # Database Configuration
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://secured_guard_ci:${POSTGRES_PASSWORD_CI:-4KaCiJc6an@7sgbdcid2025}@postgres-ci:5432/evolution_ci?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      # S3 Storage (desabilitado)
      - S3_ENABLED=false
      # Cache (DESABILITAR Redis - causa de loop)
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      # Configurações das instâncias
      - DEL_INSTANCE=false
      - DEL_TEMP_INSTANCES=false
      # Typebot e Chatwoot (desabilitados)
      - TYPEBOT_ENABLED=false
      - CHATWOOT_ENABLED=false
      # RabbitMQ (desabilitado)
      - RABBITMQ_ENABLED=false
      # Webhook
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      # Logs
      - LOG_LEVEL=INFO
      - LOG_COLOR=true
      # Puppeteer/Chromium (necessário para QR Code)
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=false
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
    volumes:
      - /var/www/secured_guard/ci/evolution_instances:/evolution/instances
      - /var/www/secured_guard/ci/holerites:/evolution/holerites
    depends_on:
      postgres-ci:
        condition: service_healthy
    networks:
      - secured-guard-ci-network
      - z7network
    # Memória compartilhada para Chromium/Puppeteer
    shm_size: 512mb
    # Permitir execução do Chromium sandbox
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution-ci.rule=Host(`evolution.z7botsolutions.com.br`)"
      - "traefik.http.routers.evolution-ci.entrypoints=websecure"
      - "traefik.http.routers.evolution-ci.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.evolution-ci.loadbalancer.server.port=8080"

  # ========================================
  # WHATSAPP SERVICE (Baileys)
  # ========================================
  whatsapp-service-ci:
    image: z7design/secured-guard-whatsapp:ci
    container_name: secured-guard-whatsapp-ci
    environment:
      PORT: 3333
      INSTANCE_KEY: securedguard_ci
      SESSION_DIR: /app/sessions
      WEBHOOK_URL: http://backend-ci:8081/api/whatsapp/webhook
      NODE_ENV: production
    ports:
      - "3333:3333"
    volumes:
      - /var/www/secured_guard/ci/whatsapp_sessions:/app/sessions
      - /var/www/secured_guard/ci/uploads:/app/uploads
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # Memória compartilhada para Chromium/Puppeteer
    shm_size: 256mb
    labels:
      - "traefik.enable=false"

  # ========================================
  # NGINX PROXY CI
  # ========================================
  nginx-ci:
    image: nginx:alpine
    container_name: secured-guard-nginx-ci
    ports:
      - "8082:80"
    volumes:
      - ./nginx/ci.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-ci
      - frontend-ci
    networks:
      - secured-guard-ci-network
      - z7network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-ci.rule=Host(`ci.z7botsolutions.com.br`)"
      - "traefik.http.routers.nginx-ci.entrypoints=websecure"
      - "traefik.http.routers.nginx-ci.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.nginx-ci.loadbalancer.server.port=80"
      # Middleware para permitir todos os métodos HTTP
      - "traefik.http.middlewares.nginx-ci-allowmethods.plugin.allowmethods.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD"
      # Middleware CORS permissivo
      - "traefik.http.middlewares.nginx-ci-cors.headers.accesscontrolalloworiginlistregex=.*"
      - "traefik.http.middlewares.nginx-ci-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD"
      - "traefik.http.middlewares.nginx-ci-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.nginx-ci-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.middlewares.nginx-ci-cors.headers.accesscontrolmaxage=3600"
      # Aplicar middleware
      - "traefik.http.routers.nginx-ci.middlewares=nginx-ci-cors"
      # Prioridade máxima
      - "traefik.http.routers.nginx-ci.priority=1000"

  # ========================================
  # FRONTEND CI
  # ========================================
  frontend-ci:
    image: z7design/secured-guard-frontend:ci
    container_name: secured-guard-frontend-ci
    environment:
      VITE_API_URL: https://ci.z7botsolutions.com.br/api
      VITE_WS_URL: wss://ci.z7botsolutions.com.br/ws
    ports:
      - "3000:80"
    depends_on:
      - backend-ci
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # DESABILITADO TRAEFIK - usando Nginx como proxy reverso
    labels:
      - "traefik.enable=false"

# ========================================
# VOLUMES CI (usando bind mounts)
# ========================================
# Os volumes são mapeados diretamente para /var/www/secured_guard/ci/

# ========================================
# NETWORKS CI
# ========================================
networks:
  secured-guard-ci-network:
    driver: bridge
    name: secured-guard-ci
  z7network:
    external: true
    name: z7network