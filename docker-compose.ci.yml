version: '3.8'

# ========================================
# DOCKER COMPOSE APENAS PARA AMBIENTE CI
# ========================================

services:
  # ========================================
  # DATABASE CI
  # ========================================
  postgres-ci:
    image: postgres:15-alpine
    container_name: secured-guard-db-ci
    env_file:
      - .env
    environment:
      POSTGRES_DB: secured_guard_ci
      POSTGRES_USER: secured_guard_ci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_CI:-4KaCiJc6an@7sgbdcid2025}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_ci:/var/lib/postgresql/data
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secured_guard_ci"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # REDIS CACHE CI
  # ========================================
  redis-ci:
    image: redis:7-alpine
    container_name: secured-guard-redis-ci
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - redis_data_ci:/data
    networks:
      - secured-guard-ci-network
      - z7network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_ci_2025}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_ci_2025}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # BACKEND API CI
  # ========================================
  backend-ci:
    image: z7design/secured-guard-backend:ci
    container_name: secured-guard-backend-ci
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ci:5432/secured_guard_ci
      SPRING_DATASOURCE_USERNAME: secured_guard_ci
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_CI:-4KaCiJc6an@7sgbdcid2025}
      SPRING_REDIS_HOST: redis-ci
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_ci_2025}
      JWT_SECRET: ${JWT_SECRET:-jwt_secret_ci_2025_secure_key_64bytes_minimum_required_for_hmac_sha512_algorithm_secure_extra_long_key}
      JWT_EXPIRATION: 604800000
      JWT_REFRESH_EXPIRATION: 2592000000
      UPLOAD_DIR: /var/www/secured_guard/ci/uploads
      LOGGING_FILE_PATH: /var/www/secured_guard/ci/logs/application.log
      # Email Configuration
      # Permitindo que as configurações venham do .env ou Github Secrets para o Google Workspace
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-planejamento@promovervigilancia.com.br}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-""}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-true}
      MAIL_SSL_ENABLE: ${MAIL_SSL_ENABLE:-false}
      MAIL_SOCKET_FACTORY: ${MAIL_SOCKET_FACTORY:-javax.net.ssl.SSLSocketFactory}
      MAIL_SOCKET_FACTORY_PORT: ${MAIL_SOCKET_FACTORY_PORT:-587}
      MAIL_CONNECTION_TIMEOUT: ${MAIL_CONNECTION_TIMEOUT:-10000}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-10000}
      MAIL_WRITE_TIMEOUT: ${MAIL_WRITE_TIMEOUT:-10000}
      MAIL_DEBUG: ${MAIL_DEBUG:-false}
      # WhatsApp — Agente multi-provedor (UAZAPI → Z-API → Evolution → Baileys)
      WHATSAPP_PROVIDER_ORDER: ${WHATSAPP_PROVIDER_ORDER:-evolution,uazapi,zapi,baileys}
      UAZAPI_ENABLED: ${UAZAPI_ENABLED:-false}
      UAZAPI_BASE_URL: ${UAZAPI_BASE_URL:-}
      UAZAPI_INSTANCE_TOKEN: ${UAZAPI_INSTANCE_TOKEN:-}
      UAZAPI_ADMIN_TOKEN: ${UAZAPI_ADMIN_TOKEN:-}
      ZAPI_ENABLED: ${ZAPI_ENABLED:-false}
      ZAPI_BASE_URL: ${ZAPI_BASE_URL:-https://api.z-api.io}
      ZAPI_INSTANCE_ID: ${ZAPI_INSTANCE_ID:-}
      ZAPI_INSTANCE_TOKEN: ${ZAPI_INSTANCE_TOKEN:-}
      ZAPI_CLIENT_TOKEN: ${ZAPI_CLIENT_TOKEN:-}
      EVOLUTION_API_ENABLED: ${EVOLUTION_API_ENABLED:-false}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api-ci:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-B6D711FCDE4D4FD5936544120E713976}
      EVOLUTION_API_INSTANCE: ${EVOLUTION_API_INSTANCE:-securedguard}
      BAILEYS_REST_URL: ${BAILEYS_REST_URL:-http://whatsapp-service-ci:3333}
      BAILEYS_ENABLED: ${BAILEYS_ENABLED:-true}
      BAILEYS_INSTANCE_KEY: ${BAILEYS_INSTANCE_KEY:-securedguard_ci}
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:+ExitOnOutOfMemoryError -XX:MaxMetaspaceSize=192m -Djava.security.egd=file:/dev/./urandom"
    mem_limit: 1280m
    ports:
      - "8081:8080"
    volumes:
      - uploads_ci:/var/www/secured_guard/ci/uploads
      - logs_ci:/var/www/secured_guard/ci/logs
    depends_on:
      postgres-ci:
        condition: service_healthy
      redis-ci:
        condition: service_healthy
      # WhatsApp não é dependência de startup - backend inicia mesmo se WhatsApp estiver em crash loop
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 600s
    restart: unless-stopped
    # DESABILITADO TRAEFIK - usando Nginx como proxy reverso
    labels:
      - "traefik.enable=false"

  # ========================================
  # EVOLUTION API (WhatsApp — provedor principal no CI)
  # ========================================
  evolution-api-ci:
    profiles:
      - whatsapp-evolution
    image: atendai/evolution-api:v2.1.1
    container_name: evolution-api-ci
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-https://evolution.z7botsolutions.com.br}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-B6D711FCDE4D4FD5936544120E713976}
      AUTHENTICATION_TYPE: apikey
      CONFIG_SESSION_PHONE_CLIENT: SecuredGuard
      CONFIG_SESSION_PHONE_NAME: chrome
      QRCODE_LIMIT: "30"
      DATABASE_ENABLED: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://backend-ci:8080/api/webhooks/whatsapp/evolution
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      LOG_LEVEL: ERROR
    volumes:
      - evolution_instances_ci:/evolution/instances
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution-ci-https.rule=Host(`evolution.z7botsolutions.com.br`)"
      - "traefik.http.routers.evolution-ci-https.entrypoints=websecure"
      - "traefik.http.routers.evolution-ci-https.tls=true"
      - "traefik.http.routers.evolution-ci-https.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.evolution-ci.loadbalancer.server.port=8080"
      - "traefik.docker.network=z7network"

  # ========================================
  # WHATSAPP SERVICE (Baileys — fallback)
  # ========================================
  whatsapp-service-ci:
    image: z7design/secured-guard-whatsapp:ci
    container_name: secured-guard-whatsapp-ci
    environment:
      PORT: 3333
      INSTANCE_KEY: securedguard_ci
      SESSION_DIR: /app/sessions
      WEBHOOK_URL: http://backend-ci:8080/api/webhooks/whatsapp/evolution
      NODE_ENV: production
    ports:
      - "3333:3333"
    volumes:
      - whatsapp_sessions_ci:/app/sessions
      - uploads_ci:/app/uploads
    depends_on:
      postgres-ci:
        condition: service_healthy
      redis-ci:
        condition: service_healthy
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3333/health || curl -f http://localhost:3333/instance/connectionState?key=securedguard_ci || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    # Memória compartilhada para Chromium/Puppeteer
    shm_size: 256mb
    labels:
      - "traefik.enable=false"

  # ========================================
  # NGINX PROXY CI
  # ========================================
  nginx-ci:
    image: nginx:alpine
    container_name: secured-guard-nginx-ci
    ports:
      - "8082:80"
    volumes:
      - ./nginx/ci.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # service_started: nginx sobe assim que backend/frontend iniciam (não espera healthy)
      # O script health-check-ci.sh faz polling até backend responder (Flyway pode demorar 5+ min)
      backend-ci:
        condition: service_started
      frontend-ci:
        condition: service_started
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-ci-https.rule=Host(`ci.z7botsolutions.com.br`)"
      - "traefik.http.routers.nginx-ci-https.entrypoints=websecure"
      - "traefik.http.routers.nginx-ci-https.tls=true"
      - "traefik.http.routers.nginx-ci-https.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.nginx-ci-https.service=nginx-ci-service"
      - "traefik.http.routers.nginx-ci-https.priority=2000"
      - "traefik.http.routers.nginx-ci-http.rule=Host(`ci.z7botsolutions.com.br`)"
      - "traefik.http.routers.nginx-ci-http.entrypoints=web"
      - "traefik.http.routers.nginx-ci-http.middlewares=redirect-https@file"
      - "traefik.http.routers.nginx-ci-http.priority=2000"
      - "traefik.http.services.nginx-ci-service.loadbalancer.server.port=80"
      - "traefik.docker.network=z7network"

  # ========================================
  # FRONTEND CI
  # ========================================
  frontend-ci:
    # Se precisar fazer build local na VPS, descomente as linhas abaixo e comente a linha 'image'
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile.prod
    #   args:
    #     VITE_API_URL: https://ci.z7botsolutions.com.br/api
    #     VITE_WS_URL: wss://ci.z7botsolutions.com.br/ws
    #     VITE_ENVIRONMENT: ci
    image: z7design/secured-guard-frontend:ci
    container_name: secured-guard-frontend-ci
    ports:
      - "3000:80"
    # Frontend SPA não depende do backend para servir - inicia em paralelo
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    # DESABILITADO TRAEFIK - usando Nginx como proxy reverso
    labels:
      - "traefik.enable=false"

# ========================================
# VOLUMES CI (usando volumes nomeados para WSL)
# ========================================
volumes:
  evolution_instances_ci:
    name: evolution_instances_ci
  postgres_data_ci:
    driver: local
  redis_data_ci:
    driver: local
  uploads_ci:
    driver: local
  logs_ci:
    driver: local
  whatsapp_sessions_ci:
    driver: local

# ========================================
# NETWORKS CI
# ========================================
networks:
  secured-guard-ci-network:
    driver: bridge
    name: secured-guard-ci
  z7network:
    external: true
    name: z7network
