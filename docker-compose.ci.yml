version: '3.8'

# ========================================
# DOCKER COMPOSE APENAS PARA AMBIENTE CI
# ========================================

services:
  # ========================================
  # DATABASE CI
  # ========================================
  postgres-ci:
    image: postgres:15-alpine
    container_name: secured-guard-db-ci
    environment:
      POSTGRES_DB: secured_guard_ci
      POSTGRES_USER: secured_guard_ci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_CI:-4KaCiJc6an@7sgbdcid2025}
    ports:
      - "5432:5432"
    volumes:
      - /var/www/secured_guard/ci/postgres_data:/var/lib/postgresql/data
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secured_guard_ci"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # REDIS CACHE CI
  # ========================================
  redis-ci:
    image: redis:7-alpine
    container_name: secured-guard-redis-ci
    ports:
      - "6379:6379"
    volumes:
      - /var/www/secured_guard/ci/redis_data:/data
    networks:
      - secured-guard-ci-network
      - z7network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_ci_2025}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_ci_2025}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # BACKEND API CI
  # ========================================
  backend-ci:
    image: z7design/secured-guard-backend:ci
    container_name: secured-guard-backend-ci
    environment:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ci:5432/secured_guard_ci
      SPRING_DATASOURCE_USERNAME: secured_guard_ci
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_CI:-4KaCiJc6an@7sgbdcid2025}
      SPRING_REDIS_HOST: redis-ci
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_ci_2025}
      JWT_SECRET: ${JWT_SECRET:-jwt_secret_ci_2025_secure_key_256bits_minimum_required_by_hmac_sha}
      JWT_EXPIRATION: 604800000
      JWT_REFRESH_EXPIRATION: 2592000000
      UPLOAD_DIR: /var/www/secured_guard/ci/uploads
      LOGGING_FILE_PATH: /var/www/secured_guard/ci/logs/application.log
    ports:
      - "8081:8081"
    volumes:
      - /var/www/secured_guard/ci/uploads:/var/www/secured_guard/ci/uploads
      - /var/www/secured_guard/ci/logs:/var/www/secured_guard/ci/logs
    depends_on:
      postgres-ci:
        condition: service_healthy
      redis-ci:
        condition: service_healthy
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-ci.rule=Host(`ci.z7botsolutions.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-ci.entrypoints=websecure"
      - "traefik.http.routers.backend-ci.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.backend-ci.loadbalancer.server.port=8081"
      # Permitir todos os métodos HTTP
      - "traefik.http.middlewares.backend-ci-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.backend-ci-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.backend-ci-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,PATCH,OPTIONS"
      - "traefik.http.middlewares.backend-ci-cors.headers.accesscontrolalloworiginlist=https://ci.z7botsolutions.com.br"
      - "traefik.http.middlewares.backend-ci-cors.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.routers.backend-ci.middlewares=backend-ci-headers,backend-ci-cors"

  # ========================================
  # FRONTEND CI
  # ========================================
  frontend-ci:
    image: z7design/secured-guard-frontend:ci
    container_name: secured-guard-frontend-ci
    environment:
      VITE_API_URL: https://ci.z7botsolutions.com.br/api
      VITE_WS_URL: wss://ci.z7botsolutions.com.br/ws
    ports:
      - "3000:80"
    depends_on:
      - backend-ci
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-ci.rule=Host(`ci.z7botsolutions.com.br`)"
      - "traefik.http.routers.frontend-ci.entrypoints=websecure"
      - "traefik.http.routers.frontend-ci.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.frontend-ci.loadbalancer.server.port=80"

# ========================================
# VOLUMES CI (usando bind mounts)
# ========================================
# Os volumes são mapeados diretamente para /var/www/secured_guard/ci/

# ========================================
# NETWORKS CI
# ========================================
networks:
  secured-guard-ci-network:
    driver: bridge
    name: secured-guard-ci
  z7network:
    external: true
    name: z7network