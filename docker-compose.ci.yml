version: '3.8'

# ========================================
# DOCKER COMPOSE APENAS PARA AMBIENTE CI
# ========================================

services:
  # ========================================
  # DATABASE CI
  # ========================================
  postgres-ci:
    image: postgres:15-alpine
    container_name: secured-guard-db-ci
    env_file:
      - .env
    environment:
      POSTGRES_DB: secured_guard_ci
      POSTGRES_USER: secured_guard_ci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_CI:-4KaCiJc6an@7sgbdcid2025}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_ci:/var/lib/postgresql/data
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secured_guard_ci"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # REDIS CACHE CI
  # ========================================
  redis-ci:
    image: redis:7-alpine
    container_name: secured-guard-redis-ci
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - redis_data_ci:/data
    networks:
      - secured-guard-ci-network
      - z7network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_ci_2025}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_ci_2025}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # BACKEND API CI
  # ========================================
  backend-ci:
    image: z7design/secured-guard-backend:ci
    container_name: secured-guard-backend-ci
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ci:5432/secured_guard_ci
      SPRING_DATASOURCE_USERNAME: secured_guard_ci
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_CI:-4KaCiJc6an@7sgbdcid2025}
      SPRING_REDIS_HOST: redis-ci
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_ci_2025}
      JWT_SECRET: ${JWT_SECRET:-jwt_secret_ci_2025_secure_key_64bytes_minimum_required_for_hmac_sha512_algorithm_secure_extra_long_key}
      JWT_EXPIRATION: 604800000
      JWT_REFRESH_EXPIRATION: 2592000000
      UPLOAD_DIR: /var/www/secured_guard/ci/uploads
      LOGGING_FILE_PATH: /var/www/secured_guard/ci/logs/application.log
      BAILEYS_REST_URL: http://whatsapp-service-ci:3333
      BAILEYS_ENABLED: ${BAILEYS_ENABLED:-true}
    ports:
      - "8081:8080"
    volumes:
      - uploads_ci:/var/www/secured_guard/ci/uploads
      - logs_ci:/var/www/secured_guard/ci/logs
    depends_on:
      postgres-ci:
        condition: service_healthy
      redis-ci:
        condition: service_healthy
      whatsapp-service-ci:
        condition: service_started
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s
    restart: unless-stopped
    # DESABILITADO TRAEFIK - usando Nginx como proxy reverso
    labels:
      - "traefik.enable=false"

  # ========================================
  # WHATSAPP SERVICE (Baileys)
  # ========================================
  whatsapp-service-ci:
    image: z7design/secured-guard-whatsapp:ci
    container_name: secured-guard-whatsapp-ci
    environment:
      PORT: 3333
      INSTANCE_KEY: securedguard_ci
      SESSION_DIR: /app/sessions
      WEBHOOK_URL: http://backend-ci:8080/api/whatsapp/webhook
      NODE_ENV: production
    ports:
      - "3333:3333"
    volumes:
      - whatsapp_sessions_ci:/app/sessions
      - uploads_ci:/app/uploads
    depends_on:
      postgres-ci:
        condition: service_healthy
      redis-ci:
        condition: service_healthy
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3333/health || curl -f http://localhost:3333/instance/connectionState?key=securedguard_ci || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    # Memória compartilhada para Chromium/Puppeteer
    shm_size: 256mb
    labels:
      - "traefik.enable=false"

  # ========================================
  # NGINX PROXY CI
  # ========================================
  nginx-ci:
    image: nginx:alpine
    container_name: secured-guard-nginx-ci
    ports:
      - "8082:80"
    volumes:
      - ./nginx/ci.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-ci:
        condition: service_started
      frontend-ci:
        condition: service_started
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Router HTTPS - usando labels como fallback se configuração dinâmica não funcionar
      - "traefik.http.routers.nginx-ci-https.rule=Host(`ci.z7botsolutions.com.br`)"
      - "traefik.http.routers.nginx-ci-https.entrypoints=websecure"
      - "traefik.http.routers.nginx-ci-https.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.nginx-ci-https.service=nginx-ci-service"
      - "traefik.http.routers.nginx-ci-https.priority=2000"
      # Router HTTP (redireciona para HTTPS)
      - "traefik.http.routers.nginx-ci-http.rule=Host(`ci.z7botsolutions.com.br`)"
      - "traefik.http.routers.nginx-ci-http.entrypoints=web"
      - "traefik.http.routers.nginx-ci-http.middlewares=redirect-https@docker"
      - "traefik.http.routers.nginx-ci-http.priority=2000"
      # Serviço
      - "traefik.http.services.nginx-ci-service.loadbalancer.server.port=80"
      # Middlewares CORS
      - "traefik.http.middlewares.nginx-ci-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD"
      - "traefik.http.middlewares.nginx-ci-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.nginx-ci-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.nginx-ci-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.routers.nginx-ci-https.middlewares=nginx-ci-cors@docker"

  # ========================================
  # FRONTEND CI
  # ========================================
  frontend-ci:
    # Se precisar fazer build local na VPS, descomente as linhas abaixo e comente a linha 'image'
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile.prod
    #   args:
    #     VITE_API_URL: https://ci.z7botsolutions.com.br/api
    #     VITE_WS_URL: wss://ci.z7botsolutions.com.br/ws
    #     VITE_ENVIRONMENT: ci
    image: z7design/secured-guard-frontend:ci
    container_name: secured-guard-frontend-ci
    ports:
      - "3000:80"
    depends_on:
      backend-ci:
        condition: service_started
    networks:
      - secured-guard-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # DESABILITADO TRAEFIK - usando Nginx como proxy reverso
    labels:
      - "traefik.enable=false"

# ========================================
# VOLUMES CI (usando volumes nomeados para WSL)
# ========================================
volumes:
  postgres_data_ci:
    driver: local
  redis_data_ci:
    driver: local
  uploads_ci:
    driver: local
  logs_ci:
    driver: local
  whatsapp_sessions_ci:
    driver: local

# ========================================
# NETWORKS CI
# ========================================
networks:
  secured-guard-ci-network:
    driver: bridge
    name: secured-guard-ci
  z7network:
    external: false
    driver: bridge
    name: z7network