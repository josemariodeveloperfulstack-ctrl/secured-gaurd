version: '3.8'

# ============================================
# SECURED GUARD - AMBIENTE PRODUÇÃO
# Nomenclatura: secured-guard-prod-*
# Portas: 5435 (DB), 6382 (Redis), 8086 (Backend), 3003 (Frontend), 3336 (WhatsApp)
# ⚠️  ATENÇÃO: Sempre use secrets e .env para senhas!
# ============================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: secured-guard-prod-db
    hostname: secured-guard-prod-db
    environment:
      POSTGRES_DB: secured_guard
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - secured-guard-prod-db-data:/var/lib/postgresql/data
      - ./seeds/schema:/docker-entrypoint-initdb.d/01-schema:ro
      - ./seeds/common:/docker-entrypoint-initdb.d/02-common:ro
      - ./seeds/prod:/docker-entrypoint-initdb.d/03-prod:ro
      - ./backups:/backups
    networks:
      - secured-guard-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d secured_guard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: secured-guard-prod-redis
    hostname: secured-guard-prod-redis
    ports:
      - "6382:6379"
    volumes:
      - secured-guard-prod-redis-data:/data
    networks:
      - secured-guard-prod-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  whatsapp:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    image: secured-guard-whatsapp:prod
    container_name: secured-guard-prod-whatsapp
    hostname: secured-guard-prod-whatsapp
    environment:
      PORT: 3333
      INSTANCE_KEY: secured_guard_prod
      SESSION_DIR: /app/sessions
      NODE_ENV: production
    volumes:
      - secured-guard-prod-whatsapp-sessions:/app/sessions
    ports:
      - "3336:3333"
    networks:
      - secured-guard-prod-network
    dns:
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: secured-guard-backend:prod
    container_name: secured-guard-prod-backend
    hostname: secured-guard-prod-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://secured-guard-prod-db:5432/secured_guard
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: secured-guard-prod-redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      BAILEYS_ENABLED: "true"
      BAILEYS_REST_URL: http://secured-guard-prod-whatsapp:3333
      JWT_SECRET: ${JWT_SECRET}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8086:8083"
    networks:
      - secured-guard-prod-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: secured-guard-frontend:prod
    container_name: secured-guard-prod-frontend
    hostname: secured-guard-prod-frontend
    environment:
      VITE_API_URL: https://secured-guard.com.br
      VITE_ENV: production
    ports:
      - "3003:80"
    networks:
      - secured-guard-prod-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  secured-guard-prod-db-data:
    name: secured-guard-prod-db-data
  secured-guard-prod-redis-data:
    name: secured-guard-prod-redis-data
  secured-guard-prod-whatsapp-sessions:
    name: secured-guard-prod-whatsapp-sessions

networks:
  secured-guard-prod-network:
    name: secured-guard-prod-network
    driver: bridge





























