# Test Configuration
# Note: Database and Redis are configured dynamically via Testcontainers
# These values are overridden by @DynamicPropertySource in integration tests

# Disable MinIO for tests
minio.enabled=false
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket.pages=pages-bucket
minio.bucket.unified=unified-bucket

# Disable Gemini for tests
gemini.api.enabled=false
gemini.api.url=https://test-api.com
gemini.api.key=test-key
gemini.api.timeout=30000

# Flyway - will use database from Testcontainers
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JPA Configuration for tests
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis - will be configured by Testcontainers
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

