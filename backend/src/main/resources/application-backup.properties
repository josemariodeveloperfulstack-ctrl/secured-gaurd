# ===================================================
# CONFIGURAÇÃO DE BACKUP - MÚLTIPLAS VPS
# ===================================================

# ===================================================
# BACKUP LOCAL (Mesmo servidor da aplicação)
# ===================================================
backup.local.enabled=true
backup.local.host=localhost
backup.local.port=5432
backup.local.database=secured_guard_backup
backup.local.username=${POSTGRES_USER:postgres}
backup.local.password=${POSTGRES_PASSWORD}
backup.local.path=/var/backups/secured-guard/local

# ===================================================
# BACKUP REMOTO - VPS 1 (Primeira VPS Remota)
# ===================================================
backup.remote.vps1.enabled=${BACKUP_VPS_ENABLED:true}
backup.remote.vps1.host=${BACKUP_VPS_HOST:192.168.1.100}
backup.remote.vps1.port=${BACKUP_VPS_PORT:22}
backup.remote.vps1.user=${BACKUP_VPS_USER:deploy}
backup.remote.vps1.ssh-key=${BACKUP_VPS_SSH_KEY:}
backup.remote.vps1.db-host=${BACKUP_DB_HOST:${backup.remote.vps1.host}}
backup.remote.vps1.db-port=${BACKUP_DB_PORT:5432}
backup.remote.vps1.db-name=${BACKUP_DB_NAME:secured_guard_backup}
backup.remote.vps1.db-user=${BACKUP_DB_USER:postgres}
backup.remote.vps1.db-password=${BACKUP_DB_PASSWORD}
backup.remote.vps1.path=/var/backups/secured-guard/remote

# ===================================================
# BACKUP REMOTO - VPS 2 (Segunda VPS - 62.169.27.98)
# ===================================================
backup.remote.vps2.enabled=${BACKUP_VPS2_ENABLED:true}
backup.remote.vps2.host=62.169.27.98
backup.remote.vps2.port=22
backup.remote.vps2.user=root
backup.remote.vps2.password=YdV0EJCuQ6mmH58
backup.remote.vps2.ssh-key=${BACKUP_VPS2_SSH_KEY:}
backup.remote.vps2.db-host=62.169.27.98
backup.remote.vps2.db-port=5432
backup.remote.vps2.db-name=vps_secured_guard_backup
backup.remote.vps2.db-user=postgres
backup.remote.vps2.db-password=YdV0EJCuQ6mmH58
backup.remote.vps2.path=/var/backups/secured-guard/vps2

# ===================================================
# CONFIGURAÇÕES GERAIS DE BACKUP
# ===================================================
# Retenção de backups (dias)
backup.retention.days=30

# Compressão
backup.compression.enabled=true
backup.compression.level=9

# Criptografia
backup.encryption.enabled=true
backup.encryption.algorithm=AES-256

# Checksum
backup.checksum.enabled=true
backup.checksum.algorithm=SHA-256

# Agendamento
# Formato: segundo minuto hora dia mês dia-da-semana
backup.schedule.full=0 0 2 * * SUN         # Domingo às 2h
backup.schedule.incremental=0 0 2 * * *     # Todo dia às 2h
backup.schedule.logs-only=0 0 0 * * *       # Todo dia à meia-noite

# Paralelismo (quantos backups simultâneos)
backup.parallel.enabled=true
backup.parallel.threads=3

# Timeout
backup.timeout.seconds=3600

# ===================================================
# NOTIFICAÇÕES DE BACKUP
# ===================================================
backup.notifications.enabled=true
backup.notifications.on-success=true
backup.notifications.on-failure=true
backup.notifications.channels=email,slack

# Email
backup.notifications.email.to=${BACKUP_NOTIFICATION_EMAIL:admin@seu-dominio.com}
backup.notifications.email.from=backup@seu-dominio.com

# Slack
backup.notifications.slack.webhook=${SLACK_WEBHOOK_URL:}
backup.notifications.slack.channel=#backups

# ===================================================
# MONITORAMENTO
# ===================================================
backup.monitoring.enabled=true
backup.monitoring.metrics.enabled=true
backup.monitoring.prometheus.enabled=true

# ===================================================
# OBSERVAÇÕES
# ===================================================
# - VPS 1: Backup principal (mesma rede ou VPS dedicada)
# - VPS 2: 62.169.27.98 - Backup offsite (redundância geográfica)
# - Local: Backup no mesmo servidor (acesso rápido)
# 
# ESTRATÉGIA DE BACKUP:
# 1. Backup FULL semanal (domingos 2h)
# 2. Backup INCREMENTAL diário (2h)
# 3. Backup LOGS diário (meia-noite)
# 4. Replicação para 3 destinos (Local + VPS1 + VPS2)
# 5. Retenção de 30 dias
# 6. Criptografia AES-256
# 7. Verificação de integridade SHA-256

