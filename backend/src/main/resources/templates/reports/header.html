<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{companyName}} - Relatório</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            font-size: 12px;
            line-height: 1.4;
            color: #333;
            background-color: #fff;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 2px solid #e74c3c;
            margin-bottom: 30px;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin-right: 20px;
            background: linear-gradient(135deg, #e74c3c 0%, #f39c12 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }
        
        .company-info {
            flex: 1;
        }
        
        .company-name {
            font-size: 28px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 5px;
        }
        
        .company-slogan {
            font-size: 14px;
            color: #f39c12;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .company-details {
            font-size: 11px;
            color: #666;
            line-height: 1.3;
        }
        
        .report-info {
            text-align: right;
            font-size: 11px;
            color: #666;
        }
        
        .report-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .report-date {
            font-size: 10px;
            color: #999;
        }
        
        @media print {
            body {
                margin: 0;
                padding: 15px;
            }
            
            .header {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-section">
            <div class="logo">P</div>
            <div class="company-info">
                <div class="company-name">{{companyName}}</div>
                <div class="company-slogan">{{companySlogan}}</div>
                <div class="company-details">
                    {{companyAddress}}<br>
                    Tel: {{companyPhone}} | Email: {{companyEmail}}<br>
                    CNPJ: {{companyCnpj}}
                </div>
            </div>
        </div>
        <div class="report-info">
            <div class="report-title">Relatório</div>
            <div class="report-date">{{reportDate}}</div>
        </div>
    </div>
