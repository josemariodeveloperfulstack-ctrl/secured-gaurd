<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Abastecimentos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #FFD700, #FF6B6B);
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #FFD700;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">P</div>
        <h1>Promover</h1>
        <p>Vigilância Patrimonial - LTDA</p>
        <h2>Relatório de Abastecimentos</h2>
    </div>
    
    <p><strong>Período:</strong> <span th:text="${period}">01/01/2025 a 31/12/2025</span></p>
    <p><strong>Data de Geração:</strong> <span th:text="${generationDate}">15/01/2025</span></p>
    <p><strong>Total de Registros:</strong> <span th:text="${totalRecords}">0</span></p>
    
    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Veículo</th>
                <th>Motorista</th>
                <th>Litros</th>
                <th>Valor Total</th>
                <th>Centro de Custo</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="record : ${records}">
                <td th:text="${#temporals.format(record.date, 'dd/MM/yyyy')}">01/01/2025</td>
                <td th:text="${record.vehiclePlate}">ABC-1234</td>
                <td th:text="${record.driver?.name ?: '-'}">João Silva</td>
                <td th:text="${#numbers.formatDecimal(record.quantity, 1, 2)}">50,00</td>
                <td th:text="${'R$ ' + #numbers.formatDecimal(record.cost, 1, 2)}">R$ 275,00</td>
                <td th:text="${record.costCenterName ?: '-'}">Administrativo</td>
            </tr>
        </tbody>
    </table>
    
    <p><strong>Total:</strong> <span th:text="${'R$ ' + #numbers.formatDecimal(totalCost, 1, 2)}">R$ 0,00</span></p>
</body>
</html>
