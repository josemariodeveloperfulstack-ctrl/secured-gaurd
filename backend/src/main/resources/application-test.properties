# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# CONFIGURAÇÃO PARA TESTES COM BAILEYS (TEMPORÁRIO)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# ⚠️  ATENÇÃO:
# - Use APENAS em ambiente de desenvolvimento/testes
# - NÃO usar em produção
# - Baileys NÃO é aprovado pela Meta
# - Migre para WhatsApp Cloud API antes de produção
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ===== MODO DE TESTE =====
whatsapp.test.mode=true
whatsapp.max.messages.per.day=0

# ===== NÚMEROS PERMITIDOS PARA TESTE =====
# Liste os números de teste separados por vírgula (opcional)
# Se vazio, permite qualquer número (limitado pelo max.messages.per.day)
# Formato: código país + DDD + número (sem espaços ou caracteres especiais)
whatsapp.test.numbers=5531999887766,5531988776655

# ===== BAILEYS (TEMPORÁRIO - APENAS TESTES) =====
baileys.enabled=true
baileys.rest.url=http://localhost:3333
baileys.rest.instance.key=test-securedguard
baileys.rest.token=

# ===== WHATSAPP CLOUD API (DESABILITADO EM TESTE) =====
# Deixe desabilitado durante testes com Baileys
# Habilite quando migrar para produção
whatsapp.cloud.api.enabled=false
# whatsapp.cloud.api.url=https://graph.facebook.com/v18.0
# whatsapp.cloud.api.phone.number.id=SEU_PHONE_NUMBER_ID
# whatsapp.cloud.api.access.token=SEU_ACCESS_TOKEN
# whatsapp.cloud.api.waba.id=SEU_WABA_ID

# ===== DATABASE (usar H2 para testes se preferir) =====
# Ou mantenha PostgreSQL de desenvolvimento
spring.datasource.url=jdbc:postgresql://localhost:5432/secured_guard_test
spring.datasource.username=postgres
spring.datasource.password=1234567

# ===== JWT CONFIGURATION =====
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=604800000
jwt.header=Authorization
jwt.prefix=Bearer
jwt.refreshTokenExpiration=604800000

# ===== FLYWAY (para banco de teste existente) =====
# Flyway habilitado para executar migrations automaticamente
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Ignorar validação de checksum (desenvolvimento/teste)
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

# ===== LOGS DETALHADOS =====
logging.level.com.z7design.secured_guard.service.BaileysRestService=DEBUG
logging.level.com.z7design.secured_guard.service.EnvioService=DEBUG
logging.level.com.z7design.secured_guard.config.WhatsAppTestConfig=INFO

# ===== CONFIGURAÇÃO DE EMAIL =====
# Email: securedguard@z7design.com.br
# Senha: sg@2025promover
# Servidor: mail.z7design.com.br:465 (SSL/TLS)
spring.mail.host=${MAIL_HOST:mail.z7design.com.br}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:securedguard@z7design.com.br}
spring.mail.password=${MAIL_PASSWORD:sg@2025promover}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2,TLSv1.3
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.from=SecuredGuard <securedguard@z7design.com.br>

