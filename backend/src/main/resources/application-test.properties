# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# CONFIGURAÇÃO PARA TESTES COM BAILEYS (TEMPORÁRIO)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# ⚠️  ATENÇÃO:
# - Use APENAS em ambiente de desenvolvimento/testes
# - NÃO usar em produção
# - Baileys NÃO é aprovado pela Meta
# - Migre para WhatsApp Cloud API antes de produção
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ===== MODO DE TESTE =====
whatsapp.test.mode=true
whatsapp.max.messages.per.day=0

# ===== NÚMEROS PERMITIDOS PARA TESTE =====
# Liste os números de teste separados por vírgula (opcional)
# Se vazio, permite qualquer número (limitado pelo max.messages.per.day)
# Formato: código país + DDD + número (sem espaços ou caracteres especiais)
whatsapp.test.numbers=5531999887766,5531988776655

# ===== BAILEYS (TEMPORÁRIO - APENAS TESTES) =====
baileys.enabled=true
baileys.rest.url=http://localhost:3333
baileys.rest.instance.key=test-securedguard
baileys.rest.token=

# ===== WHATSAPP CLOUD API (DESABILITADO EM TESTE) =====
# Deixe desabilitado durante testes com Baileys
# Habilite quando migrar para produção
whatsapp.cloud.api.enabled=false
# whatsapp.cloud.api.url=https://graph.facebook.com/v18.0
# whatsapp.cloud.api.phone.number.id=SEU_PHONE_NUMBER_ID
# whatsapp.cloud.api.access.token=SEU_ACCESS_TOKEN
# whatsapp.cloud.api.waba.id=SEU_WABA_ID

# ===== DATABASE (usar H2 para testes se preferir) =====
# Ou mantenha PostgreSQL de desenvolvimento
spring.datasource.url=jdbc:postgresql://localhost:5432/secured_guard_test
spring.datasource.username=postgres
spring.datasource.password=1234567

# ===== FLYWAY (para banco de teste existente) =====
# Flyway habilitado para executar migrations automaticamente
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Ignorar validação de checksum (desenvolvimento/teste)
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

# ===== LOGS DETALHADOS =====
logging.level.com.z7design.secured_guard.service.BaileysRestService=DEBUG
logging.level.com.z7design.secured_guard.service.EnvioService=DEBUG
logging.level.com.z7design.secured_guard.config.WhatsAppTestConfig=INFO

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# LEMBRETES:
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 1. Este perfil é APENAS para testes locais
# 2. Limite de 20 mensagens/dia (protege contra banimento)
# 3. Use chip descartável/pré-pago para testes
# 4. Migre para WhatsApp Cloud API antes de produção
# 5. Consulte: MIGRACAO_WHATSAPP_BUSINESS_API_OFICIAL.md
#
