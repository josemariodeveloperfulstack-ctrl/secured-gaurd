# ===================== CONFIGURAÇÃO DE DESENVOLVIMENTO =====================

# ===================== CONFIGURAÇÃO DE BANCO DE DADOS =====================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:secured_guard_dev}
spring.datasource.username=${POSTGRES_USER:postgressg}
spring.datasource.password=${POSTGRES_PASSWORD:dev_password_123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== CONFIGURAÇÃO DE SERVIDOR =====================
server.port=8081
server.address=0.0.0.0

# ===================== CONFIGURAÇÃO JWT =====================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:604800000}
jwt.header=Authorization
jwt.prefix=Bearer
jwt.refreshTokenExpiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===================== CONFIGURAÇÃO JPA =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================== CONFIGURAÇÃO FLYWAY =====================
spring.flyway.enabled=false

# ===================== CONFIGURAÇÃO DE LOGGING =====================
logging.level.root=INFO
logging.level.com.z7design.secured_guard=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# ===================== CONFIGURAÇÃO DE CORS =====================
# CORS já configurado no SecurityConfig

# ===================== CONFIGURAÇÃO DE EMAIL PARA DEV =====================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=dev@localhost
spring.mail.password=dev
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ===================== DESABILITAR RECURSOS OPCIONAIS =====================
spring.jpa.open-in-view=false
spring.data.redis.repositories.enabled=false