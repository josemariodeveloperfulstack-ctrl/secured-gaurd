# ===================== CONFIGURAÇÃO RECAPTCHA =====================
recaptcha.secret.key=${RECAPTCHA_SECRET_KEY:default_recaptcha_key_for_production}
recaptcha.verify.url=https://www.google.com/recaptcha/api/siteverify

# ===================== CONFIGURAÇÃO N8N WHATSAPP =====================
n8n.enabled=${N8N_ENABLED:false}
n8n.base-url=${N8N_BASE_URL}
n8n.whatsapp.provider=${N8N_WHATSAPP_PROVIDER:wppconnect}

# Agente WhatsApp — ordem de fallback em produção
whatsapp.agent.provider-order=${WHATSAPP_PROVIDER_ORDER:uazapi,zapi,evolution,baileys}
uazapi.enabled=${UAZAPI_ENABLED:false}
uazapi.base-url=${UAZAPI_BASE_URL:}
uazapi.instance-token=${UAZAPI_INSTANCE_TOKEN:}
zapi.enabled=${ZAPI_ENABLED:false}
zapi.instance-id=${ZAPI_INSTANCE_ID:}
zapi.instance-token=${ZAPI_INSTANCE_TOKEN:}
zapi.client-token=${ZAPI_CLIENT_TOKEN:}
evolution.api.enabled=${EVOLUTION_API_ENABLED:true}
evolution.api.url=${EVOLUTION_API_URL:https://evolution.z7botsolutions.com.br}
evolution.api.key=${EVOLUTION_API_KEY:}
evolution.api.instance=${EVOLUTION_API_INSTANCE:securedguard}
n8n.whatsapp.session-name=${N8N_SESSION_NAME:securedguard}
n8n.whatsapp.auto-start=${N8N_AUTO_START:false}

# ===================== CONFIGURAÇÃO DE SINCRONIZAÇÃO =====================
app.database.sync.enabled=false
app.database.sync.interval=300000

# ===================== E-MAIL MARKETING (imagens nos templates) =====================
# URL HTTPS pública desta API para <img src> no Gmail (ex.: https://securedguard.z7botsolutions.com.br sem barra final).
app.email.marketing.assets-base-url=${EMAIL_MARKETING_ASSETS_BASE_URL:https://securedguard.z7botsolutions.com.br}
# Opcional: se assets-base-url for localhost em algum perfil, o envio usa este fallback.
app.email.marketing.assets-base-url-fallback=${EMAIL_MARKETING_ASSETS_BASE_FALLBACK:}
app.email.marketing.tracking-base-url=${EMAIL_MARKETING_TRACKING_BASE_URL:https://securedguard.z7botsolutions.com.br}
