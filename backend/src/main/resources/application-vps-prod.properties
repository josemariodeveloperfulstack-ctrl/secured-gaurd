# ===================== CONFIGURAÇÃO RECAPTCHA =====================
recaptcha.secret.key=${RECAPTCHA_SECRET_KEY:default_recaptcha_key_for_production}
recaptcha.verify.url=https://www.google.com/recaptcha/api/siteverify

# ===================== CONFIGURAÇÃO N8N WHATSAPP =====================
n8n.enabled=${N8N_ENABLED:false}
n8n.base-url=${N8N_BASE_URL}
n8n.whatsapp.provider=${N8N_WHATSAPP_PROVIDER:wppconnect}
n8n.whatsapp.session-name=${N8N_SESSION_NAME:securedguard}
n8n.whatsapp.auto-start=${N8N_AUTO_START:false}

# ===================== CONFIGURAÇÃO DE SINCRONIZAÇÃO =====================
app.database.sync.enabled=false
app.database.sync.interval=300000
