# ===================== CONFIGURAÇÃO DE PRODUÇÃO SIMPLIFICADA =====================

# ===================== CONFIGURAÇÃO DE BANCO DE DADOS =====================
spring.datasource.url=jdbc:postgresql://postgres:5432/secured_guard
spring.datasource.username=secured_guard
spring.datasource.password=secured_guard_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== CONFIGURAÇÃO JPA PRODUÇÃO =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================== CONFIGURAÇÃO DE LOGGING =====================
logging.level.root=WARN
logging.level.com.z7design.secured_guard=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR

# ===================== CONFIGURAÇÃO JWT =====================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=604800000
jwt.header=Authorization
jwt.prefix=Bearer
jwt.refreshTokenExpiration=604800000

# ===================== CONFIGURAÇÃO ACTUATOR =====================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ===================== CONFIGURAÇÃO DE PERFORMANCE =====================
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# ===================== CONFIGURAÇÃO DE EMAIL (DESABILITADA) =====================
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ===================== CONFIGURAÇÃO SSL (DESABILITADA) =====================
server.ssl.enabled=false

# ===================== CONFIGURAÇÃO RECAPTCHA (DESABILITADA) =====================
recaptcha.secret.key=

# ===================== CONFIGURAÇÃO N8N WHATSAPP (DESABILITADA) =====================
n8n.enabled=false
n8n.base-url=
n8n.whatsapp.provider=wppconnect
n8n.whatsapp.session-name=securedguard
n8n.whatsapp.auto-start=false
