# ===================== CONFIGURAÇÕES DE BANCO DE DADOS PARA DESENVOLVIMENTO LOCAL =====================
# IMPORTANTE: Ajuste essas configurações conforme seu ambiente PostgreSQL local
# Você pode sobrescrever usando variáveis de ambiente:
# - SPRING_DATASOURCE_URL
# - SPRING_DATASOURCE_USERNAME  
# - SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/secured_guard_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234567}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações HikariCP para ambiente local
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# ===================== CONFIGURAÇÕES DE EMAIL PARA DESENVOLVIMENTO LOCAL =====================
# Configurações de email do Z7Design
# Email: securedguard@z7design.com.br
# Senha: D8rKeqSFZfaS$(y7
# 
# OPÇÕES DE CONEXÃO:
# 1. Porta 465 (SSL direto) - Recomendado se não houver bloqueio de firewall
# 2. Porta 587 (STARTTLS) - Mais compatível, menos bloqueada por firewalls
# 
# NOTA: Para desenvolvimento local, você pode sobrescrever usando variáveis de ambiente:
# - MAIL_HOST
# - MAIL_PORT (465 ou 587)
# - MAIL_USERNAME
# - MAIL_PASSWORD
# - MAIL_STARTTLS_ENABLE (true para porta 587, false para porta 465)
# - MAIL_SSL_ENABLE (true para porta 465, false para porta 587)
# 
# EXEMPLO: Usar porta 587 (STARTTLS) - menos bloqueada:
# export MAIL_PORT=587
# export MAIL_STARTTLS_ENABLE=true
# export MAIL_SSL_ENABLE=false
#
spring.mail.host=${MAIL_HOST:mail.z7design.com.br}
# Usar porta 465 (SSL direto) - mesma configuração do CI
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:securedguard@z7design.com.br}
spring.mail.password=${MAIL_PASSWORD:D8rKeqSFZfaS$(y7}
spring.mail.properties.mail.smtp.auth=true
# Para porta 465: SSL habilitado, STARTTLS desabilitado
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2,TLSv1.3
# SocketFactory para porta 465 (SSL direto)
spring.mail.properties.mail.smtp.socketFactory.class=${MAIL_SOCKET_FACTORY:javax.net.ssl.SSLSocketFactory}
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_SOCKET_FACTORY_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.fallback=false
# Timeouts aumentados para desenvolvimento local (30 segundos)
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:30000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:30000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:30000}
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}
spring.mail.properties.mail.smtp.from=SecuredGuard <securedguard@z7design.com.br>

