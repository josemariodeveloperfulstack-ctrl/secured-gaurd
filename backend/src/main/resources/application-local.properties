# ===================== CONFIGURAÇÕES DE BANCO DE DADOS PARA DESENVOLVIMENTO LOCAL =====================
# IMPORTANTE: Ajuste essas configurações conforme seu ambiente PostgreSQL local
# Você pode sobrescrever usando variáveis de ambiente:
# - SPRING_DATASOURCE_URL
# - SPRING_DATASOURCE_USERNAME  
# - SPRING_DATASOURCE_PASSWORD
#
# Se a app falhar com "Failed to configure a DataSource", verifique se SPRING_DATASOURCE_URL
# não está definida vazia no sistema (isso sobrescreve o default). No PowerShell: Get-ChildItem Env:SPRING*
spring.datasource.url=jdbc:postgresql://localhost:5432/secured_guard_test
spring.datasource.username=postgres
spring.datasource.password=1234567
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações HikariCP para ambiente local
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# ===================== CONFIGURAÇÕES DE EMAIL PARA DESENVOLVIMENTO LOCAL =====================
# MODO MOCK: Se true, apenas loga o email no console (evita 500 quando SMTP não está configurado)
# Para envio real, defina app.email.mock=false e configure SMTP
app.email.mock=true

# Configurações de email do Z7Design
# Email: securedguard@z7design.com.br
# Senha: D8rKeqSFZfaS$(y7
# 
# OPÇÕES DE CONEXÃO:
# 1. Porta 465 (SSL direto) - Recomendado se não houver bloqueio de firewall
# 2. Porta 587 (STARTTLS) - Mais compatível, menos bloqueada por firewalls
# 
# NOTA: Para desenvolvimento local, você pode sobrescrever usando variáveis de ambiente:
# - MAIL_HOST
# - MAIL_PORT (465 ou 587)
# - MAIL_USERNAME
# - MAIL_PASSWORD
# - MAIL_STARTTLS_ENABLE (true para porta 587, false para porta 465)
# - MAIL_SSL_ENABLE (true para porta 465, false para porta 587)
# 
# EXEMPLO: Usar porta 587 (STARTTLS) - menos bloqueada:
# export MAIL_PORT=587
# export MAIL_STARTTLS_ENABLE=true
# export MAIL_SSL_ENABLE=false
#
spring.mail.host=${MAIL_HOST:186.209.113.105}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:securedguard@z7design.com.br}
spring.mail.password=${MAIL_PASSWORD:D8rKeqSFZfaS$(y7}
spring.mail.properties.mail.smtp.auth=true
# Para porta 465: SSL habilitado, STARTTLS desabilitado
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2,TLSv1.3
# SocketFactory para porta 465 (SSL direto)
spring.mail.properties.mail.smtp.socketFactory.class=${MAIL_SOCKET_FACTORY:javax.net.ssl.SSLSocketFactory}
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_SOCKET_FACTORY_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.fallback=false
# Timeouts aumentados para desenvolvimento local (30 segundos)
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:30000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:30000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:30000}
spring.mail.properties.mail.debug=${MAIL_DEBUG:true}
spring.mail.properties.mail.smtp.from=Promover <securedguard@z7design.com.br>

# Flyway Configuration
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true

# ===================== WHATSAPP — DESENVOLVIMENTO LOCAL (Windows) =====================
# Provedor padrão: Evolution API (https://evolution.z7botsolutions.com.br)
# 1) Defina EVOLUTION_API_KEY (mesma apikey da Evolution)
# 2) Reinicie o backend com profile local
# 3) Tela Conexão WhatsApp → Gerar QR Code
# Fallback: Baileys local (docker compose -f docker-compose.local.yml up -d whatsapp)
whatsapp.agent.provider-order=${WHATSAPP_PROVIDER_ORDER:evolution,baileys}
evolution.api.enabled=${EVOLUTION_API_ENABLED:true}
evolution.api.url=${EVOLUTION_API_URL:https://evolution.z7botsolutions.com.br}
# Mesma AUTHENTICATION_API_KEY da Evolution (evolution-portainer-stack.yml). Sobrescreva com EVOLUTION_API_KEY se necessário.
evolution.api.key=${EVOLUTION_API_KEY:B6D711FCDE4D4FD5936544120E713976}
evolution.api.instance=${EVOLUTION_API_INSTANCE:securedguard}
baileys.enabled=${BAILEYS_ENABLED:true}
baileys.rest.url=${BAILEYS_REST_URL:http://localhost:3333}
baileys.rest.instance.key=${BAILEYS_INSTANCE_KEY:secured_guard_local}
baileys.rest.token=${BAILEYS_REST_TOKEN:}
uazapi.enabled=${UAZAPI_ENABLED:false}
zapi.enabled=${ZAPI_ENABLED:false}
# IA do agente (opcional)
gemini.api.enabled=${GEMINI_API_ENABLED:false}
whatsapp.agent.ai.enabled=${WHATSAPP_AGENT_AI_ENABLED:false}

# ===================== E-MAIL MARKETING — RASTREAMENTO (aberturas / cliques) =====================
# Em localhost o Gmail/Outlook NÃO conseguem carregar pixel em http://localhost — use URL pública:
#   1) ngrok: ngrok http 8083  →  EMAIL_MARKETING_TRACKING_BASE_URL=https://xxxx.ngrok-free.app
#   2) ou use o CI: https://ci.z7botsolutions.com.br
# Sem URL pública, os e-mails saem SEM pixel de abertura e links rastreados.
# Ver: docs/EMAIL_MARKETING_RASTREAMENTO.md
app.email.marketing.tracking-base-url=${EMAIL_MARKETING_TRACKING_BASE_URL:}
app.email.marketing.assets-base-url=${EMAIL_MARKETING_ASSETS_BASE_URL:}
# Gmail/Outlook não carregam imagens em localhost — em dev use URL pública (ex.: produção ou ngrok)
app.email.marketing.assets-base-url-fallback=${EMAIL_MARKETING_ASSETS_BASE_FALLBACK:https://securedguard.z7botsolutions.com.br}

# DevTools restart quebra o contexto Spring ao recompilar (DataSource fica indisponível).
# Reinicie manualmente no IDE após alterações no backend.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Frontend local: npm run dev em frontend/ → https://localhost:3000 (certificados em frontend/certs/)
# Para HTTP: VITE_USE_HTTPS=false npm run dev
app.local.ensure-dev-credentials=true

# CID-11 OMS (opcional). Sem isso, autocomplete usa catálogo CID-10 local (~12k códigos).
