# ===================== CONFIGURAÇÕES DE EMAIL PARA DESENVOLVIMENTO LOCAL =====================
# Este arquivo pode ser usado para desenvolvimento local quando o servidor SMTP padrão não está acessível
# 
# OPÇÃO 1: Usar porta 587 com STARTTLS (mais comum em desenvolvimento)
# Descomente as linhas abaixo e ajuste conforme necessário:
#
# spring.mail.host=mail.z7design.com.br
# spring.mail.port=587
# spring.mail.username=securedguard@z7design.com.br
# spring.mail.password=sg@2025promover
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.starttls.required=true
# spring.mail.properties.mail.smtp.ssl.enable=false
# spring.mail.properties.mail.smtp.connectiontimeout=30000
# spring.mail.properties.mail.smtp.timeout=30000
# spring.mail.properties.mail.smtp.writetimeout=30000
# spring.mail.properties.mail.debug=true
