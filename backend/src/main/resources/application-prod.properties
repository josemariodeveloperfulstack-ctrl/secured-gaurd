# ===================== CONFIGURAÇÃO DE PRODUÇÃO =====================

# ===================== CONFIGURAÇÃO DE BANCO DE DADOS =====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== BANCO REFLEXO =====================
spring.datasource.secondary.url=${DB_SECONDARY_URL}
spring.datasource.secondary.username=${DB_SECONDARY_USERNAME}
spring.datasource.secondary.password=${DB_SECONDARY_PASSWORD}
spring.datasource.secondary.driver-class-name=org.postgresql.Driver

# ===================== CONFIGURAÇÃO JPA PRODUÇÃO =====================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===================== CONFIGURAÇÃO FLYWAY (AMBIENTE PRODUÇÃO) =====================
# Configuração segura e rigorosa para produção
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===================== CONFIGURAÇÃO DE LOGGING =====================
logging.level.root=WARN
logging.level.com.z7design.secured_guard=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR

# ===================== CONFIGURAÇÃO DE SEGURANÇA =====================
server.ssl.enabled=false
# server.ssl.key-store=${SSL_KEYSTORE_PATH}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12

# ===================== CONFIGURAÇÃO JWT =====================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:604800000}
jwt.header=Authorization
jwt.prefix=Bearer
jwt.refreshTokenExpiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===================== CONFIGURAÇÃO ACTUATOR =====================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ===================== CONFIGURAÇÃO DE SERVIDOR =====================
server.port=8080

# ===================== CONFIGURAÇÃO DE PERFORMANCE =====================
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

