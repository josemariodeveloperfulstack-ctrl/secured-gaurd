# ===================== CONFIGURAÇÃO PRINCIPAL =====================
spring.application.name=secured-guard

# ===================== CONFIGURAÇÃO DE PERFIL =====================
# Define o perfil ativo via variável/prop: SPRING_PROFILES_ACTIVE. Padrão: test
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===================== CONFIGURAÇÃO DE REFERÊNCIAS CIRCULARES =====================
# Permite referências circulares temporariamente para resolver dependência entre SecurityConfig e JwtAuthenticationFilter
spring.main.allow-circular-references=true

# ===================== CONFIGURAÇÕES COMUNS =====================

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.drop_source=none
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.create_source=none
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.drop_action=none
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.create_action=none

# Server Configuration
server.port=8083
server.address=0.0.0.0
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=604800000
jwt.header=Authorization
jwt.prefix=Bearer
jwt.refreshTokenExpiration=604800000

# Configurações de servidor
server.tomcat.max-threads=200
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.max-keep-alive-requests=100
server.tomcat.keep-alive-timeout=20000
server.tomcat.relaxed-query-chars=[,]
server.tomcat.relaxed-path-chars=[,]

# Configurações de upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# Configurações de cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# Configurações de banco de dados
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Configurações de JPA
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Configurações de memória
spring.jvm.memory.initial=256m
spring.jvm.memory.max=1024m

# ===================== CONFIGURAÇÕES FLYWAY =====================
# Flyway está habilitado por padrão, mas vamos garantir que está configurado
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

# Configurações de segurança
spring.security.filter.order=10
spring.security.filter.dispatcher-types=REQUEST,ASYNC,ERROR

# Configurações de compressão
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Configurações de timeout
spring.mvc.async.request-timeout=300000

# ===================== CONFIGURAÇÕES REDIS =====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ===================== CONFIGURAÇÕES GEMINI API =====================
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.enabled=${GEMINI_API_ENABLED:false}
gemini.api.model=${GEMINI_API_MODEL:gemini-pro-vision}
gemini.api.timeout=30000
gemini.api.max-retries=3

# ===================== CONFIGURAÇÕES MINIO/S3 =====================
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.pages=${MINIO_BUCKET_PAGES:document-pages}
minio.bucket.unified=${MINIO_BUCKET_UNIFIED:unified-documents}
minio.enabled=${MINIO_ENABLED:false}

# ===================== CONFIGURAÇÕES DE LOGGING =====================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===================== CONFIGURAÇÕES DE EMAIL =====================
# Configurações de Email - Z7Design
# Email: securedguard@z7design.com.br
# Senha: sg@2025promover
# 
# NOTA: Para desenvolvimento local, se a porta 465 estiver bloqueada, tente:
# - Porta 587 com STARTTLS (altere MAIL_PORT=587 e use starttls.enable=true)
# - Ou use Gmail SMTP (smtp.gmail.com:587) com senha de app
spring.mail.host=${MAIL_HOST:mail.z7design.com.br}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:securedguard@z7design.com.br}
spring.mail.password=${MAIL_PASSWORD:D8rKeqSFZfaS$(y7}
spring.mail.properties.mail.smtp.auth=true
# Configuração padrão: porta 465 com SSL direto
# Para usar porta 587 com STARTTLS, defina: MAIL_PORT=587, MAIL_STARTTLS_ENABLE=true, MAIL_SSL_ENABLE=false
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2,TLSv1.3
# SocketFactory apenas para porta 465 (SSL direto) - não usar com porta 587
# Se MAIL_PORT=465, defina: MAIL_SOCKET_FACTORY=javax.net.ssl.SSLSocketFactory e MAIL_SOCKET_FACTORY_PORT=465
# Se MAIL_PORT=587, deixe vazio (STARTTLS não usa socketFactory)
spring.mail.properties.mail.smtp.socketFactory.class=${MAIL_SOCKET_FACTORY:javax.net.ssl.SSLSocketFactory}
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_SOCKET_FACTORY_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.fallback=false
# Timeouts aumentados para evitar problemas de conexão
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:60000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:60000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:60000}
spring.mail.properties.mail.debug=${MAIL_DEBUG:true}
spring.mail.properties.mail.smtp.from=SecuredGuard <securedguard@z7design.com.br>

app.upload.base-dir=uploads
app.file.upload-dir=uploads/maintenance

