# ===================== CONFIGURAÇÃO PRINCIPAL =====================
spring.application.name=secured-guard

# Flyway Configuration
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# ===================== CONFIGURAÇÃO DE PERFIL =====================
# Define o perfil ativo via variável/prop: SPRING_PROFILES_ACTIVE. Padrão: local
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===================== DATASOURCE (base) =====================
# Garante url/driver mesmo se application-{profile}.properties não for aplicado no arranque.
# Se SPRING_DATASOURCE_URL estiver definida vazia no ambiente, remova-a ou defina a URL completa.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/secured_guard_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234567}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== CONFIGURAÇÃO DE REFERÊNCIAS CIRCULARES =====================
# Permite referências circulares temporariamente para resolver dependência entre SecurityConfig e JwtAuthenticationFilter
spring.main.allow-circular-references=true

# ===================== CONFIGURAÇÕES COMUNS =====================

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.drop_source=none
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.create_source=none
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.drop_action=none
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.create_action=none

# Server Configuration
server.port=${SERVER_PORT:8083}
server.address=0.0.0.0
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=604800000
jwt.header=Authorization
jwt.prefix=Bearer
jwt.refreshTokenExpiration=604800000

# Configurações de servidor
server.tomcat.max-threads=200
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.max-keep-alive-requests=100
server.tomcat.keep-alive-timeout=20000
server.tomcat.relaxed-query-chars=[,]
server.tomcat.relaxed-path-chars=[,]

# Configurações de upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# Configurações de cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Configurações de banco de dados
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Configurações de JPA
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Configurações de memória
spring.jvm.memory.initial=256m
spring.jvm.memory.max=1024m

# ===================== CONFIGURAÇÕES FLYWAY =====================
# Flyway está habilitado por padrão, mas vamos garantir que está configurado
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=true

# Configurações de segurança
spring.security.filter.order=10
spring.security.filter.dispatcher-types=REQUEST,ASYNC,ERROR

# Configurações de compressão
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Configurações de timeout
spring.mvc.async.request-timeout=300000

# ===================== CONFIGURAÇÕES REDIS =====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ===================== CONFIGURAÇÕES GEMINI API =====================
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.enabled=${GEMINI_API_ENABLED:false}
gemini.api.model=${GEMINI_API_MODEL:gemini-pro-vision}
gemini.api.timeout=30000
gemini.api.max-retries=3

# ===================== CONFIGURAÇÕES MINIO/S3 =====================
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.pages=${MINIO_BUCKET_PAGES:document-pages}
minio.bucket.unified=${MINIO_BUCKET_UNIFIED:unified-documents}
minio.enabled=${MINIO_ENABLED:false}

# ===================== CONFIGURAÇÕES DE LOGGING =====================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===================== CONFIGURAÇÕES DE EMAIL =====================
# Configurações de Email - Z7Design
# Email: securedguard@z7design.com.br
# Senha: sg@2025promover
# 
# NOTA: Para desenvolvimento local, se a porta 465 estiver bloqueada, tente:
# - Porta 587 com STARTTLS (altere MAIL_PORT=587 e use starttls.enable=true)
# - Ou use Gmail SMTP (smtp.gmail.com:587) com senha de app
spring.mail.host=${MAIL_HOST:mail.z7design.com.br}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:securedguard@z7design.com.br}
spring.mail.password=${MAIL_PASSWORD:D8rKeqSFZfaS$(y7}
spring.mail.properties.mail.smtp.auth=true
# Configuração padrão: porta 465 com SSL direto
# Para usar porta 587 com STARTTLS, defina: MAIL_PORT=587, MAIL_STARTTLS_ENABLE=true, MAIL_SSL_ENABLE=false
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2,TLSv1.3
# SocketFactory apenas para porta 465 (SSL direto) - não usar com porta 587
# Se MAIL_PORT=465, defina: MAIL_SOCKET_FACTORY=javax.net.ssl.SSLSocketFactory e MAIL_SOCKET_FACTORY_PORT=465
# Se MAIL_PORT=587, deixe vazio (STARTTLS não usa socketFactory)
spring.mail.properties.mail.smtp.socketFactory.class=${MAIL_SOCKET_FACTORY:javax.net.ssl.SSLSocketFactory}
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_SOCKET_FACTORY_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.fallback=false
# Timeouts aumentados para evitar problemas de conexão
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:60000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:60000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:60000}
spring.mail.properties.mail.debug=${MAIL_DEBUG:true}
app.mail.brand-name=${MAIL_BRAND_NAME:Promover}
spring.mail.properties.mail.smtp.from=Promover <securedguard@z7design.com.br>

app.upload.base-dir=uploads
app.file.upload-dir=uploads/maintenance

# ===================== WHATSAPP - AGENTE MULTI-PROVEDOR =====================
# Ordem de fallback: se UAZAPI falhar, tenta Z-API, depois Evolution, depois Baileys
whatsapp.agent.provider-order=${WHATSAPP_PROVIDER_ORDER:uazapi,zapi,evolution,baileys}

# Agente IA: memória em banco, pausa quando humano assume
whatsapp.agent.ai.enabled=${WHATSAPP_AGENT_AI_ENABLED:true}
whatsapp.agent.ai.model=${WHATSAPP_AGENT_AI_MODEL:gemini-1.5-flash}
whatsapp.agent.context.max-messages=${WHATSAPP_AGENT_CONTEXT_MAX_MESSAGES:40}
whatsapp.agent.webhook.require-api-key=${WHATSAPP_WEBHOOK_REQUIRE_API_KEY:true}
whatsapp.agent.ai.system-prompt=${WHATSAPP_AGENT_SYSTEM_PROMPT:}

# UAZAPI (https://docs.uazapi.com) — defina UAZAPI_ENABLED=true e credenciais
uazapi.enabled=${UAZAPI_ENABLED:false}
uazapi.base-url=${UAZAPI_BASE_URL:}
uazapi.instance-token=${UAZAPI_INSTANCE_TOKEN:}
uazapi.admin-token=${UAZAPI_ADMIN_TOKEN:}

# Z-API (https://developer.z-api.io)
zapi.enabled=${ZAPI_ENABLED:false}
zapi.base-url=${ZAPI_BASE_URL:https://api.z-api.io}
zapi.instance-id=${ZAPI_INSTANCE_ID:}
zapi.instance-token=${ZAPI_INSTANCE_TOKEN:}
zapi.client-token=${ZAPI_CLIENT_TOKEN:}

# Evolution API v2
evolution.api.enabled=${EVOLUTION_API_ENABLED:true}
evolution.api.url=${EVOLUTION_API_URL:}
evolution.api.key=${EVOLUTION_API_KEY:}
evolution.api.instance=${EVOLUTION_API_INSTANCE:securedguard}

# Baileys REST (fallback local / CI)
baileys.enabled=${BAILEYS_ENABLED:true}
baileys.rest.url=${BAILEYS_REST_URL:http://localhost:3333}
baileys.rest.token=${BAILEYS_REST_TOKEN:}
baileys.rest.instance.key=${BAILEYS_INSTANCE_KEY:securedguard}
whatsapp.test.mode=true

# ===================== SENDGRID (campanhas + Event Webhook + Inbound Parse) =====================
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:}
sendgrid.from-name=${SENDGRID_FROM_NAME:Promover}
# Chave pública Ed25519 (base64, 32 bytes) do SendGrid Event Webhook — ver documentação Twilio/SendGrid
sendgrid.webhook.public-key-base64=${SENDGRID_WEBHOOK_VERIFICATION_KEY:}
# Em produção defina true e configure SENDGRID_WEBHOOK_VERIFICATION_KEY
sendgrid.webhook.require-signature=${SENDGRID_WEBHOOK_REQUIRE_SIGNATURE:false}
# Token opcional na URL do Inbound Parse (?token=) para evitar POSTs não autorizados
sendgrid.inbound.shared-secret=${SENDGRID_INBOUND_SECRET:}

# ===================== EMAIL MARKETING — fila de envio (Onda 2) =====================
# URL pública usada para montar o link de unsubscribe nos e-mails.
# Em desenvolvimento: http://localhost:8080
# Em produção: https://api.seudominio.com
app.email.unsubscribe.base-url=${EMAIL_UNSUBSCRIBE_BASE_URL:http://localhost:8080}
# URL pública absoluta para <img src> nos e-mails (logomarca e banner). Por omissão usa a própria API (ficheiros em classpath:/static/email-marketing/).
# Produção: https://api.seudominio.com ou CDN (HTTPS). Evite localhost nos envios reais — clientes de correio não acedem ao seu PC.
app.email.marketing.assets-base-url=${EMAIL_MARKETING_ASSETS_BASE_URL:http://localhost:${server.port}}
# Se a URL acima for localhost e os e-mails forem vistos fora da sua rede, defina um fallback HTTPS público (ex.: URL da API em produção).
app.email.marketing.assets-base-url-fallback=${EMAIL_MARKETING_ASSETS_BASE_FALLBACK:https://securedguard.z7botsolutions.com.br}
# URL pública para pixel de abertura e redirect de cliques (acessível pela internet).
app.email.marketing.tracking-base-url=${EMAIL_MARKETING_TRACKING_BASE_URL:${EMAIL_MARKETING_ASSETS_BASE_URL:http://localhost:${server.port}}}
# Destinatário do mailto "Solicitar apresentação" nos templates Promover.
app.email.marketing.presentation-mailto=${EMAIL_MARKETING_PRESENTATION_MAILTO:comercial@promovervigilancia.com.br}
# Link do botão verde "FALAR NO WHATSAPP" nos templates de marketing (wa.me com DDI 55, sem espaços).
app.email.marketing.whatsapp-url=${EMAIL_MARKETING_WHATSAPP_URL:https://wa.me/5531998224451}

# Habilita/desabilita o scheduler de despacho periódico
app.email.dispatch.enabled=${EMAIL_DISPATCH_ENABLED:true}
# Intervalo entre ticks do scheduler (ms)
app.email.dispatch.delay-ms=${EMAIL_DISPATCH_DELAY_MS:30000}
# Atraso inicial para o primeiro tick após startup (ms)
app.email.dispatch.initial-delay-ms=${EMAIL_DISPATCH_INITIAL_DELAY_MS:15000}

# Usuário "dono" padrão para leads criados automaticamente quando o destinatário
# manual/importado responde ou clica. Se a campanha tem createdBy, ele é preferido.
app.email.auto-lead.owner-username=${EMAIL_AUTO_LEAD_OWNER_USERNAME:}