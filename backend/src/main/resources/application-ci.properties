# ===== REDIS =====
spring.data.redis.host=${SPRING_REDIS_HOST:redis-ci}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:redis_ci_2025}
