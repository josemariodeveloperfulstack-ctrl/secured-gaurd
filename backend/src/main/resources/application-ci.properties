# =====================================================
# SECURED GUARD - PERFIL CI (Integração Contínua)
# =====================================================

# ===== APLICAÇÃO =====
spring.application.name=Secured Guard CI
server.port=8080
server.address=0.0.0.0
# Trust X-Forwarded-* headers from reverse proxy (Nginx/Traefik) using Tomcat's RemoteIpValve
# Native strategy is typically more reliable for nested proxy setups (Cloudflare -> Traefik -> Nginx -> Backend)
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=.*
server.tomcat.remoteip.trusted-proxies=.*
server.tomcat.use-relative-redirects=true
server.tomcat.redirect-context-root=false
server.tomcat.remoteip.port-header=x-forwarded-port
server.tomcat.remoteip.host-header=x-forwarded-host

# Path Matching (Spring Boot 3 default is false, setting to true can help with proxy normalization)
spring.mvc.pathmatch.trailing-slash-match=true

# Security Logging (Essential for debugging redirect loops in CI)
logging.level.org.springframework.security=DEBUG
logging.level.com.z7design.secured_guard.security=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# ===== BANCO DE DADOS =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/secured_guard_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:secured_guard_ci}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:4KaCiJc6an@7sgbdcid2025}
spring.datasource.driver-class-name=org.postgresql.Driver
# Configurações de inicialização do datasource
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# ===== JPA/HIBERNATE =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Configurações para melhorar inicialização
# Removido: hibernate.connection.provider_disables_autocommit=true (causa conflito com HikariCP)
spring.jpa.open-in-view=false
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Incluir migrations padrão e migrations específicas do CI
spring.flyway.locations=classpath:db/migration,classpath:db/migration-ci
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
# Não continuar em caso de erro - melhor falhar explicitamente
spring.flyway.continue-on-error=false
spring.flyway.clean-disabled=true
# Configurações adicionais para garantir execução das migrations
# Permitir migrações fora de ordem para recuperar de migrações puladas
spring.flyway.out-of-order=true
spring.flyway.ignore-missing-migrations=false
spring.flyway.ignore-future-migrations=false
# Configurações para resolver problemas de lock do PostgreSQL
# Nota: Se o Flyway estiver travado em locks, execute no banco:
# SELECT pg_advisory_unlock_all();
# Timeout aumentado para migrations longas
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=10

# ===== UPLOADS =====
upload.dir=${UPLOAD_DIR:/var/www/secured-guard/ci/uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===== LOGS =====
logging.level.root=INFO
logging.level.com.z7design.secured_guard=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.flywaydb=INFO
logging.level.org.flywaydb.core.internal.command.DbMigrate=DEBUG
logging.file.name=${LOGGING_FILE_PATH:/var/www/secured-guard/ci/logs/application.log}
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===== CORS =====
cors.allowed-origins=https://ci.z7botsolutions.com.br,http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true

# ===== JWT =====
# HS512 requires at least 64 bytes (512 bits) - this key is 80 bytes for extra security
jwt.secret=${JWT_SECRET:jwt_secret_ci_2025_secure_key_64bytes_minimum_required_for_hmac_sha512_algorithm_secure}
jwt.expiration=${JWT_EXPIRATION:604800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# ===== SEGURANÇA =====
spring.security.filter.dispatcher-types=request,forward,error
spring.main.allow-circular-references=true

# ===== SERVIDOR =====
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
server.error.include-message=always
server.error.include-binding-errors=always

# ===== JACKSON =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# ===== DEVTOOLS DESABILITADO =====
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ===== ACTUATOR (HEALTH CHECK) =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.diskspace.enabled=true
management.health.db.enabled=true

# ===== TIMEZONE =====
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ===== WHATSAPP — AGENTE MULTI-PROVEDOR =====
whatsapp.agent.provider-order=${WHATSAPP_PROVIDER_ORDER:evolution,uazapi,zapi,baileys}
whatsapp.provider=evolution

# UAZAPI
uazapi.enabled=${UAZAPI_ENABLED:false}
uazapi.base-url=${UAZAPI_BASE_URL:}
uazapi.instance-token=${UAZAPI_INSTANCE_TOKEN:}
uazapi.admin-token=${UAZAPI_ADMIN_TOKEN:}

# Z-API
zapi.enabled=${ZAPI_ENABLED:false}
zapi.base-url=${ZAPI_BASE_URL:https://api.z-api.io}
zapi.instance-id=${ZAPI_INSTANCE_ID:}
zapi.instance-token=${ZAPI_INSTANCE_TOKEN:}
zapi.client-token=${ZAPI_CLIENT_TOKEN:}

# Evolution API (WhatsApp)
evolution.api.enabled=true
evolution.api.url=http://evolution-api-ci:8080
evolution.api.key=${EVOLUTION_API_KEY:-B6D711FCDE4D4FD5936544120E713976}
evolution.api.instance=securedguard

# ===== BAILEYS REST API (WhatsApp Alternative) =====
# No CI, usar o serviço whatsapp-service-ci que está rodando na porta 3333
# O serviço está definido no docker-compose.ci.yml como whatsapp-service-ci
# ⚠️ MODO DE TESTE: Habilitado para permitir uso do Baileys (não oficial)
whatsapp.test.mode=true
whatsapp.max.messages.per.day=0
baileys.rest.url=${BAILEYS_REST_URL:http://whatsapp-service-ci:3333}
baileys.enabled=${BAILEYS_ENABLED:true}
baileys.rest.token=${BAILEYS_REST_TOKEN:}
baileys.rest.instance.key=${BAILEYS_INSTANCE_KEY:securedguard_ci}

# ===== CONFIGURAÇÃO DE EMAIL CI =====
