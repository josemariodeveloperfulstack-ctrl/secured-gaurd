version: '3.8'

services:
  # PostgreSQL - CI
  postgres-ci:
    image: postgres:15-alpine
    container_name: secured-guard-postgres-ci
    environment:
      POSTGRES_DB: secured_guard_ci
      POSTGRES_USER: postgressg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_CI:-S7UGKd%bnKW0!lhBA#BRJLCd!IpXvsnx}
    volumes:
      - postgres_data_ci:/var/lib/postgresql/data
    networks:
      - secured-guard-network
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgressg"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis - CI
  redis-ci:
    image: redis:7-alpine
    container_name: secured-guard-redis-ci
    volumes:
      - redis_data_ci:/data
    networks:
      - secured-guard-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Backend - CI
  backend-ci:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: secured-guard-backend-ci
    environment:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ci:5432/secured_guard_ci
      SPRING_DATASOURCE_USERNAME: postgressg
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_CI:-S7UGKd%bnKW0!lhBA#BRJLCd!IpXvsnx}
      SPRING_REDIS_HOST: redis-ci
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xmx1g -Xms512m"
    volumes:
      - backend_logs_ci:/app/logs
      - backend_uploads_ci:/app/uploads
    depends_on:
      postgres-ci:
        condition: service_healthy
      redis-ci:
        condition: service_healthy
    networks:
      - secured-guard-network
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend - CI
  frontend-ci:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: secured-guard-frontend-ci
    environment:
      VITE_API_URL: https://ci.z7botsolutions.com.br/api
    depends_on:
      - backend-ci
    networks:
      - secured-guard-network
    ports:
      - "3002:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data_ci:
  redis_data_ci:
  backend_logs_ci:
  backend_uploads_ci:

networks:
  secured-guard-network:
    external: true
    name: secured-guard
