version: '3.8'

services:
  # ========================================
  # DATABASE
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: secured-guard-db-ci
    environment:
      POSTGRES_DB: secured_guard_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - secured-guard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # ========================================
  # REDIS CACHE
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: secured-guard-redis-ci
    networks:
      - secured-guard-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # ========================================
  # BACKEND API
  # ========================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: secured-guard-backend-ci
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/secured_guard_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secured-guard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      # Traefik labels para backend - CI
      - "traefik.enable=true"
      - "traefik.http.routers.secured-guard-api-ci.rule=Host(`ci.z7botsolutions.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.secured-guard-api-ci.entrypoints=websecure"
      - "traefik.http.routers.secured-guard-api-ci.tls.certresolver=letsencrypt"
      - "traefik.http.services.secured-guard-api-ci.loadbalancer.server.port=8080"
      - "traefik.docker.network=secured-guard-network"

  # ========================================
  # FRONTEND
  # ========================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: secured-guard-frontend-ci
    environment:
      VITE_API_URL: https://ci.z7botsolutions.com.br/api
      VITE_WS_URL: wss://ci.z7botsolutions.com.br/ws
    depends_on:
      - backend
    networks:
      - secured-guard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      # Traefik labels para frontend - CI
      - "traefik.enable=true"
      - "traefik.http.routers.secured-guard-web-ci.rule=Host(`ci.z7botsolutions.com.br`)"
      - "traefik.http.routers.secured-guard-web-ci.entrypoints=websecure"
      - "traefik.http.routers.secured-guard-web-ci.tls.certresolver=letsencrypt"
      - "traefik.http.services.secured-guard-web-ci.loadbalancer.server.port=5173"
      - "traefik.docker.network=secured-guard-network"

# ========================================
# NETWORKS
# ========================================
networks:
  secured-guard-network:
    driver: bridge
    external: false
