version: '3.8'

services:
  # PostgreSQL - Desenvolvimento
  postgres-dev:
    image: postgres:15-alpine
    container_name: secured-guard-postgres-dev
    environment:
      POSTGRES_DB: secured_guard_dev
      POSTGRES_USER: postgressg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEV:-S7UGKd%bnKW0!lhBA#BRJLCd!IpXvsnx}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - secured-guard-network
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgressg"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis - Desenvolvimento
  redis-dev:
    image: redis:7-alpine
    container_name: secured-guard-redis-dev
    volumes:
      - redis_data_dev:/data
    networks:
      - secured-guard-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Backend - Desenvolvimento
  backend-dev:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: secured-guard-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-dev:5432/secured_guard_dev
      SPRING_DATASOURCE_USERNAME: postgressg
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_DEV:-S7UGKd%bnKW0!lhBA#BRJLCd!IpXvsnx}
      SPRING_REDIS_HOST: redis-dev
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xmx1g -Xms512m"
    volumes:
      - backend_logs_dev:/app/logs
      - backend_uploads_dev:/app/uploads
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - secured-guard-network
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend - Desenvolvimento
  frontend-dev:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: secured-guard-frontend-dev
    environment:
      VITE_API_URL: https://dev.z7botsolutions.com.br/api
    depends_on:
      - backend-dev
    networks:
      - secured-guard-network
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data_dev:
  redis_data_dev:
  backend_logs_dev:
  backend_uploads_dev:

networks:
  secured-guard-network:
    external: true
    name: secured-guard
