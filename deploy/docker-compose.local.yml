version: '3.8'

# ========================================
# DOCKER COMPOSE PARA DESENVOLVIMENTO LOCAL
# Otimizado para Windows + Docker Desktop + WSL
# ========================================

services:
  # ========================================
  # DATABASE
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: secured-guard-db-local
    environment:
      POSTGRES_DB: secured_guard_dev
      POSTGRES_USER: postgressg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - secured-guard-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgressg"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # REDIS CACHE
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: secured-guard-redis-local
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    networks:
      - secured-guard-local
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # BACKEND API (DESENVOLVIMENTO)
  # ========================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: secured-guard-backend-local
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/secured_guard_dev
      SPRING_DATASOURCE_USERNAME: postgressg
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JAVA_OPTS: "-Xmx512m -Xms256m"
      # Configurações para desenvolvimento
      DEV_SHOW_SQL: "true"
      DEV_FORMAT_SQL: "true"
      DEV_HIBERNATE_DDL_AUTO: "update"
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app
      - backend_logs_local:/app/logs
      - backend_uploads_local:/app/uploads
      # Hot reload para desenvolvimento
      - ../backend/src:/app/src
      - ../backend/pom.xml:/app/pom.xml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secured-guard-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ========================================
  # FRONTEND (DESENVOLVIMENTO)
  # ========================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: secured-guard-frontend-local
    environment:
      VITE_API_URL: http://localhost:8080/api
      VITE_WS_URL: ws://localhost:8080/ws
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      # Hot reload para desenvolvimento
      - ../frontend/src:/app/src
      - ../frontend/package.json:/app/package.json
      - ../frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend
    networks:
      - secured-guard-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ========================================
  # NGINX (PROXY LOCAL)
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: secured-guard-nginx-local
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-local.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - secured-guard-local
    restart: unless-stopped

# ========================================
# VOLUMES
# ========================================
volumes:
  postgres_data_local:
    driver: local
  redis_data_local:
    driver: local
  backend_logs_local:
    driver: local
  backend_uploads_local:
    driver: local

# ========================================
# NETWORKS
# ========================================
networks:
  secured-guard-local:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
