events { worker_connections 1024; }

http {
  log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # Upstreams para cada ambiente
  upstream web-prod { server frontend-prod:80; }
  upstream api-prod { server backend-prod:8080; }
  
  upstream web-dev { server frontend-dev:80; }
  upstream api-dev { server backend-dev:8080; }
  
  upstream web-ci { server frontend-ci:80; }
  upstream api-ci { server backend-ci:8080; }
  
  upstream web-test { server frontend-test:80; }
  upstream api-test { server backend-test:8080; }

  # ========================================
  # PRODUÇÃO (securedguard.z7botsolutions.com.br)
  # ========================================
  server {
    listen 80;
    server_name securedguard.z7botsolutions.com.br;
    return 301 https://$server_name$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name securedguard.z7botsolutions.com.br;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    location /api/ { 
      proxy_pass http://api-prod; 
      proxy_set_header Host $host; 
      proxy_set_header X-Real-IP $remote_addr; 
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location / { 
      proxy_pass http://web-prod; 
      proxy_set_header Host $host; 
      proxy_set_header X-Real-IP $remote_addr; 
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ========================================
  # DESENVOLVIMENTO (dev.z7botsolutions.com.br)
  # ========================================
