services:
  # ========================================
  # DATABASE (CI/Test)
  # ========================================
  postgres-ci:
    image: postgres:15-alpine
    container_name: secured-guard-db-ci
    environment:
      POSTGRES_DB: secured_guard_ci
      POSTGRES_USER: secured_guard_ci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_CI}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "55432:5432"
    volumes:
      - postgres_data_ci:/var/lib/postgresql/data
    networks:
      - secured-guard-ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secured_guard_ci -d secured_guard_ci"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # REDIS CACHE (CI/Test)
  # ========================================
  redis-ci:
    image: redis:7-alpine
    container_name: secured-guard-redis-ci
    ports:
      - "6380:6379"
    volumes:
      - redis_data_ci:/data
    networks:
      - secured-guard-ci
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD_CI}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # BACKEND API (CI/Test)
  # ========================================
  backend-ci:
    image: ghcr.io/zmarioramos/secured-guard-backend:ci
    container_name: secured-guard-backend-ci
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ci:5432/secured_guard_ci
      SPRING_DATASOURCE_USERNAME: secured_guard_ci
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_CI}
      SPRING_REDIS_HOST: redis-ci
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD_CI}
      JWT_SECRET: ${JWT_SECRET_CI}
      # WhatsApp/Baileys REST API
      BAILEYS_REST_URL: http://whatsapp-service-ci:3333
      BAILEYS_INSTANCE_KEY: securedguard_ci
      # Configurações para CI
      LOG_LEVEL_ROOT: "INFO"
      LOG_LEVEL_APP: "DEBUG"
    ports:
      - "8081:8080"
    volumes:
      - backend_logs_ci:/app/logs
      - backend_uploads_ci:/app/uploads
    depends_on:
      postgres-ci:
        condition: service_healthy
      redis-ci:
        condition: service_healthy
    networks:
      - secured-guard-ci
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 180s
    restart: unless-stopped

  # ========================================
  # FRONTEND (CI/Test)
  # ========================================
  frontend-ci:
    image: ghcr.io/zmarioramos/secured-guard-frontend:ci
    container_name: secured-guard-frontend-ci
    environment:
      VITE_API_URL: https://ci.z7botsolutions.com.br/api
      VITE_WS_URL: wss://ci.z7botsolutions.com.br/ws
      NODE_ENV: production
      VITE_ENVIRONMENT: ci
    ports:
      - "5174:80"
    depends_on:
      - backend-ci
    networks:
      - secured-guard-ci
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ========================================
  # WHATSAPP SERVICE (Baileys REST API)
  # ========================================
  whatsapp-service-ci:
    image: ghcr.io/zmarioramos/secured-guard-whatsapp:ci
    container_name: whatsapp-service-ci
    environment:
      PORT: 3333
      INSTANCE_KEY: securedguard_ci
      SESSION_DIR: /app/sessions
    volumes:
      - whatsapp_sessions_ci:/app/sessions
    ports:
      - "3333:3333"
    networks:
      - secured-guard-ci
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  # ========================================
  # NGINX (CI/Test)
  # ========================================
  nginx-ci:
    image: nginx:alpine
    container_name: secured-guard-nginx-ci
    ports:
      - "8082:80"
    volumes:
      - ../nginx/ci.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend-ci
      - backend-ci
    networks:
      - secured-guard-ci
    restart: unless-stopped

# ========================================
# VOLUMES
# ========================================
volumes:
  postgres_data_ci:
    driver: local
  redis_data_ci:
    driver: local
  backend_logs_ci:
    driver: local
  backend_uploads_ci:
    driver: local
  whatsapp_sessions_ci:
    driver: local

# ========================================
# NETWORKS
# ========================================
networks:
  secured-guard-ci:
    name: secured-guard-ci