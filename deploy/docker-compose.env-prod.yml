version: '3.8'

services:
  # PostgreSQL - Produção
  postgres-prod:
    image: postgres:15-alpine
    container_name: secured-guard-postgres-prod
    environment:
      POSTGRES_DB: secured_guard_prod
      POSTGRES_USER: postgressg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD:-S7UGKd%bnKW0!lhBA#BRJLCd!IpXvsnx}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - secured-guard-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgressg"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis - Produção
  redis-prod:
    image: redis:7-alpine
    container_name: secured-guard-redis-prod
    volumes:
      - redis_data_prod:/data
    networks:
      - secured-guard-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Backend - Produção
  backend-prod:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: secured-guard-backend-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-prod:5432/secured_guard_prod
      SPRING_DATASOURCE_USERNAME: postgressg
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_PROD:-S7UGKd%bnKW0!lhBA#BRJLCd!IpXvsnx}
      SPRING_REDIS_HOST: redis-prod
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8081
      SPRING_FLYWAY_ENABLED: "false"
      JAVA_OPTS: "-Xmx1g -Xms512m"
    volumes:
      - backend_logs_prod:/app/logs
      - backend_uploads_prod:/app/uploads
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    networks:
      - secured-guard-network
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend - Produção
  frontend-prod:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: secured-guard-frontend-prod
    environment:
      VITE_API_URL: https://securedguard.z7botsolutions.com.br/api
    depends_on:
      - backend-prod
    networks:
      - secured-guard-network
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data_prod:
  redis_data_prod:
  backend_logs_prod:
  backend_uploads_prod:

networks:
  secured-guard-network:
    external: true
    name: secured-guard
