services:
  # ========================================
  # DATABASE (PROD)
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: secured-guard-db-prod
    environment:
      POSTGRES_DB: secured_guard_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "55434:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ../backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - secured-guard-prod
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # REDIS CACHE (PROD)
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: secured-guard-redis-prod
    ports:
      - "6382:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - secured-guard-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD_PROD}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # BACKEND API (PROD)
  # ========================================
  backend:
    image: z7design/secured-guard-backend:prod
    container_name: secured-guard-backend-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/secured_guard_prod
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_PROD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD_PROD}
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "30000"
      JWT_SECRET: ${JWT_SECRET_PROD}
      # WhatsApp/Baileys REST API
      BAILEYS_REST_URL: http://whatsapp-service-prod:3333
      BAILEYS_INSTANCE_KEY: securedguard
      LOG_LEVEL_ROOT: "INFO"
      LOG_LEVEL_APP: "INFO"
      # Email Configuration
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: "5000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: "5000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: "5000"
    ports:
      - "8084:8080"
    volumes:
      - backend_logs_prod:/app/logs
      - backend_uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secured-guard-prod
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8080/api/health" ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 300s
    restart: unless-stopped

  # ========================================
  # FRONTEND (PROD)
  # ========================================
  frontend:
    image: z7design/secured-guard-frontend:prod
    container_name: secured-guard-frontend-prod
    environment:
      VITE_API_URL: https://securedguard.z7botsolutions.com.br/api
      VITE_WS_URL: wss://securedguard.z7botsolutions.com.br/ws
      NODE_ENV: production
    ports:
      - "5176:80"
    depends_on:
      - backend
    networks:
      - secured-guard-prod
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ========================================
  # WHATSAPP SERVICE (Baileys REST API - PROD)
  # ========================================
  whatsapp-service:
    image: z7design/secured-guard-whatsapp:prod
    container_name: whatsapp-service-prod
    environment:
      PORT: 3333
      INSTANCE_KEY: securedguard
      SESSION_DIR: /app/sessions
    volumes:
      - whatsapp_sessions_prod:/app/sessions
      - ../backend/holerites:/app/holerites:ro
    ports:
      - "3335:3333"
    networks:
      - secured-guard-prod
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  # ========================================
  # NGINX (PROD) – rede z7network + labels Traefik para o proxy externo descobrir o serviço
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: secured-guard-nginx-prod
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx-prod.conf:/etc/nginx/nginx.conf
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - secured-guard-prod
      - z7network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.secured-guard-prod-https.rule=Host(`securedguard.z7botsolutions.com.br`) || Host(`portal.promovervigilancia.com.br`)"
      - "traefik.http.routers.secured-guard-prod-https.entrypoints=websecure"
      - "traefik.http.routers.secured-guard-prod-https.tls=true"
      - "traefik.http.routers.secured-guard-prod-https.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.secured-guard-prod-https.service=secured-guard-prod-service"
      - "traefik.http.routers.secured-guard-prod-https.priority=2000"
      - "traefik.http.routers.secured-guard-prod-http.rule=Host(`securedguard.z7botsolutions.com.br`) || Host(`portal.promovervigilancia.com.br`)"
      - "traefik.http.routers.secured-guard-prod-http.entrypoints=web"
      - "traefik.http.routers.secured-guard-prod-http.middlewares=redirect-https@docker"
      - "traefik.http.routers.secured-guard-prod-http.priority=2000"
      - "traefik.http.services.secured-guard-prod-service.loadbalancer.server.port=80"
      - "traefik.docker.network=z7network"
    restart: unless-stopped

# ========================================
# VOLUMES
# ========================================
volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  backend_logs_prod:
    driver: local
  backend_uploads_prod:
    driver: local
  whatsapp_sessions_prod:
    driver: local

# ========================================
# NETWORKS (secured-guard + z7network para Traefik descobrir o nginx)
# ========================================
networks:
  secured-guard-prod:
    external: true
    name: secured-guard
  z7network:
    external: true
    name: z7network
