services:
  # ========================================
  # DATABASE
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: secured-guard-db-prod
    environment:
      POSTGRES_DB: secured_guard_prod
      POSTGRES_USER: postgressg
      POSTGRES_PASSWORD: S7UGKd%bnKW0!lhBA#BRJLCd!IpXvsnx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ../scripts/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
      - ../backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d/migration:ro
    networks:
      - secured-guard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgressg}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # REDIS CACHE
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: secured-guard-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - secured-guard-network
    command: redis-server --appendonly yes --requirepass redis_secured_guard_2024
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secured_guard_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # BACKEND API
  # ========================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: secured-guard-backend-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/secured_guard_prod
      SPRING_DATASOURCE_USERNAME: postgressg
      SPRING_DATASOURCE_PASSWORD: S7UGKd%bnKW0!lhBA#BRJLCd!IpXvsnx
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: redis_secured_guard_2024
      JAVA_OPTS: "-Xmx1g -Xms512m"
    ports:
      - "8080:8081"
    volumes:
      - backend_logs_prod:/app/logs
      - backend_uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secured-guard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ========================================
  # FRONTEND
  # ========================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: secured-guard-frontend-prod
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_WS_URL: ws://localhost:8080/ws
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - secured-guard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ========================================
  # REVERSE PROXY (NGINX)
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: secured-guard-nginx-prod
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - secured-guard-network
    restart: unless-stopped

# ========================================
# VOLUMES
# ========================================
volumes:
  postgres_data_prod:
  redis_data_prod:
  backend_logs_prod:
  backend_uploads_prod:

# ========================================
# NETWORKS
# ========================================
networks:
  secured-guard-network:
    driver: bridge
